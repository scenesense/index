name: Deploy approved four posters

on:
  push:
    paths:
      - POSTER_QC_FOUR_TRIGGER

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - name: Build visually approved posters
        run: |
          python - <<'PY'
          import io
          from pathlib import Path
          import requests
          from PIL import Image, ImageDraw, ImageFont

          out=Path('assets/posters'); out.mkdir(parents=True,exist_ok=True)
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 SceneSensePosterQC/1.0','Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'})

          def fetch(url):
              r=s.get(url,timeout=50,allow_redirects=True); r.raise_for_status()
              im=Image.open(io.BytesIO(r.content)).convert('RGB')
              print('FETCH',url,im.size,r.headers.get('content-type'))
              return im

          def crop_frac(im,l=0,t=0,r=0,b=0):
              w,h=im.size
              return im.crop((round(w*l),round(h*t),round(w*(1-r)),round(h*(1-b))))

          def fit23(im,cx=.5,cy=.5):
              w,h=im.size; target=2/3; ratio=w/h
              if ratio>target:
                  nw=round(h*target); x=round((w-nw)*cx); x=max(0,min(x,w-nw)); im=im.crop((x,0,x+nw,h))
              elif ratio<target:
                  nh=round(w/target); y=round((h-nh)*cy); y=max(0,min(y,h-nh)); im=im.crop((0,y,w,y+nh))
              return im.resize((1000,1500),Image.Resampling.LANCZOS)

          def recrop(im,left,top,right,bottom):
              return im.crop((left,top,right,bottom)).resize((1000,1500),Image.Resampling.LANCZOS)

          def font(size,bold=True,italic=False):
              if italic:
                  p='/usr/share/fonts/truetype/dejavu/DejaVuSerif-Italic.ttf'
              elif bold:
                  p='/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf'
              else:
                  p='/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed.ttf'
              return ImageFont.truetype(p,size)

          def draw_centered(im,text,y,fnt,fill=(245,245,245),stroke=4):
              d=ImageDraw.Draw(im)
              box=d.textbbox((0,0),text,font=fnt,stroke_width=stroke)
              x=(im.width-(box[2]-box[0]))//2
              d.text((x,y),text,font=fnt,fill=fill,stroke_width=stroke,stroke_fill=(0,0,0))

          alr=fetch('https://m.media-amazon.com/images/M/MV5BNWJhZDE5MzItODM1Yi00MjlkLTk2NDgtYTFjOWM5MTA2NTlkXkEyXkFqcGc%40._V1_.jpg')
          alr=crop_frac(alr,.055,.035,.055,.405)
          alr=fit23(alr,cx=.58)
          alr=recrop(alr,0,258,1000,1500)
          draw_centered(alr,'A LITTLE ROMANCE',1335,font(58,italic=True),fill=(248,241,218),stroke=3)
          alr.save(out/'a-little-romance-1979.webp','WEBP',quality=84,method=6)

          aliens=fetch('https://posterspy.com/wp-content/uploads/2019/03/aliens-1.jpg')
          aliens=crop_frac(aliens,0,0,0,.205)
          aliens=fit23(aliens,cx=.5,cy=.45)
          aliens=recrop(aliens,0,45,1000,1315)
          draw_centered(aliens,'A L I E N S',1340,font(66,bold=False),fill=(221,239,255),stroke=3)
          aliens.save(out/'aliens-1986.webp','WEBP',quality=84,method=6)

          beauty=fetch('https://i.servimg.com/u/f22/14/42/01/49/717.jpg')
          beauty=fit23(beauty,cx=.53,cy=.5)
          beauty=recrop(beauty,0,0,1000,1420)
          draw_centered(beauty,'BEAUTY AND THE BEAST',1325,font(52,bold=True),fill=(255,221,95),stroke=4)
          beauty.save(out/'beauty-and-the-beast-1991.webp','WEBP',quality=84,method=6)

          chw=fetch('https://flxt.tmsimg.com/assets/p21121_p_v12_al.jpg')
          chw=crop_frac(chw,0,.205,0,0)
          chw=fit23(chw,cx=.5,cy=.52)
          chw=recrop(chw,0,105,1000,1315)
          draw_centered(chw,"CAN'T HARDLY WAIT",1340,font(55,bold=True),fill=(255,255,255),stroke=4)
          chw.save(out/'cant-hardly-wait-1998.webp','WEBP',quality=84,method=6)

          for p in [out/'a-little-romance-1979.webp',out/'aliens-1986.webp',out/'beauty-and-the-beast-1991.webp',out/'cant-hardly-wait-1998.webp']:
              im=Image.open(p)
              if im.size != (1000,1500): raise SystemExit(f'bad size {p}: {im.size}')
              print('APPROVED',p.name,p.stat().st_size)
          PY
      - name: Commit four posters and remove one-shot QC machinery
        run: |
          git config user.name 'SceneSense Poster Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/posters/a-little-romance-1979.webp assets/posters/aliens-1986.webp assets/posters/beauty-and-the-beast-1991.webp assets/posters/cant-hardly-wait-1998.webp
          git rm .github/workflows/poster-qc-four.yml POSTER_QC_FOUR_TRIGGER
          git commit -m 'Replace four posters after visual QC'
          git push
