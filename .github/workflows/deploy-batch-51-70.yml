name: Apply King Solomon II title fit tweak
on:
  push:
    paths: ['.github/workflows/deploy-batch-51-70.yml']
permissions:
  contents: write
jobs:
  tweak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Tighten King Solomon II title only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('styles.css')
          s=p.read_text(encoding='utf-8')
          rule='\n.movieCard[data-movie="king-solomons-mines-ii-2004"] .cardTitle{letter-spacing:0!important}\n'
          if rule.strip() not in s:
              p.write_text(s.rstrip()+rule,encoding='utf-8')
          Path('.github/workflows/deploy-batch-51-70.yml').unlink()
          PY
          git config user.name 'SceneSense Library Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Tighten King Solomon II card title'
          git push origin HEAD:main
