name: Deploy SceneSense batch 51-70

on:
  push:
    paths:
      - BATCH_51_70_TRIGGER

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - name: Download approved QC source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9736729480/zip > /tmp/qc.zip
          unzip -q /tmp/qc.zip -d /tmp/qc
      - name: Build approved 20-film batch
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          root=Path('.')
          source=Path('/tmp/qc/posters')
          metadata=json.loads(Path('/tmp/qc/metadata.json').read_text(encoding='utf-8'))[:20]
          assert len(metadata)==20
          out=root/'assets'/'posters'
          out.mkdir(parents=True,exist_ok=True)

          serif='/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf'
          sans='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'

          def fnt(path,size):
              try: return ImageFont.truetype(path,size)
              except Exception: return ImageFont.load_default()
          def load(slug): return Image.open(source/f'{slug}.webp').convert('RGB')
          def save(img,slug):
              img=img.convert('RGB')
              if img.width>1000:
                  img=img.resize((1000,round(img.height*1000/img.width)),Image.Resampling.LANCZOS)
              img.save(out/f'{slug}.webp','WEBP',quality=82,method=6)
          def gradient(c1,c2,W=1000,H=1500):
              arr=np.zeros((H,W,3),dtype=np.uint8)
              for y in range(H):
                  t=y/(H-1)
                  arr[y,:,0]=round(c1[0]*(1-t)+c2[0]*t)
                  arr[y,:,1]=round(c1[1]*(1-t)+c2[1]*t)
                  arr[y,:,2]=round(c1[2]*(1-t)+c2[2]*t)
              return Image.fromarray(arr)
          def fit_cover(img,size):
              W,H=size
              scale=max(W/img.width,H/img.height)
              nw,nh=round(img.width*scale),round(img.height*scale)
              r=img.resize((nw,nh),Image.Resampling.LANCZOS)
              return r.crop(((nw-W)//2,(nh-H)//2,(nw-W)//2+W,(nh-H)//2+H))
          def band_from_nearby(img,start,end=None,blur=35):
              w,h=img.size
              if end is None: end=h
              start=max(0,int(start)); end=min(h,int(end)); height=end-start
              sy0=max(0,start-60); sy1=min(h,sy0+60)
              band=img.crop((0,sy0,w,sy1)).resize((w,height),Image.Resampling.BICUBIC).filter(ImageFilter.GaussianBlur(blur))
              img.paste(band,(0,start)); return img

          # Clean sources that already meet policy after WebP normalization.
          for slug in ['half-light-2006','heaven-can-wait-1943','holiday-engagement-2011','love-actually-2003']:
              save(load(slug),slug)

          # In a World: clean key art reconstructed from the original portrait artwork.
          src=load('in-a-world-2013')
          canvas=gradient((14,34,45),(26,76,89))
          tex=src.crop((700,930,1000,1482)).resize((1000,1500),Image.Resampling.BICUBIC).filter(ImageFilter.GaussianBlur(2))
          canvas=Image.blend(canvas,tex,0.50)
          portrait=src.crop((0,160,390,1482)).resize((520,1500),Image.Resampling.LANCZOS)
          mask=Image.new('L',(520,1500),255); md=ImageDraw.Draw(mask); md.rectangle((455,0,519,1499),fill=0); mask=mask.filter(ImageFilter.GaussianBlur(35))
          canvas.paste(portrait,(0,0),mask)
          d=ImageDraw.Draw(canvas); ff=fnt(sans,112)
          d.text((535,280),'IN A',font=ff,fill=(224,63,126)); d.text((535,390),'WORLD',font=ff,fill=(224,63,126))
          save(canvas,'in-a-world-2013')

          # In Time: use only the gun-free upper artwork, then finish it as clean portrait key art.
          src=load('in-time-2011')
          top=src.crop((0,0,src.width,int(src.height*.64))).resize((1000,895),Image.Resampling.LANCZOS)
          ImageDraw.Draw(top).rectangle((185,90,230,300),fill=(25,35,42))
          canvas=gradient((19,28,34),(5,8,10)); canvas.paste(top,(0,0))
          overlay=Image.new('RGBA',(1000,1500),(0,0,0,0)); od=ImageDraw.Draw(overlay)
          for yy in range(780,1040):
              a=int(255*(yy-780)/(1040-780)); od.line((0,yy,1000,yy),fill=(5,8,10,a))
          canvas=Image.alpha_composite(canvas.convert('RGBA'),overlay).convert('RGB')
          d=ImageDraw.Draw(canvas); ff=fnt(sans,105); bb=d.textbbox((0,0),'IN TIME',font=ff)
          d.text(((1000-(bb[2]-bb[0]))//2,1120),'IN TIME',font=ff,fill=(242,244,245)); d.rectangle((310,1248,690,1258),fill=(58,195,107))
          save(canvas,'in-time-2011')

          # Last Crusade: remove dense billing/release footer without disturbing painted composition.
          src=load('indiana-jones-the-last-crusade-1989'); band_from_nearby(src,int(src.height*.885)); save(src,'indiana-jones-the-last-crusade-1989')

          # Raiders: rebuild from the gun-free upper Amsel artwork.
          src=load('indiana-jones-raiders-of-the-lost-ark-1981')
          crop=src.crop((18,45,924,865)); art=fit_cover(crop,(900,860)); canvas=gradient((79,48,28),(27,18,13)); canvas.paste(art,(50,90))
          d=ImageDraw.Draw(canvas); d.rectangle((49,89,950,951),outline=(198,136,67),width=5)
          ff=fnt(serif,54); txt='INDIANA JONES'; bb=d.textbbox((0,0),txt,font=ff); d.text(((1000-(bb[2]-bb[0]))//2,1030),txt,font=ff,fill=(232,183,91))
          txt='RAIDERS OF THE LOST ARK'; size=68
          while size>28:
              ff=fnt(serif,size); bb=d.textbbox((0,0),txt,font=ff)
              if bb[2]-bb[0] <= 880: break
              size-=2
          d.text(((1000-(bb[2]-bb[0]))//2,1110),txt,font=ff,fill=(248,225,163))
          save(canvas,'indiana-jones-raiders-of-the-lost-ark-1981')

          # Simple clean footer/header removals.
          simple=[
              ('john-tucker-must-die-2006',.935,(250,250,250)),
              ('jurassic-park-1993',.69,(0,0,0)),
              ('k-19-the-widowmaker-2002',.855,(3,5,9)),
              ('kate-and-leopold-2001',.82,(8,5,6)),
              ('leaving-d-c-2012',.84,(0,0,0)),
              ('me-before-you-2016',.865,(39,35,34)),
          ]
          for slug,start,color in simple:
              src=load(slug); ImageDraw.Draw(src).rectangle((0,int(src.height*start),src.width,src.height),fill=color); save(src,slug)

          # Just in Time for Christmas: remove Hallmark/release branding while retaining the central title art.
          src=load('just-in-time-for-christmas-2015'); w,h=src.size; d=ImageDraw.Draw(src)
          d.rectangle((0,0,w,int(.16*h)),fill=(248,249,247)); d.rectangle((0,int(.71*h),w,int(.78*h)),fill=(247,249,247)); d.rectangle((0,int(.84*h),w,h),fill=(247,249,247)); save(src,'just-in-time-for-christmas-2015')

          # King Kong: retain the classic upper art and title, discard the dense legal/release field.
          src=load('king-kong-1976'); crop=src.crop((0,0,src.width,int(src.height*.735))); crop=crop.resize((1000,round(crop.height*1000/crop.width)),Image.Resampling.LANCZOS)
          canvas=Image.new('RGB',(1000,1500),(247,245,237)); canvas.paste(crop,(0,0)); save(canvas,'king-kong-1976')

          # King Solomon's Mines: clean part-specific key art using a gun-free crop of the source artwork.
          src=load('king-solomons-mines-i-2004'); crop=src.crop((92,78,353,448)); art=fit_cover(crop,(780,1030))
          for part,roman in [('i','I'),('ii','II')]:
              canvas=gradient((54,25,10),(13,8,5)); canvas.paste(art,(110,290)); d=ImageDraw.Draw(canvas); d.rectangle((109,289,891,1321),outline=(180,121,55),width=4)
              ff=fnt(serif,63); txt="KING SOLOMON'S"; bb=d.textbbox((0,0),txt,font=ff); d.text(((1000-(bb[2]-bb[0]))//2,75),txt,font=ff,fill=(234,194,118))
              ff=fnt(serif,92); txt='MINES'; bb=d.textbbox((0,0),txt,font=ff); d.text(((1000-(bb[2]-bb[0]))//2,145),txt,font=ff,fill=(241,208,140))
              ff=fnt(sans,42); txt=f'PART {roman}'; bb=d.textbbox((0,0),txt,font=ff); d.text(((1000-(bb[2]-bb[0]))//2,245),txt,font=ff,fill=(199,152,80))
              save(canvas,f'king-solomons-mines-{part}-2004')

          # Master and Commander: remove tiny release/legal footer.
          src=load('master-and-commander-2003'); band_from_nearby(src,int(src.height*.91),blur=30); save(src,'master-and-commander-2003')

          # Minuscule: retain image/title, remove 3D branding and billing block.
          src=load('minuscule-2013'); crop=src.crop((0,0,src.width,int(src.height*.765))); crop=crop.resize((1000,round(crop.height*1000/crop.width)),Image.Resampling.LANCZOS)
          canvas=gradient((30,55,23),(10,22,9)); canvas.paste(crop,(0,0)); band=crop.crop((0,max(0,crop.height-80),1000,crop.height)).resize((1000,220),Image.Resampling.BICUBIC).filter(ImageFilter.GaussianBlur(18))
          if crop.height<1500: canvas.paste(band,(0,crop.height)); save(canvas,'minuscule-2013')

          # Append exactly 20 films to current remote data.
          data_path=root/'data'/'movies.json'; data=json.loads(data_path.read_text(encoding='utf-8'))
          assert len(data.get('movies',[]))==50, f"Expected 50 movies before batch, found {len(data.get('movies',[]))}"
          existing_ids={m['id'] for m in data['movies']}
          new=[]
          for x in metadata:
              assert x['slug'] not in existing_ids, f"Duplicate movie: {x['slug']}"
              entry={
                  'id':x['slug'], 'title':x['title'], 'year':x['year'],
                  'runtimeMinutes':(int(x['runtimeSeconds'])+30)//60,
                  'version':x['version'], 'poster':f"assets/posters/{x['slug']}.webp",
                  'description':x['description'], 'actors':x['actors'], 'ratings':{}
              }
              if x.get('sortTitle'): entry['sortTitle']=x['sortTitle']
              new.append(entry)
          assert len(new)==20
          data['movies'].extend(new)
          assert len(data['movies'])==70
          data_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Verify all poster files exist and are valid WebPs before commit.
          for x in metadata:
              p=out/f"{x['slug']}.webp"; assert p.exists() and p.stat().st_size>5000
              with Image.open(p) as im: assert im.format=='WEBP' and im.width>300 and im.height>400
          print('Prepared exactly 20 movies and 20 approved posters.')
          PY
      - name: Commit batch and remove temporary deployment files
        run: |
          rm -f .github/workflows/deploy-batch-51-70.yml BATCH_51_70_TRIGGER
          git config user.name "SceneSense Batch Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add data/movies.json assets/posters .github/workflows/deploy-batch-51-70.yml BATCH_51_70_TRIGGER
          git diff --cached --stat
          test "$(git diff --cached --name-only | grep '^assets/posters/.*\.webp$' | wc -l)" -eq 20
          git commit -m "Add SceneSense movies 51-70"
          git push origin main
