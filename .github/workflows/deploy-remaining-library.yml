name: Deploy remaining SceneSense library

on:
  push:
    paths:
      - REMAINING_DEPLOY_TRIGGER

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - name: Build 153-film library
        run: |
          python - <<'PY'
          import io,json,re,unicodedata,difflib,urllib.parse
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import requests
          from PIL import Image

          data_path=Path('data/movies.json')
          data=json.loads(data_path.read_text(encoding='utf-8'))
          existing=data['movies']
          assert len(existing)==50, f'Expected 50 existing films, got {len(existing)}'
          manifest=json.load(open('data/remaining_batch_manifest.json',encoding='utf-8'))
          assert len(manifest)==103

          EXISTING_EXACT={
            '2010 The Year We Make Contact|1984':'01:55:56','500 Days of Summer|2009':'01:35:04','A 90s Christmas|2024':'01:24:02',
            'A Biltmore Christmas|2023':'01:24:00','A Bird of the Air|2011':'01:38:15','A Bride for Christmas|2012':'01:27:29',
            'A Little Romance|1979':'01:50:02','A Picture of Her|2023':'01:24:00','Alien|1979':'02:00:57','Aliens|1986':'02:34:27',
            'An Hour Behind|2017':'01:30:14','An Unfinished Life|2005':'01:47:51','Arachnophobia|1990':'01:49:42',
            'Arn I Tempelriddaren|2007':'02:19:13','Arn II Riket Vid Vagens Slut|2008':'02:07:36','Back to the Future|1985':'01:56:02',
            'Back to the Future II|1989':'01:48:03','Back to the Future III|1990':'01:58:18','Batman Begins|2005':'02:20:03',
            'Beauty and the Beast|1991':'01:31:45','Before I Fall|2017':'01:38:48','Big|1988':'02:10:25','Blame It on Rio|1984':'01:39:57',
            'Bring It On|2000':'01:39:01','Cant Buy My Love|2017':'01:26:00','Cant Hardly Wait|1998':'01:40:30','Cars|2006':'01:56:36',
            'Casanova|2005':'01:51:36','Chances Are|1989':'01:48:18','Chaos Theory|2008':'01:27:18','Charlies Angels|1976':'01:14:15',
            'Christmas with Holly|2012':'01:31:50','Christmas with the Knightlys|2023':'01:25:51','Crazy Stupid Love|2011':'01:58:07',
            'Crusoe|2008':'01:26:06','Dangerous Beauty|1998':'01:51:43','Dark Water|2005':'01:44:40','Dashing Home for Christmas|2020':'01:31:15',
            'Deja Vu|2006':'02:06:45','Desk Set|1957':'01:43:33','Dragonheart|1996':'01:44:16','Easy A|2010':'01:32:24',
            'Farmer Seeking Love|2022':'01:30:06','Finding Christmas|2013':'01:25:43','Finding Neverland|2004':'01:41:09',
            'Flight of the Navigator|1986':'01:29:34','Flyboys|2006':'02:18:39','French Kiss|1995':'01:51:13','Gojira Mainasu Wan|2023':'02:04:38',
            'Guess Whos Coming to Dinner|1967':'01:48:08'
          }
          def ascii_words(x):
              x=unicodedata.normalize('NFKD',str(x)).encode('ascii','ignore').decode()
              return re.sub(r'[^A-Za-z0-9]+',' ',x).strip()
          def exact_key(title,year): return f'{ascii_words(title)}|{year}'
          def hms_seconds(v):
              h,m,s=map(int,v.split(':')); return h*3600+m*60+s
          for movie in existing:
              key=exact_key(movie['title'],movie['year'])
              if key not in EXISTING_EXACT: raise RuntimeError(f'Missing exact runtime for existing {key}')
              movie['runtimeExact']=EXISTING_EXACT[key]
              movie['runtimeSeconds']=hms_seconds(movie['runtimeExact'])

          MANUAL={
            'Indiana Jones: Raiders of the Lost Ark':'tt0082971','Indiana Jones: The Last Crusade':'tt0097576',
            'Spider-Man I':'tt0145487','Spider-Man II':'tt0316654','Star Trek: The Cage':'tt0059753',
            'Star Trek: The Motion Picture':'tt0079945','Star Trek II: The Wrath of Khan':'tt0084726',
            'Star Trek III: The Search for Spock':'tt0088170','Star Trek IV: The Voyage Home':'tt0092007',
            'Star Trek VI: The Undiscovered Country':'tt0102975','Star Trek Generations':'tt0111280',
            'Star Trek: First Contact':'tt0117731','Star Trek: Insurrection':'tt0120844',
            'Star Wars: A New Hope':'tt0076759','Star Wars: The Empire Strikes Back':'tt0080684','Star Wars: Return of the Jedi':'tt0086190',
            'King Solomon’s Mines I':'tt0397501','King Solomon’s Mines II':'tt0397501','The Forty Four Hundred':'tt0389564',
            'White Collar':'tt1358522','Wallace and Gromit':'tt0312004','The Princess and the Marine':'tt0272255','Un Plan Parfait':'tt1986843'
          }
          ALLOW_YEAR={'Star Trek: The Cage'}
          ALLOW_ALIAS={'Un Plan Parfait'}
          HEAD={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'en-US,en;q=0.9'}
          GHEAD={'accept':'application/graphql+json, application/json','content-type':'application/json','origin':'https://www.imdb.com','referer':'https://www.imdb.com/','x-imdb-client-name':'imdb-web-next','x-imdb-user-language':'en-US','x-imdb-user-country':'US','user-agent':'Mozilla/5.0'}
          QUERY='''query SceneSenseTitle($id: ID!) {
            title(id: $id) {
              id titleText { text } titleType { id text } releaseYear { year endYear }
              plot { plotText { plainText } } genres { genres { text } } primaryImage { url width height }
              principalCredits { category { id text } credits { name { id nameText { text } } } }
              credits(first: 25, filter: { categories: ["actor", "actress"] }) { edges { node { name { id nameText { text } } category { id text } } } }
            }
          }'''
          def norm(x): return re.sub(r'[^a-z0-9]+','',unicodedata.normalize('NFKD',str(x)).encode('ascii','ignore').decode().lower())
          def slugify(x): return re.sub(r'[^a-z0-9]+','-',unicodedata.normalize('NFKD',str(x)).encode('ascii','ignore').decode().lower()).strip('-')
          def sess(): s=requests.Session(); s.headers.update(HEAD); return s
          def suggest(item,s):
              if item['displayTitle'] in MANUAL: return MANUAL[item['displayTitle']], {'manual':True}
              best=None
              queries=[]
              for q in [item.get('query'),item.get('title'),item.get('displayTitle')]:
                  if q and q not in queries: queries.append(q)
              for q in queries:
                  r=s.get('https://v3.sg.media-imdb.com/suggestion/x/'+urllib.parse.quote(q)+'.json',timeout=30); r.raise_for_status()
                  for hit in r.json().get('d',[]):
                      tid=str(hit.get('id','')); hy=hit.get('y')
                      if not tid.startswith('tt') or hy!=item['year']: continue
                      label=hit.get('l',''); sim=max(difflib.SequenceMatcher(None,norm(x),norm(label)).ratio() for x in [item.get('query',''),item.get('title',''),item.get('displayTitle','')] if x)
                      if best is None or sim>best[0]: best=(sim,tid,hit)
                  if best and best[0]>=.92: break
              if not best: raise RuntimeError(f'No exact-year IMDb match for {item["displayTitle"]}')
              return best[1],best[2]
          def detail(tid):
              r=requests.post('https://caching.graphql.imdb.com/',headers=GHEAD,json={'query':QUERY,'variables':{'id':tid}},timeout=35); r.raise_for_status(); js=r.json()
              if js.get('errors'): raise RuntimeError(str(js['errors']))
              t=(js.get('data') or {}).get('title')
              if not t: raise RuntimeError(f'No IMDb detail for {tid}')
              return t
          def cast(t):
              names=[]
              for pc in t.get('principalCredits') or []:
                  if (pc.get('category') or {}).get('id')!='cast': continue
                  for c in pc.get('credits') or []:
                      n=((c.get('name') or {}).get('nameText') or {}).get('text')
                      if n and n not in names: names.append(n)
              for e in ((t.get('credits') or {}).get('edges') or []):
                  n=((((e.get('node') or {}).get('name') or {}).get('nameText') or {}).get('text'))
                  if n and n not in names: names.append(n)
                  if len(names)>=5: break
              return names[:5]
          GENRE_OVERRIDES={
            'Half Light':['Mystery','Thriller','Drama','Romance'],'Heaven Can Wait':['Comedy','Romance','Fantasy'],'Holiday Engagement':['Christmas','Romance','Comedy'],
            'In a World':['Comedy','Drama','Romance'],'In Time':['Science Fiction','Thriller','Action'],'Indiana Jones: Raiders of the Lost Ark':['Adventure','Action'],
            'Indiana Jones: The Last Crusade':['Adventure','Action'],'John Tucker Must Die':['Comedy','Romance'],'Jurassic Park':['Adventure','Science Fiction','Thriller'],
            'Just in Time for Christmas':['Christmas','Romance','Fantasy','Drama'],'K-19: The Widowmaker':['Drama','Thriller'],'Kate and Leopold':['Romance','Comedy','Fantasy'],
            'King Kong':['Adventure','Drama','Fantasy'],'King Solomon’s Mines I':['Adventure','Action','Drama'],'King Solomon’s Mines II':['Adventure','Action','Drama'],
            'Leaving D.C.':['Horror','Mystery','Thriller'],'Love Actually':['Romance','Comedy','Drama'],'Master and Commander':['Adventure','Drama','Action'],
            'Me Before You':['Romance','Drama'],'Minuscule':['Adventure','Comedy'],'Miracle':['Drama'],'Monsoon':['Drama','Romance'],'Moon':['Science Fiction','Drama','Mystery'],
            'Much Ado About Christmas':['Christmas','Romance','Comedy'],'National Treasure':['Adventure','Action','Mystery'],'Next Stop Christmas':['Christmas','Romance','Fantasy'],
            'Nick and Norah’s Infinite Playlist':['Romance','Comedy','Drama'],'Oblivion':['Science Fiction','Adventure','Action','Drama'],'Peter Pan':['Adventure','Fantasy','Romance'],
            'Pirates of the Caribbean':['Adventure','Action','Fantasy','Comedy'],'Premonition':['Thriller','Mystery','Drama','Fantasy'],'Ratatouille':['Comedy','Drama'],
            'Remember Sunday':['Romance','Drama'],'Robot and Frank':['Drama','Comedy','Science Fiction'],'Say Anything':['Romance','Comedy','Drama'],'Scoop':['Comedy','Mystery','Romance'],
            'Secondhand Lions':['Drama','Comedy','Adventure'],'Shades of Ray':['Comedy','Romance','Drama'],'Signs':['Thriller','Science Fiction','Drama','Mystery'],
            'Six Days Seven Nights':['Adventure','Comedy','Romance'],'Snow Bride':['Christmas','Romance','Comedy'],'Some Kind of Wonderful':['Romance','Drama'],
            'Source Code':['Science Fiction','Thriller','Mystery'],'Spider-Man I':['Action','Adventure','Romance','Fantasy'],'Spider-Man II':['Action','Adventure','Romance','Fantasy'],
            'Spirit: Stallion of the Cimarron':['Adventure','Drama'],'Star Trek: The Cage':['Science Fiction','Adventure','Drama'],'Star Trek: The Motion Picture':['Science Fiction','Adventure'],
            'Star Trek II: The Wrath of Khan':['Science Fiction','Adventure','Action'],'Star Trek III: The Search for Spock':['Science Fiction','Adventure'],
            'Star Trek IV: The Voyage Home':['Science Fiction','Adventure','Comedy'],'Star Trek VI: The Undiscovered Country':['Science Fiction','Adventure','Mystery'],
            'Star Trek Generations':['Science Fiction','Adventure'],'Star Trek: First Contact':['Science Fiction','Adventure','Action'],'Star Trek: Insurrection':['Science Fiction','Adventure','Action'],
            'Star Wars: A New Hope':['Adventure','Science Fiction','Action'],'Star Wars: The Empire Strikes Back':['Adventure','Science Fiction','Action'],
            'Star Wars: Return of the Jedi':['Adventure','Science Fiction','Action'],'Stargate':['Science Fiction','Adventure','Action'],'Stealing Christmas':['Christmas','Comedy','Romance'],
            'Superman Returns':['Action','Adventure','Science Fiction','Romance'],'Surprised by Love':['Romance','Comedy','Drama'],'Tangled':['Musical','Adventure','Romance','Fantasy','Comedy'],
            'Team Bride':['Romance','Comedy','Drama'],'The Abyss':['Science Fiction','Adventure','Thriller','Drama'],'The Adjustment Bureau':['Science Fiction','Romance','Thriller'],
            'The Age of Adaline':['Romance','Drama','Fantasy'],'The Blue Lagoon':['Romance','Drama','Adventure'],'The Children’s Hour':['Drama'],
            'The Day the Earth Stood Still':['Science Fiction','Drama'],'The Englishman Who Went Up a Hill':['Comedy','Romance','Drama'],'The First Time':['Romance','Comedy','Drama'],
            'The Forty Four Hundred':['Science Fiction','Drama','Mystery'],'The Ghost and Mrs. Muir':['Romance','Fantasy','Drama'],'The Greatest Game Ever Played':['Drama'],
            'The Imitation Game':['Drama'],'The Iron Giant':['Science Fiction','Adventure','Drama'],'The Island':['Science Fiction','Action','Thriller'],
            'The Lake House':['Romance','Drama','Fantasy'],'The Last Letter from Your Lover':['Romance','Drama'],'The Man from Earth':['Science Fiction','Drama'],
            'The Most Colorful Time of the Year':['Christmas','Romance','Comedy'],'The Notebook':['Romance','Drama'],'The Phantom of the Opera':['Musical','Romance','Drama'],
            'The Princess and the Marine':['Romance','Drama'],'The Soulmate Search':['Romance','Comedy'],'The Sure Thing':['Romance','Comedy'],
            'The Terminator':['Science Fiction','Action','Thriller'],'The Time Traveler’s Wife':['Romance','Drama','Science Fiction'],'The Vow':['Romance','Drama'],
            'The X-Files':['Science Fiction','Mystery','Thriller'],'Timeless Love':['Romance','Drama'],'Un Plan Parfait':['Romance','Comedy','Adventure'],
            'Waiting for Forever':['Romance','Drama'],'WALL-E':['Adventure','Romance','Science Fiction','Comedy'],'Wallace and Gromit':['Comedy','Adventure'],
            'When Love Springs':['Romance','Comedy'],'When We First Met':['Romance','Comedy','Fantasy'],'White Collar':['Drama','Comedy','Crime'],
            'Wicker Park':['Romance','Mystery','Drama','Thriller'],'Win a Date with Tad Hamilton':['Romance','Comedy'],'Wonder Woman':['Action','Adventure','Fantasy'],'You’ve Got Mail':['Romance','Comedy']
          }
          MAP={'Sci-Fi':'Science Fiction','Action':'Action','Adventure':'Adventure','Comedy':'Comedy','Crime':'Crime','Drama':'Drama','Horror':'Horror','Romance':'Romance','Thriller':'Thriller','Western':'Western','Musical':'Musical','Mystery':'Mystery','Fantasy':'Fantasy'}
          poster_dir=Path('assets/posters'); poster_dir.mkdir(parents=True,exist_ok=True)
          def work(pair):
              i,item=pair; s=sess(); tid,hit=suggest(item,s); t=detail(tid); actual=(t.get('releaseYear') or {}).get('year')
              if actual and actual!=item['year'] and item['displayTitle'] not in ALLOW_YEAR: raise RuntimeError(f'Year mismatch {item["displayTitle"]}: {actual}')
              source=((t.get('titleText') or {}).get('text') or '').strip()
              if item['displayTitle'] not in ALLOW_ALIAS:
                  sim=max(difflib.SequenceMatcher(None,norm(x),norm(source)).ratio() for x in [item.get('query',''),item.get('title',''),item.get('displayTitle','')] if x)
                  if sim<.42: raise RuntimeError(f'Title mismatch {item["displayTitle"]}: {source}')
              image=t.get('primaryImage') or {}; url=image.get('url')
              if not url and isinstance(hit,dict): url=(hit.get('i') or {}).get('imageUrl')
              if not url: raise RuntimeError(f'No poster for {item["displayTitle"]}')
              rr=s.get(url,timeout=45); rr.raise_for_status(); im=Image.open(io.BytesIO(rr.content)).convert('RGB')
              if im.height<=im.width: raise RuntimeError(f'Nonportrait poster {item["displayTitle"]}: {im.size}')
              im.thumbnail((1000,1500),Image.Resampling.LANCZOS)
              slug=slugify(item['displayTitle'])+'-'+str(item['year']); im.save(poster_dir/f'{slug}.webp','WEBP',quality=82,method=6)
              desc=((((t.get('plot') or {}).get('plotText') or {}).get('plainText')) or '').strip()
              actors=cast(t)
              if len(actors)<3: raise RuntimeError(f'Too few actors for {item["displayTitle"]}')
              raw=[g.get('text') for g in ((t.get('genres') or {}).get('genres') or []) if g.get('text')]
              genres=GENRE_OVERRIDES.get(item['displayTitle']) or []
              if not genres:
                  for g in raw:
                      mapped=MAP.get(g)
                      if mapped and mapped not in genres: genres.append(mapped)
                  if not genres: genres=['Drama']
              rec={'id':slug,'title':item['displayTitle'],'year':item['year'],'runtimeMinutes':round(item['runtimeSeconds']/60),'runtimeSeconds':item['runtimeSeconds'],'runtimeExact':item['runtimeExact'],'version':item['version'],'imdbId':tid,'poster':f'assets/posters/{slug}.webp','description':desc,'actors':actors,'genres':genres,'ratings':{}}
              if item.get('sortTitle'): rec['sortTitle']=item['sortTitle']
              return i,rec
          results=[None]*len(manifest); errors=[]
          with ThreadPoolExecutor(max_workers=6) as ex:
              futs={ex.submit(work,p):p for p in enumerate(manifest)}
              for fut in as_completed(futs):
                  i,item=futs[fut]
                  try:
                      ix,rec=fut.result(); results[ix]=rec; print(f'{ix+1:03d} OK {rec["title"]}',flush=True)
                  except Exception as e:
                      errors.append((item['displayTitle'],repr(e))); print('FAIL',item['displayTitle'],e,flush=True)
          if errors: raise RuntimeError('Metadata failures: '+repr(errors))
          old_by_id={m['id']:m for m in existing}
          for rec in results:
              if rec['id'] in old_by_id:
                  rec['ratings']=old_by_id[rec['id']].get('ratings',{})
          data['movies']=existing+results
          assert len(data['movies'])==153
          assert len({m['id'] for m in data['movies']})==153
          assert all(m.get('runtimeExact') and isinstance(m.get('runtimeSeconds'),int) for m in data['movies'])
          data_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Update the enhancement layer for data-native genres, exact runtimes, and franchise-aware title sorting.
          p=Path('index.html'); html=p.read_text(encoding='utf-8')
          html=html.replace('function genresFor(movie){return movie?(MOVIE_GENRES[movie.id]||[]):[]}', 'function genresFor(movie){return movie?(movie.genres||MOVIE_GENRES[movie.id]||[]):[]}')
          html=html.replace('function splitDisplayTitle(title){', 'function runtimeText(movie){return movie?.runtimeExact||`${movie?.runtimeMinutes??"—"} min`}function runtimeValue(movie){return Number.isFinite(movie?.runtimeSeconds)?movie.runtimeSeconds:(movie?.runtimeMinutes??0)*60}function librarySortKey(movie){return String(movie?.sortTitle||movie?.title||"")}function titleGroupKey(movie){const s=librarySortKey(movie);return movie?.sortTitle?s.replace(/\\s+\\d+$/," ").trim():s}function compareTitleOrder(a,b,descending=false){const ga=titleGroupKey(a),gb=titleGroupKey(b),sa=librarySortKey(a),sb=librarySortKey(b);if(ga===gb&&(a.sortTitle||b.sortTitle))return sa.localeCompare(sb,undefined,{numeric:true});const group=ga.localeCompare(gb,undefined,{numeric:true});if(group)return descending?-group:group;return sa.localeCompare(sb,undefined,{numeric:true})}function splitDisplayTitle(title){')
          html=html.replace('$("detailMeta").textContent=`${movie.year} · ${movie.runtimeMinutes} min · ${movie.version}`;', '$("detailMeta").textContent=`${movie.year} · ${runtimeText(movie)} · ${movie.version}`;')
          html=html.replace('meta.textContent=`${movie.year} · ${movie.runtimeMinutes} min · ${movie.version}`;', 'meta.textContent=`${movie.year} · ${runtimeText(movie)} · ${movie.version}`;')
          old='function movieSearchText(movie){return[movie.title,movie.year,movie.version,...genresFor(movie),...(movie.actors||[])].join(" ").toLowerCase()}function compareLibraryMovies(a,b){const titleAsc=a.title.localeCompare(b.title);switch(sortMode){case"score-asc":{const sa=overallScore(a)??0,sb=overallScore(b)??0;return sa!==sb?sa-sb:titleAsc}case"title":return titleAsc;case"title-desc":return b.title.localeCompare(a.title);case"year":return a.year-b.year||titleAsc;case"year-desc":return b.year-a.year||titleAsc;case"runtime":return a.runtimeMinutes-b.runtimeMinutes||titleAsc;case"runtime-desc":return b.runtimeMinutes-a.runtimeMinutes||titleAsc;case"score":default:{const sa=overallScore(a)??0,sb=overallScore(b)??0;return sb!==sa?sb-sa:titleAsc}}}'
          new='function movieSearchText(movie){return[movie.title,movie.year,movie.version,...genresFor(movie),...(movie.actors||[])].join(" ").toLowerCase()}function compareLibraryMovies(a,b){const titleAsc=compareTitleOrder(a,b,false);switch(sortMode){case"score-asc":{const sa=overallScore(a)??0,sb=overallScore(b)??0;return sa!==sb?sa-sb:titleAsc}case"title":return titleAsc;case"title-desc":return compareTitleOrder(a,b,true);case"year":return a.year-b.year||titleAsc;case"year-desc":return b.year-a.year||titleAsc;case"runtime":return runtimeValue(a)-runtimeValue(b)||titleAsc;case"runtime-desc":return runtimeValue(b)-runtimeValue(a)||titleAsc;case"score":default:{const sa=overallScore(a)??0,sb=overallScore(b)??0;return sb!==sa?sb-sa:titleAsc}}}'
          if old not in html: raise RuntimeError('Could not locate comparator enhancement')
          html=html.replace(old,new)
          old_open='const baseOpenMovie=openMovie;openMovie=function(id,updateHash=true){baseOpenMovie(id,updateHash);const movie=movieById(id);renderMovieIdentity(movie);renderPrincipalCast(movie);if(movie&&!movie.poster){const detail=document.getElementById("detailPoster");if(detail)detail.removeAttribute("src")}applyPosterFallbacks()}'
          new_open='const baseOpenMovie=openMovie;openMovie=function(id,updateHash=true){baseOpenMovie(id,updateHash);const movie=movieById(id);renderMovieIdentity(movie);queueMicrotask(()=>renderMovieIdentity(movie));renderPrincipalCast(movie);if(movie&&!movie.poster){const detail=document.getElementById("detailPoster");if(detail)detail.removeAttribute("src")}applyPosterFallbacks()}'
          if old_open not in html: raise RuntimeError('Could not locate enhanced openMovie')
          html=html.replace(old_open,new_open)
          p.write_text(html,encoding='utf-8')

          # Validate title order requirements directly using the stored sort keys.
          movies=data['movies']
          def sk(m): return m.get('sortTitle',m['title'])
          for prefix,expected in {
            'Indiana Jones':['Indiana Jones: Raiders of the Lost Ark','Indiana Jones: The Last Crusade'],
            'Star Trek':['Star Trek: The Cage','Star Trek: The Motion Picture','Star Trek II: The Wrath of Khan','Star Trek III: The Search for Spock','Star Trek IV: The Voyage Home','Star Trek VI: The Undiscovered Country','Star Trek Generations','Star Trek: First Contact','Star Trek: Insurrection'],
            'Star Wars':['Star Wars: A New Hope','Star Wars: The Empire Strikes Back','Star Wars: Return of the Jedi']
          }.items():
              got=[m['title'] for m in sorted([x for x in movies if sk(x).startswith(prefix)],key=sk)]
              if got!=expected: raise RuntimeError(f'{prefix} order wrong: {got}')
          print('Validated 153 films, exact runtimes, local posters and franchise order.')
          PY
      - name: Remove temporary migration machinery
        run: |
          rm -f .github/workflows/remaining-inspect.yml .github/workflows/remaining-qc-fast.yml .github/workflows/remaining-qc-safe.yml .github/workflows/deploy-remaining-library.yml
          rm -f REMAINING_INSPECT_TRIGGER REMAINING_FAST_TRIGGER REMAINING_SAFE_TRIGGER REMAINING_DEPLOY_TRIGGER
          rm -f data/remaining_batch_manifest.json
      - name: Validate scope and commit
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('data/movies.json',encoding='utf-8'))
          assert len(d['movies'])==153
          assert all(m['poster'].startswith('assets/posters/') and m['poster'].endswith('.webp') for m in d['movies'])
          assert all(os.path.isfile(m['poster']) for m in d['movies'])
          assert all(m.get('runtimeExact') and m.get('runtimeSeconds') for m in d['movies'])
          print('Final validation passed.')
          PY
          git config user.name "SceneSense Library Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Add remaining 103 films and exact runtimes"
          git push origin HEAD:main
