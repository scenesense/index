name: Align detail Blu-ray with score

on:
  push:
    paths:
      - '.github/workflows/align-detail-bluray-with-score.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Put Blu-ray logo on score line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.detailBlurayBadge{position:absolute;left:0;top:86px;display:block;width:150px;height:58px;object-fit:contain;object-position:left center;filter:drop-shadow(0 7px 14px rgba(0,0,0,.48));pointer-events:none}'
          new = '.detailBlurayBadge{position:static;display:block;width:auto;height:64px;object-fit:contain;object-position:left center;margin-left:28px;flex:0 0 auto;filter:drop-shadow(0 7px 14px rgba(0,0,0,.48));pointer-events:none}'
          if s.count(old) != 1:
              raise RuntimeError(f'Expected current Blu-ray CSS once, found {s.count(old)}')
          score_markup = '<div class="scoreLine"><div class="overallScore" id="overallScore">—</div><div><div class="scoreCaption">overall score</div><div class="progressText" id="progressText">0 / 75 rated</div></div><img id="detailBlurayBadge" class="detailBlurayBadge" src="assets/format-logos/BLURAY.webp" alt="UHD Blu-ray" hidden></div>'
          if s.count(score_markup) != 1:
              raise RuntimeError('Score markup changed unexpectedly')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "SceneSense maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Align detail Blu-ray logo with score row"
          git push origin HEAD:main
