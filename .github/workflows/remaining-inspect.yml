name: Probe IMDb cast credits

on:
  push:
    paths:
      - REMAINING_INSPECT_TRIGGER

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe full cast credits
        run: |
          python - <<'PY'
          import requests
          q='''query CastProbe($id: ID!) {
            title(id: $id) {
              titleText { text }
              credits(first: 10, filter: { categories: ["actor", "actress"] }) {
                edges { node { name { id nameText { text } } category { id text } } }
              }
            }
          }'''
          headers={'accept':'application/graphql+json, application/json','content-type':'application/json','origin':'https://www.imdb.com','referer':'https://www.imdb.com/','x-imdb-client-name':'imdb-web-next','x-imdb-user-language':'en-US','x-imdb-user-country':'US','user-agent':'Mozilla/5.0'}
          r=requests.post('https://caching.graphql.imdb.com/',headers=headers,json={'query':q,'variables':{'id':'tt1637688'}},timeout=30)
          print('STATUS',r.status_code,'LEN',len(r.text)); print(r.text[:12000])
          PY
