name: Probe IMDb metadata

on:
  push:
    paths:
      - REMAINING_INSPECT_TRIGGER

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Probe suggestion and title JSON-LD
        run: |
          python - <<'PY'
          import json,requests,urllib.parse
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'en-US,en;q=0.9'})
          q='In Time'
          url='https://v3.sg.media-imdb.com/suggestion/x/'+urllib.parse.quote(q)+'.json'
          r=s.get(url,timeout=30); print('SUGGEST',r.status_code,r.url); r.raise_for_status(); js=r.json(); print(json.dumps(js.get('d',[])[:5],ensure_ascii=False)[:4000])
          cand=[x for x in js.get('d',[]) if x.get('y')==2011 and str(x.get('id','')).startswith('tt')]
          x=cand[0]; tid=x['id']; print('CHOSEN',tid,x.get('l'),x.get('y'),x.get('q'),x.get('i'))
          p=s.get(f'https://www.imdb.com/title/{tid}/',timeout=30); print('PAGE',p.status_code,len(p.text)); p.raise_for_status(); soup=BeautifulSoup(p.text,'html.parser')
          blobs=[]
          for tag in soup.select('script[type="application/ld+json"]'):
              try: blobs.append(json.loads(tag.string or tag.get_text()))
              except Exception: pass
          print('JSONLD_COUNT',len(blobs))
          for b in blobs:
              if isinstance(b,dict):
                  print('NAME',b.get('name')); print('IMAGE',b.get('image')); print('GENRE',b.get('genre')); print('DESC',b.get('description')); print('ACTORS',[a.get('name') for a in (b.get('actor') or [])[:8] if isinstance(a,dict)])
          PY
