name: Inspect remaining metadata

on:
  push:
    paths:
      - REMAINING_INSPECT_TRIGGER

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Inspect TMDB search markup
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import quote
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9'})
          u='https://www.themoviedb.org/search/movie?query='+quote('Desk Set')+'&language=en-US'
          r=s.get(u,timeout=30); r.raise_for_status(); soup=BeautifulSoup(r.text,'html.parser')
          print('cards',len(soup.select('div.card.v4.tight')))
          for card in soup.select('div.card.v4.tight')[:10]:
            print('CARD',card.get_text(' ',strip=True)[:400])
            print('LINKS',[(a.get_text(' ',strip=True),a.get('href')) for a in card.select('a[href^="/movie/"]')[:5]])
            print('DATE',[x.get_text(' ',strip=True) for x in card.select('.release_date,.release')])
          print('all movie links',[(a.get_text(' ',strip=True),a.get('href')) for a in soup.select('a[href^="/movie/"]')[:20]])
          PY
