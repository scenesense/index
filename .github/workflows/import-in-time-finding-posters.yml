name: Import In Time and Finding Christmas posters
on:
  push:
    paths:
      - .github/workflows/import-in-time-finding-posters.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import supplied posters unchanged
        run: |
          mkdir -p assets/posters
          curl -L --fail --retry 3 'https://i.pinimg.com/736x/c1/b2/c0/c1b2c0e93e206bc2caf1f4fef39ead47.jpg' -o assets/posters/in-time-2011.jpg
          curl -L --fail --retry 3 'https://m.media-amazon.com/images/M/MV5BMTEwNTIzMTM3MDNeQTJeQWpwZ15BbWU4MDQ3NDA5NjAx._V1_.jpg' -o assets/posters/finding-christmas-2013.jpg
      - name: Update poster references genres and subtitle size
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('data/movies-additions-20260830.json')
          s=p.read_text()
          old='"poster": "https://pics.filmaffinity.com/In_Time-139117348-large.jpg"'
          new='"poster": "assets/posters/in-time-2011.jpg"'
          assert old in s
          s=s.replace(old,new,1)
          old='''"genres": [\n        "Horror",\n        "Mystery",\n        "Thriller"\n      ]'''
          new='''"genres": [\n        "Mystery",\n        "Horror",\n        "Thriller"\n      ]'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('data/movies.json')
          s=p.read_text()
          old='"poster": "assets/posters/finding-christmas-2013.webp"'
          new='"poster": "assets/posters/finding-christmas-2013.jpg"'
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path('index.html')
          s=p.read_text()
          old='font-size:17px;font-weight:500;line-height:1.15'
          new='font-size:16px;font-weight:500;line-height:1.15'
          assert old in s
          s=s.replace(old,new,1)
          old='@media(max-width:620px){.cardSubtitle{font-size:14px}'
          new='@media(max-width:620px){.cardSubtitle{font-size:13px}'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit updates
        run: |
          git config user.name "SceneSense Library Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/posters/in-time-2011.jpg assets/posters/finding-christmas-2013.jpg data/movies-additions-20260830.json data/movies.json index.html
          git commit -m "Update In Time and Finding Christmas presentation"
          git push
