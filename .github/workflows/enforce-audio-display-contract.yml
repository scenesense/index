name: Enforce audio display contract
on:
  push:
    paths:
      - '.github/workflows/enforce-audio-display-contract.yml'
permissions:
  contents: write
jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch audio contract
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit changes
        run: |
          git config user.name "soap2"
          git config user.email "46655904+soap2@users.noreply.github.com"
          git rm -f .github/workflows/enforce-audio-display-contract.yml
          git add audio-metadata-base.js TV_SERIES_INTEGRATION_GUIDE.md
          git commit -m "Enforce strict audio display labels"
          git push origin HEAD:main
