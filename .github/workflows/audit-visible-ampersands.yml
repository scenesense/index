name: Audit visible ampersands
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    if: contains(github.event.head_commit.message, 'Run visible ampersand audit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository content
        run: python .tmp-audit-visible-ampersands.py
