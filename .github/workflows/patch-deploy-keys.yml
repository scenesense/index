name: Correct deployment runtime keys

on:
  push:
    paths:
      - PATCH_DEPLOY_KEYS_TRIGGER

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct punctuation-normalized keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-remaining-library.yml')
          s=p.read_text(encoding='utf-8')
          for old,new in {
            "'Cant Buy My Love|2017'":"'Can t Buy My Love|2017'",
            "'Cant Hardly Wait|1998'":"'Can t Hardly Wait|1998'",
            "'Charlies Angels|1976'":"'Charlie s Angels|1976'",
            "'Guess Whos Coming to Dinner|1967'":"'Guess Who s Coming to Dinner|1967'"
          }.items():
              if old not in s: raise SystemExit(f'missing key {old}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "SceneSense Config Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/deploy-remaining-library.yml
          git commit -m "Correct exact-runtime punctuation keys"
          git push origin HEAD:main
