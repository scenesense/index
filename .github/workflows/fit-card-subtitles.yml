name: Fit card subtitle widths
on:
  push:
    paths:
      - '.github/workflows/fit-card-subtitles.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fit second-line card titles to width
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('font-family:"Saira Condensed","Saira",ui-sans-serif,system-ui,sans-serif!important;font-size:17px;', 'font-family:"Saira",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif!important;font-size:17px;')
          old = 'function fitAllCardGenres(){document.querySelectorAll(".movieCard").forEach(card=>{const movie=movieById(card.dataset.movie);const row=card.querySelector(".cardGenres");if(movie&&row)fitCardGenres(row,movie)})}'
          new = old + 'function fitCardSubtitle(row){if(!row)return;row.style.fontSize="";const base=parseFloat(getComputedStyle(row).fontSize)||17;if(row.scrollWidth>row.clientWidth&&row.clientWidth>0){row.style.fontSize=`${Math.max(10,base*(row.clientWidth/row.scrollWidth)*.99)}px`}}function fitAllCardSubtitles(){document.querySelectorAll(".cardSubtitle").forEach(fitCardSubtitle)}'
          if old not in s:
              raise SystemExit('genre fitter anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('subtitle.textContent=parts.subtitle}else if(subtitle)', 'subtitle.textContent=parts.subtitle;requestAnimationFrame(()=>fitCardSubtitle(subtitle))}else if(subtitle)', 1)
          s = s.replace('requestAnimationFrame(fitAllCardGenres)};', 'requestAnimationFrame(()=>{fitAllCardGenres();fitAllCardSubtitles()})};', 1)
          s = s.replace('setTimeout(()=>{fitAllCardGenres();if(activeMovieId)', 'setTimeout(()=>{fitAllCardGenres();fitAllCardSubtitles();if(activeMovieId)', 1)
          s = s.replace('document.fonts?.ready.then(()=>{if(activeMovieId)', 'document.fonts?.ready.then(()=>{fitAllCardSubtitles();if(activeMovieId)', 1)
          p.write_text(s)
          PY
      - name: Commit change and remove temporary workflow
        run: |
          git config user.name "SceneSense Library Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fit-card-subtitles.yml
          git commit -m "Fit second-line card titles to available width"
          git push origin main
