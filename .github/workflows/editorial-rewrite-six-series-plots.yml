name: Editorial rewrite six-series plots
on:
  push:
    paths:
      - '.github/workflows/editorial-rewrite-six-series-plots.yml'
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite audited episode descriptions and verify invariants
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          import json, glob, os, re, collections

          R = {}
          def put(folder, season, eid, text):
              R[(folder, season, eid)] = text

          # KEVIN FROM WORK — all ten rows editorially rewritten.
          put('kevin-from-work',1,'s01e01',"Kevin gives Audrey a candid farewell letter and tells her he loves her because he expects to leave for an overseas job. When the transfer collapses and he is back at the office almost immediately, both have to work beside each other with the confession now impossible to ignore.")
          put('kevin-from-work',1,'s01e02',"Kevin and Audrey try to restore a professional routine after his confession, but the private letter becomes office gossip when its contents reach the company newsletter. Roxie meanwhile forms an unlikely friendship with Patti, giving Kevin one more personal connection inside an already intrusive workplace.")
          put('kevin-from-work',1,'s01e03',"Audrey sets Kevin up with one of her friends and then discovers that watching the date bothers her more than she expected. Brian becomes Patti's personal trainer, while Roxie responds to unemployment by deciding that acting might be a viable career.")
          put('kevin-from-work',1,'s01e04',"A strong performance review makes Kevin determined to help struggling coworker Ricky improve his standing with Julia. Audrey recruits Patti to solve a problem for their boss, while Brian, feeling ignored, starts spending more time with Roxie.")
          put('kevin-from-work',1,'s01e05',"Kevin's attempt to impose an elaborate set of house rules drives Roxie out of his apartment and into Patti and Audrey's place. His relief at getting his space back is undercut when he becomes convinced that Roxie and Roger are developing a romantic connection.")
          put('kevin-from-work',1,'s01e06',"Julia leaves Kevin and Audrey in charge of the office for the day, giving Audrey a chance to prove she can manage the staff while Kevin tries to keep his birthday secret. Their coworkers discover the date anyway and turn his wish for a quiet day into another workplace production.")
          put('kevin-from-work',1,'s01e07',"Kevin discovers Julia's private executive bathroom and shares the hidden perk with Audrey, forcing them to keep their unauthorized access from the rest of the office. Away from that secret, Roxie's blunt relationship advice to Patti creates consequences Roxie has to deal with herself.")
          put('kevin-from-work',1,'s01e08',"Kevin is assigned to run the office earthquake drill on the same day he has an important job interview, putting his current responsibilities directly against a possible escape route. He also avoids Audrey after their latest confrontation, while Roxie challenges Audrey over the way she has been treating him.")
          put('kevin-from-work',1,'s01e09',"Confined at home, Kevin processes his feelings for Audrey and his office frustrations through a stylized black-and-white dream. Roxie focuses on an attractive male nurse, while Patti inserts herself into Audrey's outings with Brock and sees more of their relationship problems firsthand.")
          put('kevin-from-work',1,'s01e10',"Kevin decides that remaining the endlessly accommodating friend is getting him nowhere and starts openly exploiting the growing problems between Audrey and Brock. Audrey's reactions force the triangle into the open as Kevin finally competes for the relationship he has wanted all season.")

          # THE LAW ACCORDING TO LIDIA POËT — all eighteen rows rewritten from case facts.
          put('the-law-according-to-lidia-poet',1,'s01e01',"Ballerina Adele Valery is murdered and her alleged stalker Pietro Baiocchi is arrested, prompting his mother to seek Lidia's help just as a Turin court removes Lidia from the bar because she is a woman. Working through Enrico's office, Lidia reconstructs Adele's relationships and final movements, clears Pietro and proves that losing her license has not ended her legal career.")
          put('the-law-according-to-lidia-poet',1,'s01e02',"Anita Tosetti, an anarchist employed at a chocolate factory, is accused of murdering Elena De Santis. Lidia discovers that Elena secretly held authority inside the factory and had a personal relationship with Anita, and the resulting investigation exposes a motive that the police case ignored while further angering officials already determined to keep Lidia out of court.")
          put('the-law-according-to-lidia-poet',1,'s01e03',"Vittorio Muraro appears at Lidia's former family home in an opium haze and confesses to killing his father years earlier. Lidia and Enrico reopen the old house, find a concealed room and uncover letters about debt, marriage and a missing necklace that reshape both the murder case and their understanding of their own father's past.")
          put('the-law-according-to-lidia-poet',1,'s01e04',"Chemist Margherita Sangiacomo faces execution for murdering Professor Braschi, and Lidia initially works to prove her innocent. The evidence instead shows that Margherita killed him in revenge for medical experiments on poor women and prostitutes, including her mother, forcing Lidia to choose truth over an easy acquittal.")
          put('the-law-according-to-lidia-poet',1,'s01e05',"Azzurra, a prostitute, is accused of killing wealthy client Achille Castelnuovo after a séance and party. Lidia follows the evidence through the household and the medium Vera to identify the person who actually killed Castelnuovo, while Jacopo's own investigation leaves him exposed to arrest.")
          put('the-law-according-to-lidia-poet',1,'s01e06',"Jacopo is arrested for the murder of Maya Cristallo, whose real identity links her to French anarchists Nicole and Louis. Lidia discovers that Maya had betrayed them while working as a government spy, confronts the fugitives on a train and clears Jacopo, only to learn that the Court of Cassation has rejected her appeal against disbarment.")

          put('the-law-according-to-lidia-poet',2,'s02e01',"Lidia is arrested during a campaign for women's voting rights just as journalist Attila Brusaferro is murdered and found carrying two coded messages. Released by prosecutor Pierluigi Fourneau, she works with Jacopo to decode Attila's last leads, while the investigation begins exposing the political network that will dominate the season.")
          put('the-law-according-to-lidia-poet',2,'s02e02',"A student named Laura is accused of poisoning Beatrice at an elite girls' boarding school, and Lidia examines the school's rivalries and hidden relationships rather than accepting the obvious suspect. Jacopo continues tracing Attila's murder in parallel, while Marianna's engagement draws the Poët family into the Duke's social circle.")
          put('the-law-according-to-lidia-poet',2,'s02e03',"A sequence of murdered women brings Lidia and Fourneau together on the same investigation, with criminologist Cesare Lombroso supplying a competing theory of the killer. As Enrico weighs a parliamentary campaign, Lidia and Fourneau's professional partnership becomes personal, while Jacopo finds a connection between Attila's death, Juvarra and Nitti.")
          put('the-law-according-to-lidia-poet',2,'s02e04',"Andrea Caracciolo returns from America to marry Letizia, but a man is killed during the wedding celebrations and Letizia becomes the principal suspect. Lidia discovers that the victim was tied to an usurer and had a child with Letizia; Andrea takes responsibility for the killing and escapes to Switzerland, while Enrico commits to entering Parliament.")
          put('the-law-according-to-lidia-poet',2,'s02e05',"Prisoner Bruno Corsi escapes Le Nuove and is accused of murdering a guard, but Lidia and Fourneau find evidence that corruption inside the prison may have framed him. Jacopo finally locates Nitti, only for the man to be killed before the documents he possesses can safely expose the larger conspiracy.")
          put('the-law-according-to-lidia-poet',2,'s02e06',"Enrico wins his parliamentary election as Fourneau takes control of the evidence recovered from Attila and Nitti. Lidia and Jacopo help expose Garrone and the men plotting against Prime Minister Depretis, while Marianna breaks from the marriage arranged around her and Jacopo leaves Turin for Rome after the conspiracy collapses.")

          put('the-law-according-to-lidia-poet',3,'s03e01',"A trapeze artist is found dead at a circus, and Lidia discovers that the killing grew out of rivalry and a desperate attempt by the victim's closest friend to stop her leaving. At the same time, Lidia's friend Grazia Fontana arrives with her daughter Mila after fleeing an abusive husband; when Guido Fontana is found dead, Grazia becomes the center of a second and far more personal case.")
          put('the-law-according-to-lidia-poet',3,'s03e02',"Grazia is jailed for Guido's death while Lidia and Enrico begin building a self-defense argument around the injuries she endured. A separate murder draws them to painter Luigi, whose relationship with the dead man and involvement in an art fraud force him to protect both his private life and someone else responsible for the crime.")
          put('the-law-according-to-lidia-poet',3,'s03e03',"A telegram suggesting that Grazia invited Guido to meet her damages the defense just as Fourneau finds gaps in her account. Lidia and Jacopo investigate the murder of boxer Nino, where a witness reveals that his manager killed him after Nino threatened to expose fixed fights, while the discovery that Mila sent the telegram further complicates Grazia's trial.")
          put('the-law-according-to-lidia-poet',3,'s03e04',"Doctor Tulio Munnari is due to testify about Grazia's injuries when he is arrested for murdering his sister Eloisa. Lidia and Enrico trace Eloisa's stalking complaint to Bottini and discover that Tulio's wife ordered the killing; Tulio is freed, but Fourneau damages his value as a witness by exposing his affair with Grazia.")
          put('the-law-according-to-lidia-poet',3,'s03e05',"Press coverage of Lidia's relationship with Fourneau strains her partnership with Enrico while fourteen-year-old Berto is accused of murdering his teacher, Borromei. Lidia discovers that the killer is the parent of another boy at the school, then ends her relationship with Fourneau as the Grazia case and Jacopo's future with Consuelo push her personal life apart.")
          put('the-law-according-to-lidia-poet',3,'s03e06',"Lidia and Jacopo search the Fontana estate for evidence and uncover the remains of Amira, an Eritrean woman whom Guido had held as a sexual slave and killed. The discovery gives the defense the context it needs and Grazia is acquitted; afterward Consuelo leaves Jacopo, while Lidia and Jacopo finally acknowledge that their attachment has survived every attempt to move on.")

          # LA PRIMERA VEZ — all forty-five rows rewritten as declarative episode plots.
          put('eva-lasting',1,'s01e01',"Eva Samper becomes the first girl admitted to José María Root, immediately unsettling Camilo, Martín, Gustavo, Álvaro and Rodrigo and challenging the assumptions that structure their all-male school life. Camilo is captivated by her confidence and reading, while his father's attempt to initiate him into adulthood only makes his growing feelings for Eva clearer.")
          put('eva-lasting',1,'s01e02',"Convinced that Eva's sophistication must conceal something, Camilo and the boys follow her and wrongly conclude that she is a prostitute. Eva discovers the surveillance, turns the embarrassment back on them and draws them into a bowling outing, while uncertainty over whether she will be allowed to remain at the school raises the stakes of the friendship.")
          put('eva-lasting',1,'s01e03',"Eva's presence pushes the boys into a Mother's Day project that exposes both their immaturity and problems inside their families. Martín's attempt to pass off someone else's song as his own unravels, and an affair involving his family becomes public, leaving Estela and the school community dealing with the consequences.")
          put('eva-lasting',1,'s01e04',"Eva and Camilo use the school newspaper to expose the misconduct surrounding Estela, earning themselves suspension while the adults fight over what should remain private. Eva tells Camilo about her mother's suicide and the absence of her father, and the dispute escalates when Estela shoots the man she blames for what happened and is taken into custody.")
          put('eva-lasting',1,'s01e05',"With Estela's freedom depending on whether the shooting can be understood as self-defense, Eva and Camilo investigate the violence that preceded it and find evidence supporting her account. Soon after their suspension is reversed, Eva is abducted in front of Camilo, abruptly turning his doubts about her background into a real danger.")
          put('eva-lasting',1,'s01e06',"Camilo and José report Eva's kidnapping, but José's confrontation with the police gets him jailed while Eva unexpectedly returns and claims the abductors made a mistake. Her poor grades then threaten her place at José María Root, leading her to study with Guzmán and develop feelings for the boy the rest of the group has been mocking.")
          put('eva-lasting',1,'s01e07',"Guzmán leaves after using Eva for his own academic advantage, prompting the boys to investigate the inconsistencies in her story more seriously. They discover her wealthy home, learn that her father is an industrialist and that the kidnapping was genuine, and hear the truth about her mother's suicide and repeated expulsions; Martín's sister Luisa then becomes the school's second female student.")
          put('eva-lasting',1,'s01e08',"Street protests, inflation and José's union activity bring national politics directly into Camilo's home and the students' conversations. Short of money, the boys accept Eva's help, while Camilo uses Luisa in an increasingly reckless attempt to make Eva jealous and turns a classroom discussion of Nietzsche into another contest over her attention.")
          put('eva-lasting',1,'s01e09',"Camilo finally gets an opportunity to express his feelings for Eva, but his earlier attempt to provoke jealousy leaves him entangled with Luisa instead. He sleeps with Luisa at Eva's house and then tries to retreat from what he has done, provoking anger from both Eva and Martín and damaging the trust he had been building.")
          put('eva-lasting',1,'s01e10',"Eva intervenes when Camilo's conflict with Martín over Luisa becomes physical, while Luisa is sent away to boarding school. At a party Camilo again tries to tell Eva how he feels, but the night is diverted by a call for help and by Camilo accidentally discovering Gustavo and Martín in an intimate encounter they are desperate to keep private.")
          put('eva-lasting',1,'s01e11',"Rumors about Martín and Gustavo spread after Quiñónez learns what happened, and Camilo lies in an attempt to protect Martín by placing the blame on Gustavo. Eva and Ana push back against the group's intolerance; Camilo eventually admits the truth, and Gustavo leaves Bogotá after reconciling with the friends who had helped turn his private life into a crisis.")
          put('eva-lasting',1,'s01e12',"Eva catches the Acuña twins stealing and recruits them with Camilo for a break-in intended to alter school grades, a scheme that finally brings Eva and Camilo to a kiss. The victory lasts only briefly: Eva's father is arrested for money laundering, and she learns that she will be sent to the United States rather than remain in Colombia.")
          put('eva-lasting',1,'s01e13',"Eva and Camilo run away to Neusa rather than accept her departure, but the police find them and their friends can only hide Eva temporarily. Adela ultimately reveals where she is, Eva is sent to the United States before Camilo can arrange to follow her, and Luisa then calls with news that she may be pregnant.")

          put('eva-lasting',2,'s02e01',"Eva returns to Bogotá just as Camilo is forced to confront Luisa's pregnancy, and she distances herself from him after learning how it happened. Luisa hides at Eva's house and considers an illegal abortion, but at the clinic she changes her mind and decides to continue the pregnancy.")
          put('eva-lasting',2,'s02e02',"Martín learns that Luisa is pregnant and attacks Camilo, while the adults pressure the teenagers toward a marriage neither of them wants. Ana refuses to treat pregnancy as a reason to sacrifice Luisa's future and throws José out during their argument, while the school refuses to readmit Luisa and turns the conflict into a wider debate over girls' rights.")
          put('eva-lasting',2,'s02e03',"Eva organizes a student strike demanding that Luisa be allowed back at José María Root, and Martín eventually reconciles with Camilo. A parent-teacher vote still blocks Luisa's return, but Camilo publishes an article challenging the decision and secures both her readmission and his own first real opportunity as a reporter.")
          put('eva-lasting',2,'s02e04',"The friends travel through Melgar toward Bucaramanga and meet truck driver Antonio, whose sudden death leaves them responsible for returning his savings. In Bucaramanga they find Gustavo living with Natalia while concealing his sexuality; after the truth comes out, Gustavo chooses to rejoin the group, and Luisa grows closer to Rodrigo.")
          put('eva-lasting',2,'s02e05',"A holiday in Cartagena gives Camilo a chance to work as a sports reporter, but jealousy over Eva's past and heavy drinking cause him to miss the assignment he was supposed to cover. Eva helps him salvage the article, while the group's Christmas exchange and Camilo's carefully chosen book for her expose how much of their relationship remains unresolved.")
          put('eva-lasting',2,'s02e06',"A conservative sex-education class led by Tello provokes Eva into challenging what the school teaches about desire, contraception and women's choices. Camilo's newspaper work consumes more of his time as Luisa's pregnancy advances, and Rodrigo increasingly becomes the person accompanying and supporting her through the medical appointments.")
          put('eva-lasting',2,'s02e07',"Eva helps remove Tello from the sex-education course and Rosario, a woman from José's past, takes over the class. Eva's former boyfriend Alfredo arrives from the United States intending to win her back, while Luisa tells Camilo that her feelings are shifting toward Rodrigo rather than the father of her child.")
          put('eva-lasting',2,'s02e08',"Eva, Camilo and Alfredo take hallucinogenic mushrooms, and Eva finally tells Camilo that she became pregnant by Alfredo in the United States and had an abortion after he abandoned her. Rosario separately reveals that José fathered her daughter Janet, while Lucy's admission that she is attracted to women forces the Granados family to confront another subject they had avoided.")
          put('eva-lasting',2,'s02e09',"Camilo's arguments about family and gender alienate Eva as he struggles to recognize how much of José's worldview he has absorbed. He meets Janet, his half-sister with Down syndrome, while José avoids the encounter; Álvaro's involvement in a robbery with the Acuña brothers then threatens the group's standing at school.")
          put('eva-lasting',2,'s02e10',"José begins building a relationship with Janet while Eva creates a student council and runs against Quiñónez, only to lose after her opponents weaponize scandal and prejudice against her. As the school fight ends, Luisa goes into labor and gives birth to Antonia, permanently changing Camilo, Luisa and Rodrigo's responsibilities to one another.")

          put('eva-lasting',3,'s03e01',"Final examinations force the José María Root students to confront whether they will graduate and what happens immediately afterward. Camilo recruits the Acuña brothers for an illicit plan connected to those academic pressures, while José continues trying to rebuild his relationship with Ana despite her insistence on independence.")
          put('eva-lasting',3,'s03e02',"The military examination required of the boys divides Salcedo, Pabón, Castro and Arbeláez over service, fear and obligation. At the same time a school stage production introduces someone who becomes important to Salcedo, pulling him toward a part of himself and a social world he has not previously confronted openly.")
          put('eva-lasting',3,'s03e03',"Military conscription threatens to scatter the group just before graduation, forcing the boys to make choices about service rather than treating adulthood as an abstract future. Eva's own commitments increasingly compete with her relationship with Camilo, and the uncertainty around both their plans begins to separate them.")
          put('eva-lasting',3,'s03e04',"Graduation opens different opportunities for the friends while military life creates a direct conflict between Pabón and Quiñónez. Lucy makes a decision about her own future that José resists, extending the struggle over independence inside the Granados family even as the younger generation starts leaving school behind.")
          put('eva-lasting',3,'s03e05',"Camilo, Eva and their friends begin organizing life after José María Root instead of around the routines that kept them together at school. Janet proposes a change that catches José off guard, while Pabón gains leverage in his conflict with Quiñónez and refuses to accept the role military authority has assigned him.")
          put('eva-lasting',3,'s03e06',"Pabón chooses to help Quiñónez despite their conflict, while Camilo becomes increasingly jealous of Eva's intellectual and personal interest in Professor Silva. A night of drinking exposes the depth of Camilo's insecurity, and Ana receives news that moves her own plans forward independently of José.")
          put('eva-lasting',3,'s03e07',"Camilo's jealousy intensifies as Eva keeps more of her relationship with Professor Silva and her political activity from him. Pabón challenges a military decision affecting his future, while José asks Camilo for help with a family matter that forces father and son to cooperate despite their recurring disagreements.")
          put('eva-lasting',3,'s03e08',"Eva makes a decision that ends the version of their relationship Camilo had been trying to preserve, and he responds by spiraling rather than accepting it. Salcedo's growing drug use begins affecting the wider group, while Camilo is offered a new creative opportunity that gives him a direction outside Eva.")
          put('eva-lasting',3,'s03e09',"Police search for Eva because Professor Silva is connected to an urban guerrilla organization, forcing her to hide at the house on 364 while the group arranges an escape during a party. Quiñónez finds her but refuses to betray her; Pascual eventually gives her up for money, and after her father secures her release Eva cuts ties with Silva.")
          put('eva-lasting',3,'s03e10',"Álvaro suffers a severe football injury that ends his playing ambitions, while Pabón confronts Quiñónez and Gustavo leaves military service after rejecting Quiñónez's feelings. Luisa and Rodrigo marry, Alfredo survives a suicide attempt after asking Eva to reconsider him, and Eva chooses Camilo; by the end Camilo has also turned his writing into a published novel.")

          put('eva-lasting',4,'s04e01',"Camilo's first novel angers his friends because they recognize private parts of their lives in his fiction, forcing him to defend what he has turned into material. Eva uses a discussion of Fellini's Amarcord to push the group toward reconciliation, while Luisa and Rodrigo move out of the house on 364 because Martín's cocaine use has made living there impossible and Vandalia takes the vacant room.")
          put('eva-lasting',4,'s04e02',"Eva visits the Dominican Republic's embassy while researching activist Abigail Mejía and is trapped when M-19 guerrillas seize the building and its diplomatic hostages. Camilo covers the crisis from outside and the old group mobilizes around Eva's safety until she is released, making national political violence part of their adult lives rather than a classroom argument.")
          put('eva-lasting',4,'s04e03',"Eva and Camilo begin living together at 364, but Vandalia's cocaine operation brings police attention and places everyone in the house at risk. After a raid destroys the drugs, the tenants compensate Vandalia and force him out, while Rosario works on creating a school that can properly serve Janet and Eva and Camilo decide they need a home of their own.")
          put('eva-lasting',4,'s04e04',"Searching for an apartment exposes the financial gap between Eva and Camilo, especially after Eva's father cuts off support because she is living with him. Unpaid household bills push the friends into a television game show for prize money; Eva deliberately gives up the win when competition starts damaging the group, and Lucy returns to Bogotá.")
          put('eva-lasting',4,'s04e05',"Money problems continue testing Eva and Camilo until they reach a workable truce over how they will share adult responsibilities. Lucy moves into 364, Rosario and Janet leave for Spain to pursue Janet's education, and Eva travels with Gustavo to Cauca for a yagé ceremony that both hope will resolve unfinished parts of their pasts.")
          put('eva-lasting',4,'s04e06',"In Cauca, Gustavo confronts the father who abused him and the yagé ritual gives him a clearer sense of the life he wants to build. Eva experiences a vision of her deceased mother that helps her make peace with the loss, while Camilo and José work together on a story about an aging wrestler and repair some of their own strained relationship.")
          put('eva-lasting',4,'s04e07',"Eva takes a job selling cars and learns that she is pregnant, prompting both families to rally around the couple as they prepare a nursery and imagine parenthood. The fragile optimism collapses after an argument over their lost dog and a collision with a drunk driver causes Eva to miscarry, leaving the family to recover from the loss together.")
          put('eva-lasting',4,'s04e08',"Estela returns to Bogotá as a poet writing openly about sex, and Eva tries to help her find a publisher while Camilo reacts critically to the work. Estela moves into 364 and begins an affair with Salcedo before leaving again; Lucy experiments with marijuana, and by graduation in 1982 Camilo secures work writing for television.")
          put('eva-lasting',4,'s04e09',"Camilo becomes a television sitcom writer and Eva works as a translator while their friends' adult lives diverge sharply. Gustavo builds a theater career and a relationship with Hugo, Rodrigo grows insecure about Luisa's medical profession, Álvaro is fired and joins the Acuña brothers in a robbery before surrendering, and Salcedo's cocaine use ends in an overdose.")
          put('eva-lasting',4,'s04e10',"After surviving his overdose, Salcedo enters a church group and falls in love with novice Mónica, while Rodrigo and Luisa repair the strain in their marriage. Hugo's former partner is dying from AIDS, forcing Pabón and the group to confront the epidemic and its surrounding prejudice; during Eva's work trip with Scott, Camilo begins an affair with Marcela and Eva catches them.")
          put('eva-lasting',4,'s04e11',"Three years later, the group has scattered into established careers and relationships when Eva returns to Colombia for Antonia's birthday accompanied by Scott. Camilo reacts badly, later apologizes and recognizes that his feelings for Eva remain unresolved, while Salcedo supports Mónica as they decide to build a life together without children.")
          put('eva-lasting',4,'s04e12',"Rodrigo and Luisa are caught inside the Palace of Justice during the M-19 siege; Rodrigo returns, but Luisa disappears after entering military custody. The friends channel their grief into making a film, Marcela ends her relationship with Camilo, and Eva and Camilo reunite; the story closes as Antonia becomes a student at José María Root, carrying the group into another generation.")

          # LAST RESORT — all thirteen rows rewritten from episode events.
          put('last-resort',1,'s01e01',"The USS Colorado receives an order through a secondary Antarctic channel to launch nuclear missiles at Pakistan, and Captain Marcus Chaplin refuses until the command is authenticated through normal authority. XO Sam Kendal makes the same demand after Chaplin is relieved; the Colorado is then torpedoed by the USS Illinois, survives and reaches Sainte Marina, where Chaplin establishes a nuclear-backed exclusion zone rather than surrender the submarine and crew.")
          put('last-resort',1,'s01e02',"Foreign and American warships test Chaplin's 200-mile perimeter, and he uses the Colorado's Perseus stealth system to approach the USS Illinois and hit it with a deliberately disabled torpedo as a warning. A special-forces unit is inserted onto Sainte Marina, forcing Sam, Grace and a small ground team into a firefight while Washington pressures Christine to persuade her husband to surrender.")
          put('last-resort',1,'s01e03',"Prosser is released from the brig to help locate three missing Colorado sailors, only for Chaplin to learn that Serrat has kidnapped them. Serrat forces the submarine to retrieve cargo from outside the naval perimeter; the Colorado returns too late to satisfy him and he kills one hostage, while Kylie and Admiral Shepard trace the original launch order and the Perseus plans disappear from Kylie's apartment.")
          put('last-resort',1,'s01e04',"With treason charges announced against Chaplin and Sam, the crew is allowed to choose whether to remain with the Colorado. The Defense Department secretly sends individual sailors orders authorizing action against their captain, culminating in Brennan threatening the bridge with a grenade and trying to force the submarine toward surrender; in the United States, Christine faces government pressure while Sam's old friend Paul Wells moves closer to her.")
          put('last-resort',1,'s01e05',"Secretary of Defense William Curry arrives on Sainte Marina to negotiate directly with Chaplin and Sam, offering terms that would return the Colorado while leaving the officers exposed. At the same time a failed sonar-array battery opens a hole in the island's defense, forcing Grace to command the submarine on a repair mission; when U.S. forces are positioned to sink the Colorado, Admiral Shepard kills Curry and his adviser to stop the firing order.")
          put('last-resort',1,'s01e06',"Attackers working through Serrat contaminate Sainte Marina's water supply with the military hallucinogen BZ and move against the incapacitated crew. Sam fights through memory gaps and hallucinations with James King to stop the commandos on the island, while Chaplin, Grace and a skeleton crew struggle to keep the Colorado alive at sea; an unidentified person restores the submarine's oxygen and steals one of Chaplin's launch keys.")
          put('last-resort',1,'s01e07',"Chaplin investigates the BZ attack and the theft of his nuclear launch key, increasing suspicion throughout the crew. Prosser's confrontation with Serrat escalates over the attack and the drug trade among the sailors, while a surviving SEAL tells Sam that a faction in Washington wants Chaplin removed in exchange for amnesty; Christine and Kylie continue building a public case against the government's account of the crisis.")
          put('last-resort',1,'s01e08',"A Thanksgiving feast intended to reduce hostility between the Colorado crew and Sainte Marina collapses when islander Erita accuses Chief Anders of rape. Grace Shepard defends Anders at a joint island-Navy trial and realizes Serrat has manipulated the jury to provoke unrest; Anders ultimately admits the assault, and Chaplin discharges him and orders him held for prosecution.")
          put('last-resort',1,'s01e09',"A transport carrying forty relatives of the Colorado crew, including Christine Kendal, is seized by Pakistani commandos who demand that Chaplin fire a nuclear missile at Indian forces entering Pakistan. The original SEAL operation is also exposed: Hopper had been ordered by the Secretary of Defense to plant false evidence of Pakistani suitcase nuclear weapons, tying fabricated intelligence directly to the crisis that produced the Colorado's launch order.")
          put('last-resort',1,'s01e10',"Sam and James King travel to Manila to recover Christine from the people using her as leverage, while the rescue exposes how far the conspiracy reaches beyond Sainte Marina. On the island, Chinese envoy Zheng offers Chaplin supplies and political recognition in return for influence, and Chaplin must also deal with overcrowded confinement and discipline problems among sailors who have turned to Serrat's drug trade.")
          put('last-resort',1,'s01e11',"A U.S. Navy destroyer moves to intercept the Chinese supply ship bound for Sainte Marina, forcing Chaplin to defend the aid route without triggering a larger naval battle. In Washington, Kylie brings evidence of the President's Pakistan deception to the Speaker as Admiral Shepard helps organize a coup, while Cortez admits she has been paid by the CIA and refuses an order to kill Chaplin; Serrat separately bargains with China over the island's rare-earth deposits.")
          put('last-resort',1,'s01e12',"Admiral Shepard tells Chaplin that a Washington coup is imminent and prepares him to surrender the Colorado once the President is removed, while Kylie helps move the evidence needed to justify the takeover. The plan collapses as political support evaporates, and on Sainte Marina Prosser's mutiny advances while the Chinese resupply arrangement becomes another source of division inside the crew.")
          put('last-resort',1,'s01e13',"Prosser's mutiny is hijacked by men planning to hand the Colorado to China, leaving Chaplin, Sam, Grace and Prosser fighting together to regain control of the submarine. Chaplin retakes the conn and destroys the Colorado rather than allow it to become another government's weapon, sacrificing himself; in Washington, Kylie releases evidence of the President's conspiracy after arranging Christine's return and then shoots the President.")

          # LEGEND OF THE SEEKER — all forty-three scoring rows rewritten.
          put('legend-of-the-seeker',1,'s01e01-02',"Kahlan Amnell crosses the Boundary seeking the Seeker after Darken Rahl's forces seize the Book of Counted Shadows and kill Richard Cypher's adoptive father. Zedd reveals Richard's identity, gives him the Sword of Truth and joins him and Kahlan in pursuing Fane; their first campaign recovers the Book, rescues Chase's kidnapped daughter and commits Richard to carrying the Seeker's role into the Midlands.")
          put('legend-of-the-seeker',1,'s01e03',"Darken Rahl offers a bounty for the Seeker and equips hunters with enchanted maps that can track Richard's movements. Richard, Kahlan and Zedd have to identify how the hunters are finding them and turn the tracking magic against the men pursuing the reward.")
          put('legend-of-the-seeker',1,'s01e04',"Richard returns to Brennidon, the town where Rahl's soldiers killed firstborn sons in an attempt to prevent the Seeker prophecy. The visit exposes how thoroughly the occupation has reshaped the town and gives Richard new information about the woman who gave birth to him and the circumstances of his escape as an infant.")
          put('legend-of-the-seeker',1,'s01e05',"D'Haran soldiers capture Renn, a child Listener who can hear other people's thoughts, intending to use his ability against the resistance. Richard and Kahlan free him, but protecting Renn also means coping with a boy who can immediately expose feelings and secrets that Richard and Kahlan have been avoiding with each other.")
          put('legend-of-the-seeker',1,'s01e06',"Villagers in Drundril are buying bottled elixirs that temporarily grant magical abilities and are becoming dependent on powers they do not understand. Tracking the source leads Zedd to a former student who is manufacturing the potions and forces the wizard to confront how his own teaching helped create the problem.")
          put('legend-of-the-seeker',1,'s01e07',"Shota foresees Richard being killed by D'Haran commander Demmin Nass and responds by magically exchanging Richard's body with that of villager Gryff. Richard has to stop Nass while everyone around him sees the wrong face, and Gryff is forced to survive the attention that comes with being mistaken for the Seeker.")
          put('legend-of-the-seeker',1,'s01e08',"Kahlan leaves Richard and Zedd temporarily because she fears her growing feelings will interfere with her duties as a Confessor. Mord-Sith Denna captures Richard in her absence and uses an Agiel and psychological conditioning to break his loyalty, forcing Richard to resist becoming a weapon for Darken Rahl.")
          put('legend-of-the-seeker',1,'s01e09',"Queen Milena possesses the last Box of Orden that Darken Rahl still needs, so Zedd enters her court disguised as a puppeteer to replace the box with a fake. A servant girl named Rachel becomes essential to the theft, while Richard and Kahlan race Rahl's forces to keep the genuine box from reaching him.")
          put('legend-of-the-seeker',1,'s01e10',"Kahlan infiltrates a D'Haran prison with Richard to rescue her pregnant sister Dennee, another Confessor. After Dennee gives birth to a boy, Richard learns that Confessor law requires male children to be killed because their power is considered uncontrollable, placing his determination to save the infant directly against Kahlan's inherited duty.")
          put('legend-of-the-seeker',1,'s01e11',"Richard and Kahlan investigate murders inside the resistance while Zedd looks for a secure place to hide a Box of Orden. False evidence and a confession obtained through Kahlan's power lead to the death of an innocent man, forcing her to reassess how easily the Confessor's certainty can be manipulated by someone controlling the facts around a suspect.")
          put('legend-of-the-seeker',1,'s01e12',"Rahl's wizard Giller traps Richard inside a constructed version of his old Hartland life using the Spell of the Lying Moon. The illusion is designed to persuade Richard that the Seeker quest never happened and extract the location of the Box of Orden, while Kahlan and Zedd work from outside the spell to bring him back to reality.")
          put('legend-of-the-seeker',1,'s01e13',"Richard, Kahlan and Zedd take a Box of Orden to the crypt of legendary Seeker Kieran, expecting the tomb to provide a safe hiding place. The spirits of Kieran, Confessor Viviane and wizard Amfortas instead possess the living visitors and replay the betrayal that destroyed their own alliance, forcing the present-day group to resolve a conflict inherited from the past.")
          put('legend-of-the-seeker',1,'s01e14',"D'Haran troops occupy Hartland and take members of Chase's family, drawing Richard back across the Boundary to the home he left behind. Richard, Kahlan and Chase organize a rescue while confronting townspeople who have accepted the occupation as the price of avoiding further punishment.")
          put('legend-of-the-seeker',1,'s01e15',"Giller experiments with dead Confessor magic in an attempt to give Darken Rahl the power of Confession, using prisoners as test subjects. Richard's effort to free the captives brings him face to face with Rahl and reveals how close the regime is to turning a uniquely Confessor ability into a controlled military tool.")
          put('legend-of-the-seeker',1,'s01e16',"Richard rescues Jennsen from Denna and learns that she is his half-sister, hidden from Rahl because she was born without the magical gift that permeates their bloodline. Her immunity to magic makes her valuable to both sides and also forces Richard to confront another part of the family history concealed from him.")
          put('legend-of-the-seeker',1,'s01e17',"Richard infiltrates a D'Haran weapons operation to steal Whisperers, devices capable of destroying entire villages, before they can be used against the resistance. Once the weapons are captured, Richard must also stop resistance fighters from using the same indiscriminate power for revenge against D'Haran civilians.")
          put('legend-of-the-seeker',1,'s01e18',"Two thieves obtain magic that lets them impersonate Richard and Kahlan and begin exploiting the Seeker and Confessor identities for profit. The real pair must recover the Sword of Truth and clear their names while their doubles discover that pretending to hold those roles also attracts the enemies attached to them.")
          put('legend-of-the-seeker',1,'s01e19',"A king trying to defend his realm from D'Haran soldiers accepts Shota's magic and is transformed into a beast that hunts the occupiers at night. When the creature begins killing the people it was meant to protect, Richard and Kahlan have to separate the king from the curse before fear of Rahl destroys the kingdom from inside.")
          put('legend-of-the-seeker',1,'s01e20',"Richard learns that another prophetic volume may contain information about defeating Rahl and travels to a library where the manuscript has been hidden. Rahl's agents arrive for the same reason, turning the search into a contest over whether the Seeker or the tyrant will control the prophecy's guidance.")
          put('legend-of-the-seeker',1,'s01e21',"Jennsen comes into possession of two Boxes of Orden and is captured before she can deliver them safely to Richard. After losing her memory, she is manipulated by Rahl into believing Richard is responsible for her suffering, leaving the Seeker to recover both his sister and the boxes without harming someone Rahl has turned against him.")
          put('legend-of-the-seeker',1,'s01e22',"The release of Orden's power throws Richard and Cara decades into a future where Rahl's victory has reshaped the world and Kahlan's life. Richard has to work with the Mord-Sith who once served his enemy to understand how the altered history was created and undo it, restoring the confrontation that can actually end Rahl's rule.")

          put('legend-of-the-seeker',2,'s02e01',"Rahl's death leaves a tear in the veil to the Underworld, allowing the Keeper's servants to enter the world of the living and making the Stone of Tears the group's new objective. Richard, Kahlan and Zedd begin the search while Cara fights a challenge to her standing among the Mord-Sith and ultimately joins the Seeker's traveling party.")
          put('legend-of-the-seeker',2,'s02e02',"The search for the Stone leads the group to a D'Haran prison where the dead have returned as banelings who must kill each day to remain alive. Richard tries to stop the killings while learning that a man carrying information needed to locate the Stone has made his own bargain with the Keeper.")
          put('legend-of-the-seeker',2,'s02e03',"Kahlan learns that Cara was responsible for Dennee's death and wants the Mord-Sith removed from the quest. Cara returns to her home village and is put on trial for crimes committed while serving Rahl, leaving Kahlan to decide whether punishment for Cara's past should end the possibility that Cara can choose differently now.")
          put('legend-of-the-seeker',2,'s02e04',"Kahlan discovers a teenage girl who appears to be the only other living Confessor and tries to bring her under protection. The girl's untrained power makes every emotional mistake dangerous, forcing Richard and Kahlan to protect her from people seeking to use Confession while teaching her what the ability actually does to another person's will.")
          put('legend-of-the-seeker',2,'s02e05',"A spell strips Zedd of both his memory and his old age, leaving a younger and more arrogant wizard convinced that Richard should be replaced as Seeker. Richard, Kahlan and Cara have to recover the Zedd they know while his unchecked magic and new ambitions draw him toward a confrontation involving Rahl and another rift to the Underworld.")
          put('legend-of-the-seeker',2,'s02e06',"Richard helps the pacifist Minders after slave traders attack their community and agrees to teach them how to defend themselves. The Sword of Truth amplifies anger within the group instead of simply giving them discipline, forcing Richard to understand and control the same rage in himself before the training turns the Minders into another threat.")
          put('legend-of-the-seeker',2,'s02e07',"A D'Haran commander tries to consolidate power after Rahl's death and eliminate anyone who could challenge control of the empire. Richard and Cara trace the struggle to a brothel run by Denna, who plans to use Richard's claim to the throne for her own takeover, while Kahlan and Zedd pursue the commander's forces elsewhere.")
          put('legend-of-the-seeker',2,'s02e08',"Denna steals the compass needed to locate the Stone of Tears and escapes with Zedd as her prisoner. While pursuing them, Richard is crippled by headaches caused by his emerging wizard powers; the Sisters of the Light tell him that survival requires training at the Palace of the Prophets, forcing him to leave the search for Zedd to Kahlan and Cara.")
          put('legend-of-the-seeker',2,'s02e09',"At the Palace of the Prophets, Richard trains with the Sisters of the Light and learns from Sister Nicci that their intentions toward him are not what they claim. With Richard unavailable, Zedd accepts that another Seeker must carry the Sword of Truth and joins Kahlan and Cara in finding a replacement, while Richard forms an uneasy alliance with Nicci inside the Palace.")
          put('legend-of-the-seeker',2,'s02e10',"Richard becomes trapped in the Valley of Perdition, where magic gives physical form to fears involving Kahlan, his mission and the people he loves. Outside the valley, Kahlan, Zedd, Cara and the newly chosen Seeker Leo search for him while Sister Nicci moves against Kahlan and Cara's growing attachment to Leo complicates the rescue.")
          put('legend-of-the-seeker',2,'s02e11',"An enchanted amulet splits Kahlan into two separate versions of herself: one dominated by the Mother Confessor's duty and power, the other by the emotions she normally restrains. Richard and Cara continue the Stone search while Zedd tries to reunite the two halves before either incomplete Kahlan makes choices the whole person would reject.")
          put('legend-of-the-seeker',2,'s02e12',"Cara dies protecting Richard and returns as a baneling, bound to the Keeper's rule that she must kill each day to remain alive. Richard, Kahlan and Zedd search for a cure while Cara tries to resist the bargain, and Zedd's brother Thaddicus becomes involved with a potion being sold as a way to end banelings' dependence on murder.")
          put('legend-of-the-seeker',2,'s02e13',"The Margrave of Rothenberg captures Kahlan as part of a bargain connected to the Keeper, and a spell over his territory prevents the use of magic to free her. Richard, Zedd and Cara exploit the Margrave's search for a bride by entering Cara as a noblewoman, turning courtship rituals into the cover for a rescue operation.")
          put('legend-of-the-seeker',2,'s02e14',"After failing to kill Kahlan, Sister Nicci is hunted by both the Sisters of the Dark and Darken Rahl. She casts a spell binding her life directly to Kahlan's, making any attack on Nicci fatal to the Mother Confessor and forcing Richard to protect his enemy while leading her toward the Stone of Tears; Kahlan seeks help from her estranged father to break the bond.")
          put('legend-of-the-seeker',2,'s02e15',"A powerful woman claiming to be the Creator accuses Richard of serving the Keeper and places the Seeker on trial. Kahlan, Cara and Zedd investigate the claimant's identity to expose the deception and save Richard, while Darken Rahl treats her appearance as a threat to his own plans and prepares to eliminate her.")
          put('legend-of-the-seeker',2,'s02e16',"A magician seeking revenge for sons killed during the war traps Kahlan and Cara inside a sealed tomb and releases a Nygaax as part of his attack on Richard's group. Richard races to free them before the chamber runs out of air, while Zedd faces the creature outside and tries to keep the revenge scheme from claiming more people.")
          put('legend-of-the-seeker',2,'s02e17',"Zedd and Thaddicus learn that the man responsible for their father's death may still be alive and leave the others to pursue him. Richard's parallel search for information about the Stone brings him to a scholar with knowledge of an ancient scroll, and the two investigations converge on family history that connects Zedd's past to Darken Rahl's.")
          put('legend-of-the-seeker',2,'s02e18',"A Sister of the Dark steals an ancient scroll containing instructions needed for the Stone quest, sending Richard, Kahlan, Zedd and Cara after her. In the Underworld, Rahl identifies Walter, a man who closely resembles him, and uses the resemblance in a plan to exchange places and return to the living world, drawing the Seeker into the attempted resurrection.")
          put('legend-of-the-seeker',2,'s02e19',"Newly restored to life, Rahl uses information from the recovered scroll to stay beyond the Keeper's reach and offers Richard knowledge that could advance the Stone search. Richard accepts a temporary alliance with his former enemy, while Kahlan and Cara try to save the last members of a species endangered by Rahl's actions and the Keeper sends the Sisters of the Dark to reclaim him.")
          put('legend-of-the-seeker',2,'s02e20',"The compass finally leads Richard and Kahlan to a hidden valley whose inhabitants have guarded the Stone of Tears for generations and prevent anyone who enters from leaving. Outside the valley, Cara encounters a woman from her past and she and Zedd are trapped, separating the group just as Richard reaches the object they have spent the season seeking.")
          put('legend-of-the-seeker',2,'s02e21',"Rahl regains the Stone and turns Cara against Richard, forcing the Seeker to capture his own ally rather than kill her. Zedd attempts to reverse the magic controlling Cara but instead triggers the Spell of Undoing, creating an alternate world in which Cara never became Mord-Sith and the chain of events that once defeated Rahl never occurred.")
          put('legend-of-the-seeker',2,'s02e22',"Richard reaches the Pillars of Creation with the Stone of Tears and attempts to seal the rifts allowing the Keeper's influence into the world. Separated from his companions, he faces the final struggle over the Stone while Sister Nicci takes control of Kahlan and sends the Mother Confessor against the people trying to stop the Keeper.")

          # LOIS & CLARK — only the descriptions found vague in the manual review are replaced;
          # the previously rewritten factual descriptions are preserved.
          put('lois-and-clark',1,'s01e09',"A green meteorite found near Smallville attracts Jason Trask, who recognizes that the material can weaken Superman and turns the Kent hometown into the center of his hunt. Lois and Clark investigate the federal activity together, giving Lois her first close look at Clark's parents and giving Clark his first direct encounter with kryptonite.")
          put('lois-and-clark',1,'s01e14',"Lois witnesses the murder of a scientist who claimed to have developed a breakthrough treatment for male impotence, making her the killer's next target. Clark and Perry protect her while the investigation traces the murder through the scientist's research, an old affair and the disguise skills of the assassin known as Mr. Make-Up.")
          put('lois-and-clark',1,'s01e15',"Children connected to wealthy families begin disappearing after encounters with magician Darrin Romick, whose performances are a cover for hypnotic control and kidnapping. Lois and Clark follow the vanished children through Romick's act and family history, while Superman has to counter a scheme built around manipulating what victims believe they have seen.")
          put('lois-and-clark',1,'s01e17',"A Kryptonian globe recovered from Clark's spacecraft begins showing him messages from Jor-El and Lara, finally giving Clark direct information about the planet and parents he lost as an infant. Lex Luthor acquires the globe and studies the same recordings, bringing him closer to connecting Clark's private history with Superman's arrival on Earth.")
          put('lois-and-clark',2,'s02e02',"A sound-based criminal uses powerful acoustic technology to incapacitate people across Metropolis and eventually learns that the same frequencies can disable Superman. Lois and Clark investigate the source of the attacks while professional rivalry over an award strains their partnership at the Daily Planet.")
          put('lois-and-clark',3,'s03e21',"Zara and Ching arrive secretly from New Krypton and subject Superman to tests intended to determine whether he is the Kryptonian heir they have been seeking. Lois and Clark initially treat the strangers as a threat to Metropolis, but the encounters reveal a political crisis on New Krypton that will force Clark to consider responsibilities beyond Earth.")

          # Apply replacements.
          expected_full = {
              'kevin-from-work': 10,
              'the-law-according-to-lidia-poet': 18,
              'eva-lasting': 45,
              'last-resort': 13,
              'legend-of-the-seeker': 43,
          }
          changed_paths=set()
          by_path={}
          for key,text in R.items():
              folder,season,eid=key
              by_path.setdefault(f'data/series/{folder}/season-{season:02d}-meta.json',[]).append((key,text))
          for path, rows in by_path.items():
              with open(path,encoding='utf-8') as f: meta=json.load(f)
              for (folder,season,eid),text in rows:
                  if eid not in meta.get('episodes',{}):
                      raise SystemExit(f'Missing target episode {folder} S{season:02d} {eid}')
                  meta['episodes'][eid]['description']=text
              with open(path,'w',encoding='utf-8',newline='\n') as f:
                  json.dump(meta,f,ensure_ascii=False,separators=(',',':')); f.write('\n')
              changed_paths.add(path)

          # Ensure the five fully rewritten shows have complete episode coverage.
          for folder,count in expected_full.items():
              actual=[]
              mapped=[]
              for mp in sorted(glob.glob(f'data/series/{folder}/season-*-meta.json')):
                  meta=json.load(open(mp,encoding='utf-8'))
                  s=int(meta['season'])
                  for eid in meta.get('episodes',{}):
                      actual.append((s,eid))
                      if (folder,s,eid) in R: mapped.append((s,eid))
              if len(actual)!=count or set(actual)!=set(mapped):
                  raise SystemExit(f'Incomplete editorial coverage for {folder}: actual={len(actual)} mapped={len(mapped)} missing={sorted(set(actual)-set(mapped))}')

          # Description quality audit across all six series.
          dirs=['kevin-from-work','the-law-according-to-lidia-poet','eva-lasting','last-resort','legend-of-the-seeker','lois-and-clark']
          banned=re.compile(r'(this collection|collection-local|source runtimes?|retained file|scoring row|season finale|series finale|riveting|exciting season|life-altering|life-changing journey|bombshells? drop|new chapter of their lives|if all goes according to plan|treacherous path|daring rescue attempt|mysterious past|possible murder|the characters confront|develops that conflict|surrounding story)',re.I)
          total=0; seasons=0; descs=[]; bad=[]; short=[]
          for d in dirs:
              for mp in sorted(glob.glob(f'data/series/{d}/season-*-meta.json')):
                  seasons+=1
                  meta=json.load(open(mp,encoding='utf-8'))
                  sd=str(meta.get('description','')).strip()
                  if len(sd)<180 or banned.search(sd): bad.append(('season',mp,sd))
                  for eid,m in meta.get('episodes',{}).items():
                      total+=1; desc=str(m.get('description','')).strip(); descs.append(desc)
                      if banned.search(desc): bad.append(('episode',mp,eid,desc))
                      if len(desc)<90: short.append((mp,eid,len(desc),desc))
          if seasons!=15 or total!=216: raise SystemExit(f'Description count mismatch seasons={seasons} episodes={total}')
          if bad: raise SystemExit('Generic/promotional copy remains: '+repr(bad))
          if short: raise SystemExit('Short description remains: '+repr(short))
          if len(descs)!=len(set(descs)):
              c=collections.Counter(descs); raise SystemExit('Duplicate descriptions: '+repr([(d,n) for d,n in c.items() if n>1]))

          # Re-audit locked physical/scoring invariants from core data.
          expected = {
              'kevin-from-work': (10,10,12693),
              'the-law-according-to-lidia-poet': (18,18,54443),
              'eva-lasting': (45,45,121519),
              'last-resort': (13,13,33508),
              'legend-of-the-seeker': (44,43,114365),
              'lois-and-clark': (88,87,241631),
          }
          batch=[0,0,0]
          for folder,want in expected.items():
              conceptual=scoring=runtime=0
              for cp in sorted(glob.glob(f'data/series/{folder}/season-[0-9][0-9].json')):
                  core=json.load(open(cp,encoding='utf-8'))
                  eps=core.get('episodes',[])
                  scoring+=len(eps)
                  conceptual+=sum(2 if '-' in str(e.get('number','')) else 1 for e in eps)
                  runtime+=sum(int(e.get('runtimeSeconds') or 0) for e in eps)
              got=(conceptual,scoring,runtime)
              if got!=want: raise SystemExit(f'Locked total changed for {folder}: {got} != {want}')
              for i,v in enumerate(got): batch[i]+=v
          if tuple(batch)!=(218,216,578159): raise SystemExit(f'Batch totals changed: {batch}')

          # Special cases must still be untouched.
          lc3=json.load(open('data/series/lois-and-clark/season-03.json',encoding='utf-8'))
          ep=next(x for x in lc3['episodes'] if x['id']=='s03e01')
          if (ep['title'],ep['runtimeSeconds'])!=('We Have a Lot to Talk About',2753): raise SystemExit('Lois S03E01 changed')
          lc4=json.load(open('data/series/lois-and-clark/season-04.json',encoding='utf-8'))
          order=[(x['id'],x['title']) for x in lc4['episodes'] if x['id'] in ('s04e14','s04e15','s04e16')]
          if order!=[('s04e14','A.K.A. Superman'),('s04e15','Meet John Doe'),('s04e16','Lois and Clarks')]: raise SystemExit('Lois S04 local order changed')
          flags=json.load(open('data/series/lois-and-clark/episode-flags.json',encoding='utf-8'))['flags']['M']
          if len(flags)!=47: raise SystemExit(f'Lois M flag count changed: {len(flags)}')
          leg=json.load(open('data/series/legend-of-the-seeker/season-01.json',encoding='utf-8'))['episodes'][0]
          lc1=json.load(open('data/series/lois-and-clark/season-01.json',encoding='utf-8'))['episodes'][0]
          if (leg['id'],leg['runtimeSeconds'])!=('s01e01-02',5323): raise SystemExit('Legend combined pilot changed')
          if (lc1['id'],lc1['runtimeSeconds'])!=('s01e01-02',5549): raise SystemExit('Lois combined pilot changed')

          print(f'EDITORIAL AUDIT PASSED: {len(R)} episode descriptions replaced after manual review; all 216 descriptions audited; 15 season plots retained; 6/15/218/216/578159 invariants unchanged; 47 Lois M flags intact.')
          PY

          rm -f .github/workflows/manual-review-dump-six-series.yml
          rm -f .github/workflows/editorial-rewrite-six-series-plots.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          echo 'Changed paths:'
          git diff --cached --name-only
          # Core season JSON, catalogue files, flags and renderer files must not change.
          if git diff --cached --name-only | grep -Ev '^(data/series/(kevin-from-work|the-law-according-to-lidia-poet|eva-lasting|last-resort|legend-of-the-seeker|lois-and-clark)/season-[0-9][0-9]-meta\.json|\.github/workflows/(manual-review-dump-six-series|editorial-rewrite-six-series-plots)\.yml)$'; then
            echo 'Unexpected file changed' >&2
            exit 1
          fi
          git commit -m 'Complete editorial rewrite of six-series plot metadata'
          git push origin main
