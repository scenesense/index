name: Repair six-series descriptions
on:
  push:
    paths:
      - '.github/workflows/repair-six-series-descriptions.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace generic descriptions and audit all six series
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          import json, glob, os, re, collections

          season_desc = {
            ('kevin-from-work',1): "Kevin's drunken farewell confession to Audrey becomes an office-wide problem when his overseas job disappears and he has to return to the cubicle beside her. Their attempts to act normal are complicated by Audrey's boyfriend Brock, Kevin dating other women, Roxie's chaotic move into his apartment, and coworkers who keep turning private embarrassment into public gossip. By the finale, Audrey's jealousy and trouble with Brock give Kevin a reason to stop playing harmless friend and finally compete for her.",
            ('the-law-according-to-lidia-poet',1): "After a Turin court cancels Lidia Poët's admission to the bar because she is a woman, she refuses to stop practicing and begins solving cases unofficially through her brother Enrico's law office. A murdered ballerina, an accused anarchist, a family confession, a suspicious death after a séance and other cases sharpen her methods while journalist Jacopo draws her into both investigation and romance. Her appeal against disbarment grows alongside the cases, turning each victory into part of a larger fight for the right to practice law.",
            ('the-law-according-to-lidia-poet',2): "Two years after her disbarment, Lidia is campaigning for women's legal and political rights when the murder of journalist Attila Brusaferro exposes a deeper conspiracy. She and Jacopo follow the trail toward Nitti while new prosecutor Pierluigi Fourneau becomes both investigative partner and romantic complication, and Enrico is pushed toward a parliamentary career that could advance Lidia's proposed law. Separate murders keep intersecting with the political plot until the conspiracy and Lidia's personal loyalties collide.",
            ('the-law-according-to-lidia-poet',3): "In April 1887, Lidia's fight reaches Parliament as Enrico gets her reform bill before committee, but a murder case puts the argument into brutally personal form. Her closest friend Grazia Fontana is accused of killing an abusive husband, with Fourneau prosecuting and Lidia helping the defense before an all-male jury. Jacopo returns to Turin to cover the trial, forcing Lidia to navigate the landmark self-defense case, her divided loyalties between Fourneau and Jacopo, and the question of whether law can recognize violence endured inside marriage.",
            ('eva-lasting',1): "Eva Samper arrives as the first girl at José María Root and immediately overturns the boys' assumptions about women, sex, literature and politics. Camilo falls in love with her while Castro, Salcedo, Pabón and Arbeláez are pulled into the new friendships and conflicts she provokes; Camilo's encounter with Luisa creates consequences he cannot keep separate from Eva. As Eva's guarded family background comes into view, her presence changes both the school and the group, ending with secrets exposed and her sudden departure.",
            ('eva-lasting',2): "Eva returns as Camilo learns Luisa is pregnant, forcing him to confront impending fatherhood just as he hopes to repair his relationship with Eva. During the group's final school year in 1977, the pregnancy divides families and classmates, student politics and new romances test the friends, and Ana and José's marriage begins to fracture. Camilo's attempt to be responsible without losing Eva becomes the central conflict as the group starts making decisions that will follow them beyond school.",
            ('eva-lasting',3): "Leaving José María Root behind, Camilo, Eva and their friends step into adult life with far less certainty than they expected. Camilo struggles to balance his relationship with Eva against his responsibilities as Luisa's co-parent, Luisa and Arbeláez grow closer, and the group fights to stay intact as university, work, family and politics pull them apart. Eva's connection to Professor Silva and political activism eventually places her under police scrutiny, turning the group's new independence into a much more dangerous test.",
            ('eva-lasting',4): "By the 1980s, the old José María Root group is trying to build adult lives rather than merely imagine them. Camilo's first novel and Eva's growing career expose class, money and ambition problems in their relationship; Salcedo's addiction, Pabón's love life and the AIDS crisis reshape the group around them. A three-year separation, Eva's return and a film project bring the friends together again, until political violence involving M-19 forces them to confront how far Colombia and their own lives have changed.",
            ('last-resort',1): "Captain Marcus Chaplin and XO Sam Kendal refuse an irregular order to launch nuclear missiles at Pakistan, survive an attack by their own navy, and seize the NATO station on Sainte Marina to keep the USS Colorado and its crew alive. Chaplin's nuclear deterrent buys time but turns the island into a pressure cooker: Prosser challenges his command, local strongman Julian Serrat exploits the crisis, China moves in, and Washington pressures the sailors' families while Kylie Sinclair and Christine Kendal uncover evidence of the conspiracy. The standoff ends in mutiny, a battle for the submarine and Chaplin's final decision to keep the Colorado from becoming someone else's weapon.",
            ('legend-of-the-seeker',1): "After Darken Rahl's invasion reaches the Midlands, Richard Cypher learns he is the Seeker named by prophecy and crosses the Boundary with Confessor Kahlan and wizard Zedd. Their campaign against Rahl becomes a race for the three Boxes of Orden, whose combined magic can command anyone; Richard also discovers the truth about his family, including Jennsen and Zedd. When Richard finally assembles Orden and Kahlan uses her Confessor power, the clash destroys Rahl but also tears open the veil to the Underworld.",
            ('legend-of-the-seeker',2): "Darken Rahl's death leaves a tear in the veil to the Underworld, allowing the Keeper to send banelings and the dead back into the world. Richard, Kahlan and Zedd are joined by Mord-Sith Cara and search for the Stone of Tears, the only artifact capable of sealing the rift. Along the way Kahlan learns she is the last Confessor, Richard's heritage makes him a target for competing powers, and the Keeper repeatedly tries to corrupt the group before the Stone can be delivered and the veil repaired.",
            ('lois-and-clark',1): "Clark Kent arrives in Metropolis, joins the Daily Planet beside Lois Lane and creates Superman so he can use his powers without surrendering his private life. Lois becomes fascinated with Superman while overlooking Clark, and their investigations repeatedly cross Lex Luthor, whose public charm masks a criminal empire and increasingly personal interest in Lois. The season builds toward Luthor's proposal and planned wedding to Lois as Clark, Perry, Jimmy and Jack race to expose him and Superman is trapped by kryptonite.",
            ('lois-and-clark',2): "With Lex Luthor apparently gone, Lois and Clark's partnership grows more intimate while new enemies learn how vulnerable Superman can be to kryptonite, technology and public opinion. Metallo, the Prankster, Intergang and a resurrected Luthor repeatedly threaten them, while Mayson Drake and Dan Scardino complicate the Lois-Clark-Superman triangle. By the finale, Clark's secret is used against his parents and Lois, pushing him to stop circling the relationship and ask Lois to marry him.",
            ('lois-and-clark',3): "Lois begins the season knowing Clark is Superman, and their engagement finally puts honesty at the center of the relationship. Their path to marriage is repeatedly derailed by super-powered threats, Tempus and ultimately Lex Luthor, who replaces Lois with a clone, kidnaps the real Lois and leaves her with amnesia after his return. Once they recover from the failed wedding and reunite, Kryptonians Zara and Ching arrive with news that Clark is heir to New Krypton, forcing him to choose between life with Lois and preventing a civil war on another world.",
            ('lois-and-clark',4): "Clark returns from the New Krypton conflict, defeats Lord Nor and finally marries Lois for real, shifting the series from courtship to the complications of married life. Their first year together brings the Wedding Destroyer, Mxyzptlk, red kryptonite, Tempus's presidential takeover and the hidden legacy of Lex Luthor through his son. Alongside those threats, Lois and Clark confront whether a Kryptonian and a human can have children, ending with grim medical news followed by the unexplained arrival of a baby in their home.",
          }

          lois_fix = {
            (1,'s01e03'): "A covert government unit led by Jason Trask raids the Daily Planet while hunting Superman as a dangerous alien. Lois investigates the bogus agents as Clark follows their files for clues about the spacecraft that brought him to Earth and his own origins.",
            (1,'s01e04'): "Lex Luthor stages a succession of escalating emergencies to measure Superman's strength, speed and weaknesses, even putting innocent lives at risk. Meanwhile Lois's obsession with getting the definitive Superman story leaves Clark competing with his own alter ego for her attention.",
            (1,'s01e10'): "A freak winter heat wave is blamed on Superman, and public pressure leads authorities to jail him as an environmental threat. Lois and Clark investigate the real cause while Metropolis discovers what happens when its protector is forced to sit out.",
            (1,'s01e22'): "As Lois prepares to marry Lex Luthor, Clark and the Daily Planet team assemble proof of Luthor's criminal empire. Luthor traps Superman in a kryptonite cage, leaving Clark to escape, stop the wedding and expose the man Lois is about to marry.",
            (2,'s02e01'): "Lex Luthor's ex-wife Arianna Carlin sets out to destroy the people she blames for his death, using a Lois look-alike to discredit Lois and turn Superman against her. Clark and Lois have to unravel the impersonation before Arianna's revenge becomes fatal.",
            (2,'s02e04'): "Kyle Griffin, a criminal Lois once helped send to prison, returns as the Prankster and bombards her with elaborate threats and booby-trapped gifts. His harassment is cover for a larger scheme involving stolen components for a nuclear weapon.",
            (2,'s02e10'): "Lucy Lane's boyfriend Johnny Corben is transformed into Metallo, a cybernetic weapon powered by kryptonite. With Superman physically overmatched by the machine's radioactive heart, Lois and Clark try to stop the men who rebuilt Johnny before they turn him fully against them.",
            (2,'s02e11'): "A series of Chinatown robberies leads Lois and Clark into a martial-arts conflict built around stolen mystical power. Superman's raw strength is little help against an enemy who can redirect energy through chi, forcing the investigation to matter as much as the fight.",
            (2,'s02e13'): "Lex Luthor is secretly restored to life and returns to Metropolis determined to reclaim Lois and punish Superman. Working through the people who resurrected him, Luthor tries to separate Lois from Clark before revealing that his old obsession has survived with him.",
            (2,'s02e14'): "Television reporter Diana Stride pursues Superman's secret identity with the instincts of a rival journalist and the methods of an assassin. Her investigation closes in on Clark while she prepares a kryptonite-based attack designed to kill Superman once she has the evidence she wants.",
            (2,'s02e15'): "The Prankster escapes with a device that can freeze people in place, giving him a new way to terrorize Lois. His revenge campaign collides with her planned interview with the President, turning a personal vendetta into a threat to everyone at the event.",
            (2,'s02e21'): "A man sues Superman for injuries he claims were caused during a rescue, forcing Clark to defend the very idea of intervening when people are in danger. At the same time, Lois must sort out her feelings for Clark, Superman and Dan Scardino as the romantic triangle finally becomes impossible to ignore.",
            (2,'s02e22'): "A blackmailer who has discovered Clark's identity threatens Jonathan and Martha and forces Superman to commit crimes while keeping Lois under close watch. Surviving the scheme convinces Clark that secrecy cannot keep defining his life with Lois, and he finally proposes to her.",
            (3,'s03e08'): "A woman publicly claims that Superman fathered her young son, and the boy appears to have abilities that make the accusation disturbingly plausible. Lois and Clark investigate the child's real parentage and the source of his powers while Clark faces the scandal as both reporter and supposed father.",
            (3,'s03e10'): "A virtual-reality mastermind traps Lois inside an artificial world and intends to keep her mind there permanently. Clark and Jimmy must trace the system and get Lois out before the simulated life replaces her connection to the real one.",
            (3,'s03e16'): "Clark discovers that the woman he married is a clone while the real Lois is in Lex Luthor's hands with her memory damaged. Luthor uses her confusion to rebuild their old relationship, forcing Clark to find Lois before she can be manipulated into choosing Lex again.",
            (3,'s03e22'): "Zara and Ching reveal that Clark is Kryptonian royalty and ask him to leave Earth to stop a civil war on New Krypton. An assassin sent by Lord Nor makes the threat immediate, leaving Lois and Clark to face the possibility that saving another world may require their separation.",
            (4,'s04e03'): "As Lois and Clark prepare to try marriage again, escaped 'Wedding Destroyer' Myrtle Beech targets their ceremony in revenge for the investigation that sent her to prison. A rigged ring, her manipulative therapist and a persistent tabloid reporter threaten the wedding until the couple finally reaches the altar.",
            (4,'s04e05'): "A scientist's youth-draining experiment turns young victims, including Jimmy, into elderly men within days. Lois and Clark race to reverse the process while Lois is unsettled by the discovery that Superman may age far more slowly than she will.",
            (4,'s04e06'): "An ex-informant is shot while Lois is holding the gun, and video evidence makes the murder case against her look airtight. Clark and Lois's defense team investigate the impossible shooting as Jefferson Cole's holographic technology reveals how carefully she has been framed.",
            (4,'s04e07'): "With Lois imprisoned for a murder she did not commit, Superman engineers her escape so she and Clark can investigate the frame-up from outside the system. They trace the conspiracy back toward Jefferson Cole while police hunt Lois as a fugitive.",
            (4,'s04e08'): "Lois and Clark befriend another married couple, Bob and Carol, hoping for the kind of ordinary social life newlyweds are supposed to have. The friendship turns dangerous when Bob's hidden identity and unusual powers reveal that their new friends are anything but ordinary.",
            (4,'s04e09'): "A real-estate con artist tries to frighten Lois and Clark out of their townhouse by staging a haunting, only for the scheme to awaken a genuine ghost. The couple must uncover Katie Banks's unfinished history before the supernatural threat takes control of their home.",
            (4,'s04e11'): "Mxyzptlk traps Metropolis in an endlessly repeating Christmas Eve, with each cycle leaving people more hopeless and destructive. Clark is one of the few able to notice the repetitions and has to outthink the imp before the city loses the will to escape the loop.",
            (4,'s04e12'): "Red kryptonite makes Superman's powers surge unpredictably, prompting the mayor to order him out of action. Lois and Jimmy trace the radiation to Perry's son Jerry, who is being used by criminals planning a massive sonic-extortion attack on Metropolis.",
            (4,'s04e14'): "Superman-obsessed Penny Barnes uses a computer profile to identify Jimmy Olsen as the man she believes is secretly Superman and begins dating him to get closer. Her mistake puts both of them in danger when her employer's lethal satellite scheme convinces him she really is Superman's girlfriend.",
            (4,'s04e15'): "Tempus returns from the future as presidential candidate John Doe and uses a stolen subliminal device to make voters trust him automatically. After winning the election, he turns the government against Superman and ultimately sabotages a time window to strand Clark outside normal time.",
            (4,'s04e16'): "With Clark trapped outside time and Tempus ruling through mass brainwashing, Lois and H.G. Wells bring the alternate-universe Clark to Metropolis as a replacement Superman. Together they destroy Tempus's subliminal system, stop a nuclear launch and use the broken time window's timing to recover Lois's Clark.",
            (4,'s04e17'): "The Daily Planet gets a new owner, Leslie Luckabee, just as a lethal super-fast vigilante called Vixen begins killing people tied to Lex Luthor's former companies. Superman discovers Vixen is a machine, but her destruction only deepens the mystery of who built her and why Leslie is being targeted.",
            (4,'s04e18'): "Lois and Clark investigate murders connected to Vixen while Leslie Luckabee courts Lois and presents himself as Lex Luthor's heir. Evidence of a shadow-like assassin and a hidden figure called Mr. Smith suggests that the Daily Planet's new owner is part of a larger plan to revive Luthor's legacy.",
            (4,'s04e19'): "Clark investigates Leslie Luckabee's invented past and uncovers that the disfigured Mr. Smith is the real Lex Luthor Jr., with Leslie serving as his public stand-in. Lex Jr. uses a neural device to spy on and torture Lois, then kidnaps her in an attempt to replace Clark in her life.",
            (4,'s04e21'): "Children across Metropolis are disappearing into the care of embittered toy inventor Harold Kripstly, who believes kidnapping them will protect them from abusive adults. Lois and Clark follow the missing-child cases to his hidden refuge before his distorted idea of rescue traps even more children.",
            (4,'s04e22'): "Lois and Clark reveal Superman's identity to Sam Lane while seeking an answer to whether they can have children, only to learn that Clark may be unable to father one with Lois. At the same time, a telekinetic criminal kidnaps their parents, and the episode ends with an unexplained baby left in Clark's old bassinet.",
          }

          target_dirs=['kevin-from-work','the-law-according-to-lidia-poet','eva-lasting','last-resort','legend-of-the-seeker','lois-and-clark']
          paths=[]
          for d in target_dirs:
            paths += sorted(glob.glob(f'data/series/{d}/season-*-meta.json'))
          if len(paths)!=15:
            raise SystemExit(f'Expected 15 season meta files, found {len(paths)}')

          changed=[]
          for path in paths:
            meta=json.load(open(path,encoding='utf-8'))
            d=path.split('/')[2]
            s=int(meta['season'])
            key=(d,s)
            if key not in season_desc:
              raise SystemExit(f'Missing replacement season description for {key}')
            meta['description']=season_desc[key]
            if d=='lois-and-clark':
              for (season,eid),desc in lois_fix.items():
                if season==s:
                  if eid not in meta.get('episodes',{}):
                    raise SystemExit(f'Missing Lois episode {s=} {eid=}')
                  meta['episodes'][eid]['description']=desc
            with open(path,'w',encoding='utf-8',newline='\n') as f:
              json.dump(meta,f,ensure_ascii=False,separators=(',',':'))
              f.write('\n')
            changed.append(path)

          bad_patterns=[
            r'\bthis collection\b', r'\bcollection-local\b', r'\bpreserv(?:e|ing) .*order\b',
            r'\bruns from\b.*\bthrough\b', r'\bthis .* episode\b', r'\bepisode-specific\b',
            r'\bdevelops that conflict\b', r'\bsurrounding story\b', r'\bthe characters confront\b',
            r'\bsource runtimes?\b', r'\bretained file\b', r'\bcurated\b', r'\bscoring row\b'
          ]
          rx=re.compile('|'.join(bad_patterns),re.I)
          episode_total=0; bad=[]; shorts=[]; all_desc=[]
          for path in paths:
            meta=json.load(open(path,encoding='utf-8'))
            sd=str(meta.get('description','')).strip()
            if rx.search(sd) or len(sd)<180:
              bad.append(('season',path,sd))
            for eid,m in meta.get('episodes',{}).items():
              desc=str(m.get('description','')).strip(); episode_total+=1; all_desc.append(desc)
              if rx.search(desc): bad.append(('episode',path,eid,desc))
              if len(desc)<90: shorts.append((path,eid,len(desc),desc))
          if episode_total!=216:
            raise SystemExit(f'Expected 216 episode descriptions, found {episode_total}')
          if len(all_desc)!=len(set(all_desc)):
            c=collections.Counter(all_desc)
            raise SystemExit('Duplicate episode descriptions: '+repr([(d,n) for d,n in c.items() if n>1]))
          if bad:
            raise SystemExit('Generic description survived: '+repr(bad))
          if shorts:
            raise SystemExit('Suspiciously short description survived: '+repr(shorts))

          # Top-level descriptions for the same six series must also be plot text,
          # never collection bookkeeping.
          wanted={'kevin-from-work-2015','the-law-according-to-lidia-poet-2023','eva-lasting-2023','last-resort-2012','legend-of-the-seeker-2008','lois-and-clark-1993'}
          found={}
          for catalog_path in ['data/series/index.json','data/series/index-additions.json']:
            cat=json.load(open(catalog_path,encoding='utf-8'))
            for e in cat.get('series',[]):
              if e.get('id') in wanted:
                found[e['id']]=str(e.get('description','')).strip()
          if set(found)!=wanted:
            raise SystemExit(f'Top-level series audit mismatch: {set(found)}')
          for sid,desc in found.items():
            if rx.search(desc) or len(desc)<100:
              raise SystemExit(f'Generic/weak top-level description {sid}: {desc}')

          print('DESCRIPTION AUDIT PASSED')
          print('15 meaningful season descriptions')
          print('216 meaningful unique episode descriptions')
          print('33 Lois & Clark boilerplate episode descriptions replaced')
          print('6 top-level series descriptions checked for collection/generic language')
          PY

          rm -f .github/workflows/audit-six-series-descriptions.yml
          rm -f .github/workflows/repair-six-series-descriptions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only
          git commit -m 'Replace generic six-series plot descriptions'
          git push origin main
