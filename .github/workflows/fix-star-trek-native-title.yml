name: Fix Star Trek I native title

on:
  push:
    paths:
      - '.github/workflows/fix-star-trek-native-title.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace pseudo-title with native split title
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_custom = '"Star Trek Generations":{main:"Star Trek",subtitle:"Generations"}'
          new_custom = '"Star Trek Generations":{main:"Star Trek",subtitle:"Generations"},"Star Trek: The Motion Picture":{main:"Star Trek I",subtitle:"The Motion Picture"}'
          if index.count(old_custom) != 1:
              raise RuntimeError('Expected Star Trek Generations custom title mapping once')
          index = index.replace(old_custom, new_custom, 1)
          if index.count('styles.css?v=20260901-2') != 1:
              raise RuntimeError('Expected current stylesheet cache key once')
          index = index.replace('styles.css?v=20260901-2', 'styles.css?v=20260901-3', 1)
          index_path.write_text(index, encoding='utf-8')

          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')
          old_block = '''/* SceneSense: ST1 title + Man from Earth 4K accent */
.movieCard[data-movie="star-trek-the-motion-picture-1979"] .cardTitle{font-size:0!important;line-height:1.02!important}
.movieCard[data-movie="star-trek-the-motion-picture-1979"] .cardTitle::after{content:"Star Trek I";font-size:19.5px;line-height:1.02}
.movieHeroGrid:has(.detailPoster[alt="Star Trek: The Motion Picture poster"]) #detailTitle{font-size:0!important;line-height:.98!important}
.movieHeroGrid:has(.detailPoster[alt="Star Trek: The Motion Picture poster"]) #detailTitle::after{content:"Star Trek I";font-size:clamp(34px,5vw,66px);line-height:.98}
.movieCard[data-movie="the-man-from-earth-2007"] .format4k,
.movieHeroGrid:has(.detailPoster[alt="The Man from Earth poster"]) .format4k{color:#a04a4a!important}
@media(max-width:900px){
  .movieHeroGrid:has(.detailPoster[alt="Star Trek: The Motion Picture poster"]) #detailTitle::after{font-size:40px}
}
@media(max-width:620px){
  .movieCard[data-movie="star-trek-the-motion-picture-1979"] .cardTitle::after{font-size:16.5px}
  .movieHeroGrid:has(.detailPoster[alt="Star Trek: The Motion Picture poster"]) #detailTitle::after{font-size:30px}
}
'''
          new_block = '''/* SceneSense: Man from Earth 4K accent */
.movieCard[data-movie="the-man-from-earth-2007"] .format4k,
.movieHeroGrid:has(.detailPoster[alt="The Man from Earth poster"]) .format4k{color:#a04a4a!important}
'''
          if css.count(old_block) != 1:
              raise RuntimeError('Expected current Star Trek pseudo-title CSS block once')
          css = css.replace(old_block, new_block, 1)
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "SceneSense maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Render Star Trek I as native title"
          git push origin HEAD:main
