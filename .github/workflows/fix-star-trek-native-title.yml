name: Fix Star Trek I native title

on:
  push:
    paths:
      - '.github/workflows/fix-star-trek-native-title.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace pseudo title with normal title
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old = '"Star Trek Generations":{main:"Star Trek",subtitle:"Generations"}'
          new = '"Star Trek Generations":{main:"Star Trek",subtitle:"Generations"},"Star Trek: The Motion Picture":{main:"Star Trek I",subtitle:"The Motion Picture"}'
          if index.count(old) != 1:
              raise RuntimeError('Star Trek title mapping anchor missing')
          index = index.replace(old, new, 1)
          if index.count('styles.css?v=20260901-2') != 1:
              raise RuntimeError('Stylesheet cache anchor missing')
          index = index.replace('styles.css?v=20260901-2', 'styles.css?v=20260901-3', 1)
          index_path.write_text(index, encoding='utf-8')

          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')
          if '/* SceneSense: ST1 title + Man from Earth 4K accent */' not in css:
              raise RuntimeError('Star Trek CSS anchor missing')
          css = css.replace('/* SceneSense: ST1 title + Man from Earth 4K accent */', '/* SceneSense: Man from Earth 4K accent */', 1)
          lines = css.splitlines(keepends=True)
          lines = [line for line in lines if 'star-trek-the-motion-picture-1979' not in line and 'Star Trek: The Motion Picture poster' not in line]
          css = ''.join(lines)
          css = css.replace('@media(max-width:900px){\n}\n', '')
          css = css.replace('@media(max-width:620px){\n}\n', '')
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "SceneSense maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Render Star Trek I as normal split title"
          git push origin HEAD:main
