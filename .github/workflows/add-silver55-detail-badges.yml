name: Add SiLVER55 detail badges

on:
  push:
    paths:
      - '.github/workflows/add-silver55-detail-badges.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add SiLVER55 logos to selected detail score rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          targets = [
              'a-biltmore-christmas-2023',
              'an-hour-behind-2017',
              'cant-buy-my-love-2017',
              'christmas-with-holly-2012',
              'snow-bride-2013',
              'the-first-time-2012',
          ]

          ids = set()
          for path in [Path('data/movies.json'), Path('data/movies-additions-20260830.json')]:
              payload = json.loads(path.read_text(encoding='utf-8'))
              ids.update(movie.get('id') for movie in payload.get('movies', []))
          missing = [movie_id for movie_id in targets if movie_id not in ids]
          if missing:
              raise RuntimeError(f'Missing movie IDs: {missing}')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.detailBlurayBadge,.detailPrismBadge{position:static;display:block;width:auto;height:64px;object-fit:contain;object-position:left center;margin-left:28px;flex:0 0 auto;filter:drop-shadow(0 7px 14px rgba(0,0,0,.48));pointer-events:none}.detailBlurayBadge[hidden],.detailPrismBadge[hidden]{display:none!important}'
          new_css = '.detailBlurayBadge,.detailPrismBadge,.detailSilver55Badge{position:static;display:block;width:auto;height:64px;object-fit:contain;object-position:left center;margin-left:28px;flex:0 0 auto;filter:drop-shadow(0 7px 14px rgba(0,0,0,.48));pointer-events:none}.detailBlurayBadge[hidden],.detailPrismBadge[hidden],.detailSilver55Badge[hidden]{display:none!important}'
          if s.count(old_css) != 1:
              raise RuntimeError(f'Expected current detail badge CSS once, found {s.count(old_css)}')
          s = s.replace(old_css, new_css, 1)

          old_set = 'const BLURAY_IDS=new Set(["back-to-the-future-1985","back-to-the-future-ii-1989","back-to-the-future-iii-1990","alien-1979","bring-it-on-2000","dragonheart-1996","gojira-mainasu-wan-2023","guess-whos-coming-to-dinner-1967","indiana-jones-and-the-raiders-of-the-lost-ark-1981","indiana-jones-and-the-last-crusade-1989","jurassic-park-1993","master-and-commander-2003","signs-2002","spider-man-ii-2004","star-trek-first-contact-1996","star-trek-generations-1994","star-trek-insurrection-1998","star-trek-the-motion-picture-1979","star-trek-iii-the-search-for-spock-1984","star-trek-vi-the-undiscovered-country-1991","star-trek-iv-the-voyage-home-1986","the-abyss-1989"]);'
          new_set = old_set + 'const SILVER55_IDS=new Set(["a-biltmore-christmas-2023","an-hour-behind-2017","cant-buy-my-love-2017","christmas-with-holly-2012","snow-bride-2013","the-first-time-2012"]);'
          if s.count(old_set) != 1:
              raise RuntimeError(f'Expected Blu-ray ID set once, found {s.count(old_set)}')
          s = s.replace(old_set, new_set, 1)

          old_markup = '<img id="detailBlurayBadge" class="detailBlurayBadge" src="assets/format-logos/BLURAY.webp" alt="UHD Blu-ray" hidden><img id="detailPrismBadge" class="detailPrismBadge" src="assets/format-logos/PRiSM.webp" alt="PRiSM" hidden></div>'
          new_markup = '<img id="detailBlurayBadge" class="detailBlurayBadge" src="assets/format-logos/BLURAY.webp" alt="UHD Blu-ray" hidden><img id="detailPrismBadge" class="detailPrismBadge" src="assets/format-logos/PRiSM.webp" alt="PRiSM" hidden><img id="detailSilver55Badge" class="detailSilver55Badge" src="assets/format-logos/SiLVER55.webp" alt="SiLVER55" hidden></div>'
          if s.count(old_markup) != 1:
              raise RuntimeError(f'Expected current detail badge markup once, found {s.count(old_markup)}')
          s = s.replace(old_markup, new_markup, 1)

          old_logic = 'const bluray=$("detailBlurayBadge");if(bluray)bluray.hidden=!BLURAY_IDS.has(movie?.id);const prism=$("detailPrismBadge");if(prism)prism.hidden=movie?.id!=="the-man-from-earth-2007";requestAnimationFrame(fitDetailMeta);'
          new_logic = 'const bluray=$("detailBlurayBadge");if(bluray)bluray.hidden=!BLURAY_IDS.has(movie?.id);const prism=$("detailPrismBadge");if(prism)prism.hidden=movie?.id!=="the-man-from-earth-2007";const silver55=$("detailSilver55Badge");if(silver55)silver55.hidden=!SILVER55_IDS.has(movie?.id);requestAnimationFrame(fitDetailMeta);'
          if s.count(old_logic) != 1:
              raise RuntimeError(f'Expected current detail badge render logic once, found {s.count(old_logic)}')
          s = s.replace(old_logic, new_logic, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "SceneSense maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add SiLVER55 detail badges"
          git push origin HEAD:main
