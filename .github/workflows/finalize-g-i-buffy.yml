name: Finalize G-I TV and Buffy wording
on:
  push:
    paths:
      - '.github/workflows/finalize-g-i-buffy.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct dates wording and audit
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('.')

          # Gilmore Girls: the scan has no embedded dates for S3-S7, so fill dates
          # from the already-fetched TVMaze identity reference without changing
          # collection numbering, titles, runtimes or order.
          refs=json.loads((root/'tmp/tvmaze-g-i/gilmore-girls.json').read_text(encoding='utf-8'))
          by_num={(e.get('season'),e.get('number')):e for e in refs if e.get('season') and e.get('number')}
          gilmore_years=[]
          season_stats={}
          for s in range(1,8):
              cp=root/f'data/series/gilmore-girls/season-{s:02d}.json'
              mp=root/f'data/series/gilmore-girls/season-{s:02d}-meta.json'
              core=json.loads(cp.read_text(encoding='utf-8'))
              meta=json.loads(mp.read_text(encoding='utf-8'))
              years=[]
              for ep in core['episodes']:
                  n=int(ep['number'].split('-')[0])
                  if s>=3:
                      ref=by_num.get((s,n))
                      if not ref or not ref.get('airdate'):
                          raise AssertionError(f'missing Gilmore reference date S{s:02d}E{n:02d}')
                      ep['airDate']=ref['airdate']
                      meta['episodes'][ep['id']]['airDate']=ref['airdate']
                  if not ep.get('airDate'):
                      raise AssertionError(f'null Gilmore airDate {ep["id"]}')
                  years.append(int(ep['airDate'][:4]))
              core['yearStart']=min(years); core['yearEnd']=max(years)
              season_stats[s]=(min(years),max(years))
              gilmore_years.extend(years)
              cp.write_text(json.dumps(core,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
              mp.write_text(json.dumps(meta,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          # Firefly: Trash was one of the unaired Fox episodes and first aired
          # on Sci-Fi Channel on 2003-06-28. Keep curated numbering/order.
          fcp=root/'data/series/firefly/season-01.json'
          fmp=root/'data/series/firefly/season-01-meta.json'
          fcore=json.loads(fcp.read_text(encoding='utf-8'))
          fmeta=json.loads(fmp.read_text(encoding='utf-8'))
          for ep in fcore['episodes']:
              if ep['title']=='Trash': ep['airDate']='2003-06-28'
          fmeta['episodes']['s01e04']['airDate']='2003-06-28'
          fcore['yearStart']=2002; fcore['yearEnd']=2003
          fcp.write_text(json.dumps(fcore,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          fmp.write_text(json.dumps(fmeta,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          # Catalogue corrections in additions file.
          ip=root/'data/series/index-additions.json'
          idx=json.loads(ip.read_text(encoding='utf-8'))
          for item in idx['series']:
              if item['id']=='gilmore-girls-2000':
                  item['yearStart']=min(gilmore_years); item['yearEnd']=max(gilmore_years)
                  for se in item['seasons']:
                      ys,ye=season_stats[se['number']]
                      se['yearStart']=ys; se['yearEnd']=ye
              if item['id']=='firefly-2002':
                  item['yearStart']=2002; item['yearEnd']=2003
                  item['seasons'][0]['yearStart']=2002; item['seasons'][0]['yearEnd']=2003
          ip.write_text(json.dumps(idx,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          # Buffy: remove fandom shorthand from descriptions and use ordinary language.
          replacements={
              'data/series/buffy-the-vampire-slayer/season-03-meta.json':{
                  'while the Scoobies fight an unseen apocalypse':'while Buffy’s friends fight an unseen apocalypse'},
              'data/series/buffy-the-vampire-slayer/season-04-meta.json':{
                  'College pulls the Scoobies into separate lives':'College pulls Buffy and her friends into separate lives',
                  'With the Scoobies fractured and Riley captured':'With Buffy and her friends divided and Riley captured'},
              'data/series/buffy-the-vampire-slayer/season-05-meta.json':{
                  'hides demons from the Scoobies':'hides demons from Buffy and her friends',
                  'the Scoobies mistake Spike’s custom-made Buffy robot':'Buffy’s friends mistake Spike’s custom-made Buffy robot',
                  'forcing Buffy and the Scoobies into a final battle':'forcing Buffy and her friends into a final battle'},
              'data/series/buffy-the-vampire-slayer/season-07-meta.json':{
                  'the exhausted potentials and Scoobies reject her leadership':'the exhausted potential Slayers and Buffy’s friends reject her leadership'}
          }
          for rel,repls in replacements.items():
              p=root/rel
              txt=p.read_text(encoding='utf-8')
              for old,new in repls.items():
                  if old not in txt: raise AssertionError(f'expected Buffy wording not found: {old}')
                  txt=txt.replace(old,new)
              p.write_text(txt,encoding='utf-8')

          # Final assertions.
          for p in (root/'data/series/buffy-the-vampire-slayer').glob('*meta.json'):
              txt=p.read_text(encoding='utf-8')
              if re.search(r'\bScoob(?:y|ies|ies\b|y Gang)',txt,re.I):
                  raise AssertionError(f'fandom shorthand remains in {p}')
          assert min(gilmore_years)==2000 and max(gilmore_years)==2007
          assert all(json.loads((root/f'data/series/gilmore-girls/season-{s:02d}.json').read_text())['episodes'] for s in range(1,8))
          assert next(e for e in fcore['episodes'] if e['title']=='Trash')['airDate']=='2003-06-28'
          cat=json.loads(ip.read_text(encoding='utf-8'))
          gg=next(x for x in cat['series'] if x['id']=='gilmore-girls-2000')
          ff=next(x for x in cat['series'] if x['id']=='firefly-2002')
          assert (gg['yearStart'],gg['yearEnd'])==(2000,2007)
          assert (ff['yearStart'],ff['yearEnd'])==(2002,2003)
          assert gg['episodeCount']==153 and gg['scoringEntryCount']==153
          assert ff['episodeCount']==5 and ff['scoringEntryCount']==5 and ff['edition']=='SPECIAL EDITION'

          # Remove one-off integration scaffolding after its data has been validated.
          for rel in ['.github/workflows/integrate-g-i-series.yml','.github/workflows/fetch-tvmaze-g-i.yml','tmp/media-scan-g-i.txt']:
              p=root/rel
              if p.exists(): p.unlink()
          tvdir=root/'tmp/tvmaze-g-i'
          if tvdir.exists():
              for p in tvdir.glob('*'): p.unlink()
              tvdir.rmdir()
          print('Final G-I/Buffy audit passed.')
          PY
      - name: Remove this one-off workflow and commit
        run: |
          git rm .github/workflows/finalize-g-i-buffy.yml
          git config user.name soap2
          git config user.email 46655904+soap2@users.noreply.github.com
          git add -A
          git commit -m 'Finalize G-I TV data and clean Buffy wording'
          git push
