name: Normalize TV episode numbers
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize core season episode numbers
        run: python scripts/normalize-series-episode-numbers.py
      - name: Commit normalization if needed
        run: |
          if git diff --quiet -- data/series; then
            echo "No episode-number normalization required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series
          git commit -m "Normalize TV episode numbers to EXX"
          git push
