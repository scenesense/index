name: Align description sources
on:
  push:
    paths:
      - '.github/workflows/align-description-sources.yml'
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align source summaries to SceneSense order
        run: |
          python - <<'PY'
          import json,re,pathlib,html,difflib
          root=pathlib.Path('.')
          out=root/'tmp/description-sources'
          def clean(s):
              if s is None: return None
              s=re.sub(r'<ref[^>]*>.*?</ref>|<ref[^>]*/>','',s,flags=re.S)
              s=re.sub(r'\[\[([^\]|]+)\|([^\]]+)\]\]',r'\2',s)
              s=re.sub(r'\[\[([^\]]+)\]\]',r'\1',s)
              s=re.sub(r'<[^>]+>',' ',s)
              s=re.sub(r'\{\{[^{}]*\}\}',' ',s)
              s=html.unescape(s).replace("'''",'').replace("''",'')
              return re.sub(r'\s+',' ',s).strip()
          def norm(s):
              s=clean(s) or ''
              s=re.sub(r'\([^)]*part\s*(?:one|two|three|four|1|2|3|4)[^)]*\)','',s,flags=re.I)
              s=s.replace('&','and')
              return re.sub(r'[^a-z0-9]+','',s.lower())
          # He-Man Wikipedia production-order source -> title map.
          wt=(out/'he-man.wikitext').read_text(encoding='utf-8')
          hsrc=[]
          for block in re.findall(r'\{\{Episode list\s*(.*?)\n\}\}',wt,flags=re.S|re.I):
              tm=re.search(r'\|\s*Title\s*=\s*(.*?)(?:\n\||$)',block,flags=re.S|re.I)
              sm=re.search(r'\|\s*ShortSummary\s*=\s*(.*?)(?:\n\|\s*(?:LineColor|EpisodeNumber|DirectedBy|WrittenBy|OriginalAirDate|ProdCode)\s*=|$)',block,flags=re.S|re.I)
              if tm:
                  title=clean(tm.group(1))
                  summary=clean(sm.group(1)) if sm else None
                  hsrc.append({'title':title,'summary':summary})
          def align_titles(series_dir,src):
              results=[]
              for corep in sorted((root/series_dir).glob('season-[0-9][0-9].json')):
                  core=json.loads(corep.read_text(encoding='utf-8'))
                  for ep in core['episodes']:
                      n=norm(ep['title'])
                      candidates=[x for x in src if norm(x['title'])==n]
                      if candidates:
                          best=candidates[0]; score=1.0
                      else:
                          scored=[(difflib.SequenceMatcher(None,n,norm(x['title'])).ratio(),x) for x in src]
                          score,best=max(scored,key=lambda z:z[0]) if scored else (0,None)
                      results.append({'id':ep['id'],'season':core['season'],'number':ep['number'],'title':ep['title'],'sourceTitle':best['title'] if best else None,'matchScore':round(score,3),'summary':best.get('summary') if best else None})
              return results
          (out/'aligned-heman.json').write_text(json.dumps(align_titles('data/series/he-man-and-the-masters-of-the-universe',hsrc),ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          # Hercules TVMaze source -> title/date aware alignment.
          htv=json.loads((out/'hercules-tvmaze.json').read_text(encoding='utf-8'))
          htv=[{'title':x.get('name'),'summary':clean(x.get('summary')),'airdate':x.get('airdate'),'season':x.get('season'),'number':x.get('number')} for x in htv if x.get('name')]
          results=[]
          for corep in sorted((root/'data/series/hercules-the-legendary-journeys').glob('season-[0-9][0-9].json')):
              core=json.loads(corep.read_text(encoding='utf-8'))
              for ep in core['episodes']:
                  exact_date=[x for x in htv if x.get('airdate')==ep.get('airDate')]
                  pool=exact_date or htv
                  n=norm(ep['title'])
                  exact=[x for x in pool if norm(x['title'])==n]
                  if exact:
                      best=exact[0]; score=1.0
                  else:
                      scored=[(difflib.SequenceMatcher(None,n,norm(x['title'])).ratio(),x) for x in pool]
                      score,best=max(scored,key=lambda z:z[0]) if scored else (0,None)
                  results.append({'id':ep['id'],'season':core['season'],'number':ep['number'],'title':ep['title'],'airDate':ep.get('airDate'),'sourceTitle':best['title'] if best else None,'matchScore':round(score,3),'summary':best.get('summary') if best else None})
          (out/'aligned-hercules.json').write_text(json.dumps(results,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit aligned references
        run: |
          git config user.name soap2
          git config user.email 46655904+soap2@users.noreply.github.com
          git add tmp/description-sources/aligned-heman.json tmp/description-sources/aligned-hercules.json
          git commit -m 'Align He-Man and Hercules synopsis references'
          git push
