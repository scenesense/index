name: Audit completed SceneSense enrichment
on:
  push:
    paths:
      - '.github/workflows/audit-library-enrichment.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate all 86 enriched records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data=json.load(open('data/movies-additions-20260830.json',encoding='utf-8'))
          meta=json.load(open('data/enrichment-remaining-20260831.json',encoding='utf-8'))
          assert len(meta)==86, f'Expected 86 targets, got {len(meta)}'
          movies=data['movies']
          by={m['id']:m for m in movies}
          assert len(by)==len(movies), 'Duplicate movie IDs'
          problems=[]
          for mid in meta:
              m=by.get(mid)
              if not m:
                  problems.append(f'{mid}: missing record'); continue
              if not str(m.get('description') or '').strip(): problems.append(f'{mid}: blank description')
              if len(m.get('actors') or []) < 3: problems.append(f'{mid}: fewer than 3 actors')
              if not m.get('genres'): problems.append(f'{mid}: blank genres')
              p=str(m.get('poster') or '')
              if not p.startswith('assets/posters/'):
                  problems.append(f'{mid}: poster is not local: {p!r}')
              elif not Path(p).is_file():
                  problems.append(f'{mid}: local poster file missing: {p}')
              if not m.get('runtimeMinutes') or not m.get('runtimeSeconds') or not m.get('runtimeExact'):
                  problems.append(f'{mid}: runtime metadata incomplete')
              if not str(m.get('version') or '').strip(): problems.append(f'{mid}: blank version')
              if 'ratings' not in m: problems.append(f'{mid}: ratings field missing')
          if problems:
              raise SystemExit('AUDIT FAILED\n'+'\n'.join(problems))
          print(f'AUDIT PASSED: {len(meta)}/86 records have description, cast, genres, local poster, runtime, version and ratings fields.')
          PY
      - name: Remove temporary enrichment tooling
        if: success()
        run: |
          git config user.name "SceneSense Library Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm --ignore-unmatch \
            .github/workflows/audit-library-enrichment.yml \
            .github/workflows/enrich-remaining-library-20260831.yml \
            .github/workflows/test-tmdb-enrichment.yml \
            data/enrichment-remaining-20260831.json
          git commit -m "Remove completed library enrichment tooling"
          git push origin main
