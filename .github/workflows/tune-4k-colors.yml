name: Tune 4K metadata colors
on:
  push:
    paths: ['.github/workflows/tune-4k-colors.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Adjust 4K colors
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.format4k{color:#c0c0c0!important;font-variant-caps:normal!important;font-synthesis-small-caps:none!important;text-transform:none!important;font-weight:600!important}.format4kBlue{color:#79a9ff!important}'
          new='.format4k{color:#9aa4b0!important;font-variant-caps:normal!important;font-synthesis-small-caps:none!important;text-transform:none!important;font-weight:600!important}.format4kBlue{color:#5f8fdb!important}'
          assert old in s, 'expected 4K color rule not found'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          Path('.github/workflows/tune-4k-colors.yml').unlink()
          PY
          git config user.name 'SceneSense Library Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Tune 4K metadata colors'
          git push origin HEAD:main
