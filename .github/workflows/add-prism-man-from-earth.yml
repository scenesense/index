name: Add PRiSM detail badge

on:
  push:
    paths:
      - '.github/workflows/add-prism-man-from-earth.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add PRiSM logo to The Man from Earth detail score row
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.detailBlurayBadge{position:static;display:block;width:auto;height:64px;object-fit:contain;object-position:left center;margin-left:28px;flex:0 0 auto;filter:drop-shadow(0 7px 14px rgba(0,0,0,.48));pointer-events:none}.detailBlurayBadge[hidden]{display:none!important}'
          new_css = '.detailBlurayBadge,.detailPrismBadge{position:static;display:block;width:auto;height:64px;object-fit:contain;object-position:left center;margin-left:28px;flex:0 0 auto;filter:drop-shadow(0 7px 14px rgba(0,0,0,.48));pointer-events:none}.detailBlurayBadge[hidden],.detailPrismBadge[hidden]{display:none!important}'
          if s.count(old_css) != 1:
              raise RuntimeError(f'Expected detail badge CSS once, found {s.count(old_css)}')
          s = s.replace(old_css, new_css, 1)

          old_markup = '<img id="detailBlurayBadge" class="detailBlurayBadge" src="assets/format-logos/BLURAY.webp" alt="UHD Blu-ray" hidden></div>'
          new_markup = '<img id="detailBlurayBadge" class="detailBlurayBadge" src="assets/format-logos/BLURAY.webp" alt="UHD Blu-ray" hidden><img id="detailPrismBadge" class="detailPrismBadge" src="assets/format-logos/PRiSM.webp" alt="PRiSM" hidden></div>'
          if s.count(old_markup) != 1:
              raise RuntimeError(f'Expected Blu-ray detail markup once, found {s.count(old_markup)}')
          s = s.replace(old_markup, new_markup, 1)

          old_logic = 'const bluray=$("detailBlurayBadge");if(bluray)bluray.hidden=!BLURAY_IDS.has(movie?.id);requestAnimationFrame(fitDetailMeta);'
          new_logic = 'const bluray=$("detailBlurayBadge");if(bluray)bluray.hidden=!BLURAY_IDS.has(movie?.id);const prism=$("detailPrismBadge");if(prism)prism.hidden=movie?.id!=="the-man-from-earth-2007";requestAnimationFrame(fitDetailMeta);'
          if s.count(old_logic) != 1:
              raise RuntimeError(f'Expected Blu-ray render logic once, found {s.count(old_logic)}')
          s = s.replace(old_logic, new_logic, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "SceneSense maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add PRiSM detail badge to The Man from Earth"
          git push origin HEAD:main
