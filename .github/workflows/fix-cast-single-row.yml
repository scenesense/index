name: Fix cast single row

on:
  push:
    paths:
      - CAST_ROW_FIX_TRIGGER

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep principal cast to one row
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_css='.actorChips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;max-width:900px}.actorChip{display:inline-flex;align-items:center;min-height:32px;padding:6px 10px;'
          new_css='.actorChips{display:flex;flex-wrap:nowrap;gap:8px;margin:0 0 18px;max-width:900px;overflow:hidden}.actorChip{display:inline-flex;flex:0 0 auto;align-items:center;min-height:32px;padding:6px 10px;white-space:nowrap;'
          old_js='function renderPrincipalCast(movie){const holder=document.getElementById("actorChips");if(!holder)return;holder.innerHTML=(movie?.actors||[]).slice(0,5).map(name=>`<span class="actorChip">${escapeHtml(name)}</span>`).join("")}'
          new_js='function fitPrincipalCast(holder=document.getElementById("actorChips")){if(!holder)return;while(holder.children.length>1&&holder.scrollWidth>holder.clientWidth){holder.lastElementChild.remove()}}function renderPrincipalCast(movie){const holder=document.getElementById("actorChips");if(!holder)return;holder.innerHTML=(movie?.actors||[]).slice(0,5).map(name=>`<span class="actorChip">${escapeHtml(name)}</span>`).join("");requestAnimationFrame(()=>fitPrincipalCast(holder))}'
          old_resize='let genreResizeTimer=0;window.addEventListener("resize",()=>{clearTimeout(genreResizeTimer);genreResizeTimer=setTimeout(fitAllCardGenres,80)});'
          new_resize='let genreResizeTimer=0;window.addEventListener("resize",()=>{clearTimeout(genreResizeTimer);genreResizeTimer=setTimeout(()=>{fitAllCardGenres();if(activeMovieId)renderPrincipalCast(movieById(activeMovieId))},80)});document.fonts?.ready.then(()=>{if(activeMovieId)renderPrincipalCast(movieById(activeMovieId))});'
          for old,new,label in [(old_css,new_css,'CSS'),(old_js,new_js,'renderPrincipalCast'),(old_resize,new_resize,'resize handler')]:
              if old not in s:
                  raise SystemExit(f'Expected {label} snippet not found; refusing unsafe patch')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'SceneSense UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep principal cast on one row'
          git push
