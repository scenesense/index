name: Normalize Arn II title

on:
  push:
    paths:
      - FIX_ARN_TRIGGER

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize title
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/movies.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          m=next(x for x in d['movies'] if x['id']=='arn-ii-riket-vid-vagens-slut-2008')
          m['title']='Arn II: Riket Vid Vägens Slut'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "SceneSense Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/movies.json
          git commit -m "Normalize Arn II title casing"
          git push origin HEAD:main
