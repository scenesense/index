name: Validate SceneSense data conventions
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject forbidden visible punctuation
        run: python scripts/validate-visible-ampersands.py
      - name: Require zero-padded TV episode numbers
        run: python scripts/validate-series-episode-numbers.py
