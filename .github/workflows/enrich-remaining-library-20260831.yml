name: Enrich remaining SceneSense library
on:
  push:
    paths:
      - '.github/workflows/enrich-remaining-library-20260831.yml'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configure git
        run: |
          git config user.name "SceneSense Library Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Install enrichment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr >/dev/null
          python -m pip install --quiet requests beautifulsoup4 pillow pytesseract
      - name: Enrich all unfinished films in safe batches
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path
          from urllib.parse import quote, urljoin

          import pytesseract
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          ROOT = Path('.')
          DATA_PATH = ROOT / 'data/movies-additions-20260830.json'
          OVERRIDE_PATH = ROOT / 'data/enrichment-remaining-20260831.json'
          POSTER_DIR = ROOT / 'assets/posters'
          POSTER_DIR.mkdir(parents=True, exist_ok=True)

          with DATA_PATH.open(encoding='utf-8') as f:
              data = json.load(f)
          with OVERRIDE_PATH.open(encoding='utf-8') as f:
              overrides = json.load(f)

          assert len(overrides) == 86, f'Expected 86 enrichment targets, found {len(overrides)}'
          movies = data['movies']
          by_id = {m['id']: m for m in movies}
          missing_ids = [mid for mid in overrides if mid not in by_id]
          assert not missing_ids, f'Missing target records: {missing_ids}'
          assert len(by_id) == len(movies), 'Duplicate movie IDs exist before enrichment'

          locked = {
              mid: {
                  'runtimeMinutes': by_id[mid].get('runtimeMinutes'),
                  'runtimeSeconds': by_id[mid].get('runtimeSeconds'),
                  'runtimeExact': by_id[mid].get('runtimeExact'),
                  'version': by_id[mid].get('version'),
                  'ratings': json.loads(json.dumps(by_id[mid].get('ratings', {}))),
              }
              for mid in overrides
          }

          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 SceneSensePosterEnricher/1.0'})
          retry = Retry(total=4, connect=4, read=4, backoff_factor=0.7,
                        status_forcelist=(429, 500, 502, 503, 504),
                        allowed_methods=frozenset(['GET']))
          session.mount('https://', HTTPAdapter(max_retries=retry))
          BASE = 'https://www.themoviedb.org'
          STOP = {'the','and','of','a','an','to','in','for','from','with','at','on','by','is','it'}

          def get(url, timeout=40):
              r = session.get(url, timeout=timeout)
              r.raise_for_status()
              time.sleep(0.05)
              return r

          def parse_year(soup):
              for selector in ('span.release','span.release_date','span.tag.release_date','div.facts'):
                  el = soup.select_one(selector)
                  if el:
                      m = re.search(r'\b(19|20)\d{2}\b', el.get_text(' ', strip=True))
                      if m:
                          return int(m.group())
              t = soup.title.get_text(' ', strip=True) if soup.title else ''
              m = re.search(r'\b(19|20)\d{2}\b', t)
              return int(m.group()) if m else None

          def resolve_page(query, year, mode):
              search_url = f'{BASE}/search/{mode}?query={quote(query)}&language=en-US'
              soup = BeautifulSoup(get(search_url).text, 'html.parser')
              candidates = []
              pat = re.compile(rf'^/{mode}/(\d+)(?:-|\?|$)')
              for a in soup.select(f'a[href^="/{mode}/"]'):
                  href = a.get('href', '')
                  if not pat.match(href):
                      continue
                  if href not in candidates:
                      candidates.append(href)
              if not candidates:
                  raise RuntimeError(f'No TMDB {mode} search results for {query!r}')
              inspected = []
              for href in candidates[:12]:
                  page = BeautifulSoup(get(urljoin(BASE, href)).text, 'html.parser')
                  y = parse_year(page)
                  inspected.append((href, y))
                  if y == year:
                      tmdb_id = int(pat.match(href).group(1))
                      return href, page, tmdb_id
              raise RuntimeError(f'No exact-year TMDB match for {query!r} {year}; inspected {inspected}')

          def top_cast(soup):
              result = []
              for li in soup.select('ol.people.scroller li.card, ol.people li.card'):
                  a = li.select_one('p a')
                  if not a:
                      continue
                  name = a.get_text(' ', strip=True)
                  if name and name not in result:
                      result.append(name)
                  if len(result) >= 5:
                      break
              return result

          def primary_poster_path(soup):
              img = soup.select_one('div.poster img, img.poster')
              if not img:
                  return None
              candidates = [img.get('src',''), img.get('data-src',''), img.get('srcset',''), img.get('data-srcset','')]
              for raw in candidates:
                  for token in raw.split(','):
                      m = re.search(r'/([^/?,]+\.(?:jpg|png))(?:\s|\?|$)', token.strip())
                      if m:
                          return m.group(1)
              return None

          def gallery_paths(href):
              clean = href.split('?')[0].rstrip('/')
              url = f'{BASE}{clean}/images/posters?image_language=en&language=en-US'
              soup = BeautifulSoup(get(url).text, 'html.parser')
              paths = []
              for img in soup.find_all('img'):
                  raws = [img.get('src',''), img.get('data-src',''), img.get('srcset',''), img.get('data-srcset','')]
                  for raw in raws:
                      if 'media.themoviedb.org/t/p/' not in raw:
                          continue
                      for token in raw.split(','):
                          m = re.search(r'/([^/?,]+\.(?:jpg|png))(?:\s|\?|$)', token.strip())
                          if m and m.group(1) not in paths:
                              paths.append(m.group(1))
              return paths

          def norm_tokens(title):
              return [w for w in re.findall(r'[a-z0-9]+', title.lower()) if len(w) > 1 and w not in STOP]

          def ocr_words(image_bytes):
              im = Image.open(io.BytesIO(image_bytes)).convert('RGB')
              # OCR copy only. The final poster is never cropped or resized by us.
              if im.width > 700:
                  scale = 700 / im.width
                  im = im.resize((700, max(1, int(im.height * scale))))
              d = pytesseract.image_to_data(im, config='--psm 6', output_type=pytesseract.Output.DICT)
              words = []
              for text, conf in zip(d.get('text', []), d.get('conf', [])):
                  try:
                      c = float(conf)
                  except Exception:
                      c = -1
                  if c < 42:
                      continue
                  words.extend(re.findall(r'[a-z0-9]+', str(text).lower()))
              return words

          def poster_score(path, title, index):
              preview = get(f'https://image.tmdb.org/t/p/w500/{path}').content
              words = ocr_words(preview)
              tt = norm_tokens(title)
              unique = list(dict.fromkeys(tt))
              matches = 0
              for t in unique:
                  if any(w == t or (len(t) >= 5 and (t in w or w in t)) for w in words):
                      matches += 1
              required = 1 if len(unique) <= 1 else 2
              qual = matches >= required
              extras = []
              for w in words:
                  if len(w) <= 1 or w in STOP or w.isdigit():
                      continue
                  if any(w == t or (len(t) >= 5 and (t in w or w in t)) for t in unique):
                      continue
                  extras.append(w)
              # Prefer an English poster where the title is actually visible, then minimize extra text.
              score = (0 if qual else 10000) + len(extras) * 30 + len(words) + index * 0.2
              return score, matches, len(extras), len(words)

          def choose_poster(href, title, primary):
              paths = gallery_paths(href)
              if primary and primary not in paths:
                  paths.insert(0, primary)
              if not paths:
                  if primary:
                      return primary, None
                  raise RuntimeError(f'No poster candidates for {title}')
              scored = []
              for i, path in enumerate(paths[:10]):
                  try:
                      score, matches, extras, words = poster_score(path, title, i)
                      scored.append((score, path, matches, extras, words))
                  except Exception as exc:
                      print(f'  OCR candidate failed {path}: {exc}')
              if scored:
                  scored.sort()
                  winner = scored[0]
                  print(f'  poster {winner[1]} score={winner[0]:.1f} titleMatches={winner[2]} extras={winner[3]} words={winner[4]}')
                  return winner[1], winner
              if primary:
                  return primary, None
              raise RuntimeError(f'Could not score any poster candidate for {title}')

          def save_webp_from_tmdb(path, dest):
              # w780 preserves the full one-sheet composition while avoiding absurd multi-megabyte originals.
              raw = get(f'https://image.tmdb.org/t/p/w780/{path}').content
              im = Image.open(io.BytesIO(raw)).convert('RGB')
              im.save(dest, 'WEBP', quality=92, method=6)

          def save_webp_from_url(url, dest):
              raw = get(url).content
              im = Image.open(io.BytesIO(raw)).convert('RGB')
              im.save(dest, 'WEBP', quality=92, method=6)

          def enrich(mid):
              movie = by_id[mid]
              ov = overrides[mid]
              print(f'\n=== {movie["title"]} ({movie["year"]}) ===')
              movie['description'] = ov['description']
              movie['genres'] = ov['genres']
              dest = POSTER_DIR / f'{mid}.webp'

              if ov['mode'] == 'manual':
                  movie['actors'] = ov['actors'][:5]
                  save_webp_from_url(ov['posterUrl'], dest)
                  movie['poster'] = str(dest).replace('\\','/')
                  return

              href, soup, tmdb_id = resolve_page(ov['query'], movie['year'], ov['mode'])
              movie['tmdbId'] = tmdb_id
              cast = top_cast(soup)
              if len(cast) < 3:
                  raise RuntimeError(f'Insufficient principal cast for {movie["title"]}: {cast}')
              movie['actors'] = cast[:5]
              primary = primary_poster_path(soup)
              path, score = choose_poster(href, ov['query'], primary)
              save_webp_from_tmdb(path, dest)
              movie['poster'] = str(dest).replace('\\','/')

          target_ids = list(overrides)
          batch_size = 20
          batches = [target_ids[i:i+batch_size] for i in range(0, len(target_ids), batch_size)]

          for batch_no, batch in enumerate(batches, 1):
              print(f'\n######## ENRICHMENT BATCH {batch_no}/{len(batches)} ({len(batch)} films) ########')
              errors = []
              for mid in batch:
                  try:
                      enrich(mid)
                  except Exception as exc:
                      errors.append((mid, str(exc)))
                      print(f'ERROR {mid}: {exc}')
              if errors:
                  raise SystemExit('Batch failed; refusing partial commit: ' + repr(errors))

              # Locked fields are not enrichment fields. Verify before each commit.
              for mid in batch:
                  m = by_id[mid]
                  for key, expected in locked[mid].items():
                      if m.get(key) != expected:
                          raise AssertionError(f'{mid}: locked field {key} changed: {m.get(key)!r} != {expected!r}')

              with DATA_PATH.open('w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  f.write('\n')

              subprocess.run(['git','add',str(DATA_PATH),'assets/posters'], check=True)
              subprocess.run(['git','commit','-m',f'Enrich remaining library batch {batch_no}'], check=True)
              subprocess.run(['git','push','origin','main'], check=True)

          # Final validation across every requested film.
          with DATA_PATH.open(encoding='utf-8') as f:
              final = json.load(f)
          final_by_id = {m['id']: m for m in final['movies']}
          assert len(final_by_id) == len(final['movies']), 'Duplicate movie IDs after enrichment'
          problems = []
          for mid in target_ids:
              m = final_by_id.get(mid)
              if not m:
                  problems.append(f'{mid}: missing record')
                  continue
              if not m.get('description','').strip(): problems.append(f'{mid}: blank description')
              if len(m.get('actors') or []) < 3: problems.append(f'{mid}: missing cast')
              if not m.get('genres'): problems.append(f'{mid}: missing genres')
              p = m.get('poster','')
              if not p.startswith('assets/posters/') or not p.endswith('.webp'): problems.append(f'{mid}: non-local/non-WebP poster {p!r}')
              elif not Path(p).is_file(): problems.append(f'{mid}: poster file missing')
              for key, expected in locked[mid].items():
                  if m.get(key) != expected: problems.append(f'{mid}: locked {key} changed')
          if problems:
              raise SystemExit('FINAL VALIDATION FAILED:\n' + '\n'.join(problems))
          print(f'FINAL VALIDATION: {len(target_ids)}/86 descriptions, cast lists, ordered genres and local WebP posters present; runtimes/versions/ratings preserved.')
          PY
      - name: Remove temporary enrichment files
        if: success()
        run: |
          git rm .github/workflows/enrich-remaining-library-20260831.yml .github/workflows/test-tmdb-enrichment.yml data/enrichment-remaining-20260831.json
          git commit -m "Remove temporary library enrichment tooling"
          git push origin main
