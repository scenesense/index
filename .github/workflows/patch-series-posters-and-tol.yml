name: Patch series posters and Outer Limits metadata

on:
  push:
    paths:
      - '.github/workflows/patch-series-posters-and-tol.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch catalogue and Outer Limits metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, data):
              Path(path).write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          def insert_before(mapping, before_key, new_key, value):
              if new_key in mapping:
                  mapping[new_key] = value
                  return mapping
              out = {}
              inserted = False
              for k, v in mapping.items():
                  if k == before_key:
                      out[new_key] = value
                      inserted = True
                  out[k] = v
              if not inserted:
                  out[new_key] = value
              return out

          index_path = 'data/series/index.json'
          index = load(index_path)
          repaired = []
          for series in index['series']:
              sid = series.get('id')
              if sid == 'the-1-percent-club-2022':
                  series = insert_before(series, 'score', 'poster', 'assets/posters/the-one-percent-club-2022.webp')
              elif sid == 'the-orville-2017':
                  series = insert_before(series, 'score', 'poster', 'assets/posters/the-orville-2017.webp')
              elif sid == 'the-outer-limits-1995':
                  series.pop('collectionScope', None)
              repaired.append(series)
          index['series'] = repaired
          save(index_path, index)

          s1_path = 'data/series/the-outer-limits/season-01.json'
          s1 = load(s1_path)
          for episode in s1['episodes']:
              if episode.get('id') == 's01e01-02':
                  episode['title'] = 'Sandkings'
                  break
          save(s1_path, s1)

          s3_path = 'data/series/the-outer-limits/season-03-meta.json'
          s3 = load(s3_path)
          s3['description'] = 'Artificial companions, inherited consciousness, cloning, neural networks, genetic experimentation and alien captivity drive a season in which scientific breakthroughs repeatedly collide with memory, autonomy and the fragile boundaries of human identity.'
          save(s3_path, s3)

          s4_path = 'data/series/the-outer-limits/season-04-meta.json'
          s4 = load(s4_path)
          s4['description'] = 'Enhanced athletes, alien worlds, artificial bodies, engineered epidemics and first-contact crises force ordinary people to decide what remains human when survival depends on technology, mutation or cooperation with those they were taught to fear.'
          save(s4_path, s4)
          PY

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/series/index.json data/series/the-outer-limits/season-01.json data/series/the-outer-limits/season-03-meta.json data/series/the-outer-limits/season-04-meta.json
          git diff --cached --quiet && exit 0
          git commit -m 'Fix missing series posters and Outer Limits metadata'
          git push
