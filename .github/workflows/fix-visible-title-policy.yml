name: Fix visible title policy
on:
  push:
    paths:
      - '.github/workflows/fix-visible-title-policy.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply title corrections and harden guide
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          import json
          from pathlib import Path

          # Catalogue titles and card-only override.
          p=Path('data/series/index-additions.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          by_id={s['id']:s for s in data['series']}
          lidia=by_id['the-law-according-to-lidia-poet-2023']
          lois=by_id['lois-and-clark-1993']
          lidia['title']='La legge di Lidia Poët'
          lois['title']='Lois and Clark: The New Adventures of Superman'
          lois['cardTitle']='Lois and Clark'
          p.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          # Deliberately shortened local episode title.
          p=Path('data/series/lois-and-clark/season-01.json')
          season=json.loads(p.read_text(encoding='utf-8'))
          ep=next(e for e in season['episodes'] if e['id']=='s01e03')
          ep['title']='Strange Visitor'
          p.write_text(json.dumps(season,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          # Generic cardTitle support, so the short form is card-only rather than corrupting the canonical title.
          p=Path('series.js')
          js=p.read_text(encoding='utf-8')
          old='''      <div class="cardTitle">${escapeHtml(series.id==="he-man-and-the-masters-of-the-universe-1983"?"He-Man: The Masters of the Universe":series.title)}</div>'''
          new='''      <div class="cardTitle">${escapeHtml(series.cardTitle || (series.id==="he-man-and-the-masters-of-the-universe-1983"?"He-Man: The Masters of the Universe":series.title))}</div>'''
          if old not in js:
              raise SystemExit('series.js card-title anchor not found')
          js=js.replace(old,new,1)
          p.write_text(js,encoding='utf-8')

          # Harden the controlling TV guide.
          p=Path('TV_SERIES_INTEGRATION_GUIDE.md')
          guide=p.read_text(encoding='utf-8')
          guide=guide.replace('**Last updated:** 2026-09-04','**Last updated:** 2026-09-05',1)
          old='''## Canonical visible title

`title` is the canonical title used on the library card, search and ordinary UI surfaces.

If a long canonical title needs a shorter detail-page rendering, use:
'''
          new='''## Canonical visible title

`title` is the canonical series title used for search, detail views and ordinary UI surfaces. The library card uses `title` unless an explicit card-only shortening is stored in `cardTitle`.

### Original-language title preservation — hard rule

- **Never translate a series title merely because an external database, API, streaming service or English-language reference returns a localized English title.**
- Preserve the authoritative/original-language display title chosen for the collection, including diacritics and native wording.
- A translated title may replace the original-language title only when the user explicitly requests that translation.
- Internal IDs and folder names may remain stable/transliterated; they do not authorize changing the visible title.
- External databases are title-verification sources, not title-localization authority.

### Visible-title punctuation — hard rule

- **Ampersands are not allowed in visible series or episode titles. Always write `and`, never `&`.**
- Apply this to canonical titles, card titles, detail titles and episode titles.
- Do not re-import an ampersand from IMDb, TMDb, TVMaze, Wikipedia, broadcaster metadata or poster copy.

If only the library card needs a shorter title, use:

```json
"title": "Lois and Clark: The New Adventures of Superman",
"cardTitle": "Lois and Clark"
```

`cardTitle` is a library-card display override only. Search, detail views, descriptions and internal identity continue to use the canonical `title` unless another explicit field/rule says otherwise.

If a long canonical title needs a shorter detail-page rendering, use:
'''
          if old not in guide:
              raise SystemExit('guide canonical-title anchor not found')
          guide=guide.replace(old,new,1)
          p.write_text(guide,encoding='utf-8')

          # Guard exact requested state and ensure no accidental physical-data changes.
          data=json.loads(Path('data/series/index-additions.json').read_text(encoding='utf-8'))
          by_id={s['id']:s for s in data['series']}
          assert by_id['the-law-according-to-lidia-poet-2023']['title']=='La legge di Lidia Poët'
          assert by_id['lois-and-clark-1993']['title']=='Lois and Clark: The New Adventures of Superman'
          assert by_id['lois-and-clark-1993']['cardTitle']=='Lois and Clark'
          season=json.loads(Path('data/series/lois-and-clark/season-01.json').read_text(encoding='utf-8'))
          ep=next(e for e in season['episodes'] if e['id']=='s01e03')
          assert ep['title']=='Strange Visitor'
          assert ep['runtimeSeconds']==2740 and ep['number']=='03' and ep['airDate']=='1993-09-26'
          assert 'Original-language title preservation — hard rule' in guide
          assert 'Always write `and`, never `&`' in guide
          print('TITLE POLICY AUDIT PASSED')
          PY

          rm -f .github/workflows/fix-visible-title-policy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          echo 'Changed paths:'
          git diff --cached --name-only
          if git diff --cached --name-only | grep -Ev '^(data/series/index-additions\.json|data/series/lois-and-clark/season-01\.json|series\.js|TV_SERIES_INTEGRATION_GUIDE\.md|\.github/workflows/fix-visible-title-policy\.yml)$'; then
            echo 'Unexpected file changed' >&2
            exit 1
          fi
          git commit -m 'Restore original titles and harden title rules'
          git push origin main
