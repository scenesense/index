name: Fix visible title policy
on:
  push:
    paths:
      - '.github/workflows/fix-visible-title-policy.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply corrections
        run: |
          set -e
          git pull --ff-only origin main
          python .tmp-fix-visible-title-policy.py
          rm .tmp-fix-visible-title-policy.py
          rm .github/workflows/fix-visible-title-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-only
          git commit -m "Restore original titles and harden title rules"
          git push origin main
