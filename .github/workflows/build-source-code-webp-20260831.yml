name: Build Source Code poster WebP
on:
  push:
    paths:
      - '.github/workflows/build-source-code-webp-20260831.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download supplied Source Code poster
        run: |
          python3 - <<'PY'
          import urllib.request
          url='https://www.cinematerial.com/p/500x/sqxwn22u/source-code-dvd-movie-cover.jpg?v=1456719492'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.cinematerial.com/'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=r.read()
          open('source-code-2011.jpg','wb').write(data)
          print('downloaded',len(data),'bytes')
          PY
      - name: Convert without resizing
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('source-code-2011.jpg')
          print('source dimensions',im.size)
          im.save('source-code-2011.webp','WEBP',quality=95,method=6)
          out=Image.open('source-code-2011.webp')
          print('webp dimensions',out.size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-code-2011-webp
          path: source-code-2011.webp
