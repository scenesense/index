name: Temporary series catalogue append
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  append:
    if: github.event.head_commit.message == 'Activate temporary series catalogue append on main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append catalogue records
        run: python scripts/__tmp-append-series-index.py
      - name: Validate visible punctuation
        run: python scripts/validate-visible-ampersands.py
      - name: Validate episode numbering
        run: python scripts/validate-series-episode-numbers.py
      - name: Commit catalogue
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/series/index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Register The 1% Club and The Orville"
          git push origin HEAD:${GITHUB_REF_NAME}
