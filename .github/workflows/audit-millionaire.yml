name: Audit Jeremy Clarkson Millionaire
on:
  push:
    paths:
      - '.github/workflows/audit-millionaire.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit committed state and clean up
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python .tmp-audit-millionaire.py
          rm .tmp-audit-millionaire.py .github/workflows/audit-millionaire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          changed=$(git diff --cached --name-only)
          echo "$changed"
          bad=$(printf '%s\n' "$changed" | grep -Ev '^(\.tmp-audit-millionaire\.py|\.github/workflows/audit-millionaire\.yml)$' || true)
          if [ -n "$bad" ]; then
            echo "Audit cleanup touched unexpected paths:" >&2
            echo "$bad" >&2
            exit 1
          fi
          git commit -m "Remove Millionaire audit helpers"
          git push origin main
