name: Normalize 1 Percent Club episode numbering

on:
  push:
    paths:
      - '.github/workflows/normalize-one-percent-numbering.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Renumber seasons 3 and 4 without episode zero
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('data/series/the-1-percent-club')

          for season_no in (3, 4):
              season_path = root / f'season-{season_no:02d}.json'
              meta_path = root / f'season-{season_no:02d}-meta.json'

              season = json.loads(season_path.read_text(encoding='utf-8'))
              meta = json.loads(meta_path.read_text(encoding='utf-8'))

              episodes = season.get('episodes', [])
              old_to_new = {}
              for index, episode in enumerate(episodes, start=1):
                  old_id = episode['id']
                  new_id = f's{season_no:02d}e{index:02d}'
                  old_to_new[old_id] = new_id
                  episode['id'] = new_id
                  episode['number'] = f'{index:02d}'

              old_meta = meta.get('episodes', {})
              new_meta = {}
              for old_id, payload in old_meta.items():
                  if old_id not in old_to_new:
                      raise SystemExit(f'Metadata key {old_id} missing from Season {season_no} episode rows')
                  new_meta[old_to_new[old_id]] = payload
              if len(new_meta) != len(episodes):
                  raise SystemExit(f'Season {season_no} metadata/episode count mismatch')
              meta['episodes'] = new_meta

              season_path.write_text(json.dumps(season, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
              meta_path.write_text(json.dumps(meta, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          for season_no, expected in ((3, 17), (4, 18)):
              season = json.loads((root / f'season-{season_no:02d}.json').read_text(encoding='utf-8'))
              ids = [ep['id'] for ep in season['episodes']]
              nums = [ep['number'] for ep in season['episodes']]
              expected_ids = [f's{season_no:02d}e{i:02d}' for i in range(1, expected + 1)]
              expected_nums = [f'{i:02d}' for i in range(1, expected + 1)]
              if ids != expected_ids or nums != expected_nums:
                  raise SystemExit(f'Season {season_no} numbering verification failed')
              meta = json.loads((root / f'season-{season_no:02d}-meta.json').read_text(encoding='utf-8'))
              if list(meta.get('episodes', {}).keys()) != expected_ids:
                  raise SystemExit(f'Season {season_no} metadata numbering verification failed')
          PY

      - name: Commit normalized numbering
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/series/the-1-percent-club/season-03.json data/series/the-1-percent-club/season-03-meta.json data/series/the-1-percent-club/season-04.json data/series/the-1-percent-club/season-04-meta.json
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize The 1% Club episode numbering'
          git push
