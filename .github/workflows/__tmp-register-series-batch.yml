name: Temporary register series batch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  register:
    if: github.event.head_commit.message == 'Activate series batch catalogue registration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register catalogue entries
        run: python scripts/__tmp-register-series-batch.py
      - name: Validate visible punctuation
        run: python scripts/validate-visible-ampersands.py
      - name: Validate episode numbering
        run: python scripts/validate-series-episode-numbers.py
      - name: Commit catalogue
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/series/index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Register Grand Tour, Outpost and Outer Limits"
          git push origin HEAD:${GITHUB_REF_NAME}
