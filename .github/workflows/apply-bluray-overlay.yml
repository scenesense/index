name: Apply Blu-ray thumbnail overlay

on:
  push:
    paths:
      - '.github/workflows/apply-bluray-overlay.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Blu-ray thumbnail rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_logic = '''const BLUE_4K_IDS=new Set(["back-to-the-future-1985","back-to-the-future-ii-1989","back-to-the-future-iii-1990","alien-1979","bring-it-on-2000","dragonheart-1996","gojira-mainasu-wan-2023","guess-whos-coming-to-dinner-1967","indiana-jones-and-the-raiders-of-the-lost-ark-1981","indiana-jones-and-the-last-crusade-1989","jurassic-park-1993"]);function fourKMarkup(movie){return `<span class="format4k${BLUE_4K_IDS.has(movie?.id)?" format4kBlue":""}">4K</span>`}function cardMetaMarkup(movie){return `${movie.year} · ${movie.runtimeMinutes} min · ${escapeHtml(movie.version)} · ${fourKMarkup(movie)}`}function detailMetaMarkup(movie){return `${movie.year} · ${escapeHtml(runtimeText(movie))} · ${escapeHtml(movie.version)} · ${fourKMarkup(movie)}`}'''

          new_logic = '''const BLUE_4K_IDS=new Set(["back-to-the-future-1985","back-to-the-future-ii-1989","back-to-the-future-iii-1990","alien-1979","bring-it-on-2000","dragonheart-1996","gojira-mainasu-wan-2023","guess-whos-coming-to-dinner-1967","indiana-jones-and-the-raiders-of-the-lost-ark-1981","indiana-jones-and-the-last-crusade-1989","jurassic-park-1993","master-and-commander-2003","signs-2002","spider-man-ii-2004","star-trek-first-contact-1996","star-trek-generations-1994","star-trek-insurrection-1998","star-trek-the-motion-picture-1979","star-trek-iii-the-search-for-spock-1984","star-trek-vi-the-undiscovered-country-1991","star-trek-iv-the-voyage-home-1986","the-abyss-1989"]);const BLURAY_IDS=BLUE_4K_IDS;function fourKMarkup(movie){return `<span class="format4k${BLUE_4K_IDS.has(movie?.id)?" format4kBlue":""}">4K</span>`}function cardMetaMarkup(movie){const base=`${movie.year} · ${movie.runtimeMinutes} min · ${escapeHtml(movie.version)}`;return BLURAY_IDS.has(movie?.id)?base:`${base} · ${fourKMarkup(movie)}`}function detailMetaMarkup(movie){return `${movie.year} · ${escapeHtml(runtimeText(movie))} · ${escapeHtml(movie.version)} · ${fourKMarkup(movie)}`}'''

          if text.count(old_logic) != 1:
              raise RuntimeError(f'Expected existing 4K logic once, found {text.count(old_logic)}')
          text = text.replace(old_logic, new_logic, 1)

          old_css = '.format4kBlue{color:#426aa8!important}.cardGenres'
          new_css = '.format4kBlue{color:#426aa8!important}.blurayBadge{position:absolute;left:10px;bottom:10px;z-index:2;display:block;width:96px;height:50px;object-fit:contain;object-position:left center;filter:drop-shadow(0 8px 15px rgba(0,0,0,.55));pointer-events:none}.cardGenres'
          if text.count(old_css) != 1:
              raise RuntimeError(f'Expected format CSS anchor once, found {text.count(old_css)}')
          text = text.replace(old_css, new_css, 1)

          anchor = 'function decorateLibraryCards(){'
          helper = 'function applyBlurayBadge(card,movie){const wrap=card.querySelector(".posterWrap");if(!wrap)return;let badge=wrap.querySelector(".blurayBadge");if(BLURAY_IDS.has(movie?.id)){if(!badge){badge=document.createElement("img");badge.className="blurayBadge";badge.src="assets/format-logos/BLURAY.webp";badge.alt="UHD Blu-ray";badge.loading="lazy";wrap.append(badge)}}else badge?.remove()}function decorateLibraryCards(){'
          if text.count(anchor) != 1:
              raise RuntimeError(f'Expected decorateLibraryCards anchor once, found {text.count(anchor)}')
          text = text.replace(anchor, helper, 1)

          old_meta = 'meta.innerHTML=cardMetaMarkup(movie);'
          new_meta = 'applyBlurayBadge(card,movie);meta.innerHTML=cardMetaMarkup(movie);'
          if text.count(old_meta) != 1:
              raise RuntimeError(f'Expected card meta assignment once, found {text.count(old_meta)}')
          text = text.replace(old_meta, new_meta, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "SceneSense maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Use Blu-ray poster badges on UHD Blu-ray films"
          git push origin HEAD:main
