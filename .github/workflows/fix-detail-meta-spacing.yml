name: Fix detail metadata spacing
on:
  push:
    paths:
      - '.github/workflows/fix-detail-meta-spacing.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix metadata clipping and spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = '.movieSummary .eyebrow{margin-top:12px;margin-bottom:8px;color:#aab4c2!important}'
          new1 = '.movieSummary .eyebrow{margin-top:12px;margin-bottom:3px;color:#aab4c2!important}'
          old2 = '.cardMeta,.movieSummary .eyebrow{white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important}'
          new2 = '.cardMeta{white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important}.movieSummary .eyebrow{white-space:nowrap!important;overflow:visible!important;text-overflow:clip!important}'
          if old1 not in s:
              raise SystemExit('metadata spacing rule not found')
          if old2 not in s:
              raise SystemExit('metadata clipping rule not found')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "SceneSense CSS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix detail metadata clipping and spacing"
          git push
      - name: Remove temporary workflow
        run: |
          git pull --rebase
          rm .github/workflows/fix-detail-meta-spacing.yml
          git add .github/workflows/fix-detail-meta-spacing.yml
          git commit -m "Remove metadata spacing workflow"
          git push
