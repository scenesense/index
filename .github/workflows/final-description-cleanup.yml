name: Final six-series description cleanup
on:
  push:
    paths:
      - '.github/workflows/final-description-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace all residual teaser and generic copy
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          import json, re, glob, collections

          replacements = {
            ('the-law-according-to-lidia-poet',1,'s01e04'): "Chemist Margherita Sangiacomo faces execution for murdering Professor Braschi, and Lidia initially works to prove her innocent. The evidence instead shows that Margherita killed him in revenge for medical experiments on poor women and prostitutes, including her mother, forcing Lidia to choose truth over an easy acquittal.",
            ('the-law-according-to-lidia-poet',1,'s01e06'): "Jacopo is arrested for the murder of Maya Cristallo, whose real identity links her to French anarchists Nicole and Louis. Lidia discovers that Maya had betrayed them while working as a government spy, confronts the fugitives on a train and clears Jacopo, only to learn that the Court of Cassation has rejected her own appeal against disbarment.",
            ('the-law-according-to-lidia-poet',2,'s02e04'): "Andrea Caracciolo returns from America to marry Letizia, but a man is killed during the wedding celebrations and Letizia becomes the principal suspect. Lidia discovers that the victim was connected to an usurer and had a child with Letizia; Andrea takes responsibility for the killing and flees to Switzerland, while Enrico commits to entering Parliament.",
            ('the-law-according-to-lidia-poet',3,'s03e04'): "Doctor Tulio Munnari is due to testify about Grazia's injuries when he is arrested for murdering his sister Eloisa. Lidia and Enrico trace Eloisa's stalking complaint to Bottini and discover that Tulio's wife ordered the killing; Tulio is freed, but Fourneau damages his value as a witness by exposing his affair with Grazia.",
            ('eva-lasting',1,'s01e13'): "The arrest of Eva's father exposes the family history she has been hiding and leaves her facing removal to the United States. Camilo helps her run away and hide, but the police eventually find her and she is deported before they can say goodbye; as Camilo plans to follow her, Luisa calls to tell him she may be pregnant.",
            ('last-resort',1,'s01e03'): "Prosser is released from the brig to help locate three missing Colorado sailors, only for Chaplin to learn that Serrat has kidnapped them. Serrat demands that the submarine retrieve cargo from outside the naval perimeter; the Colorado completes the mission but returns late, and Serrat kills one hostage. In Washington, Kylie and Admiral Shepard trace the original launch order while the Perseus stealth-system plans disappear from Kylie's apartment.",
            ('last-resort',1,'s01e04'): "With morale collapsing and treason charges announced against him and Sam, Chaplin lets the crew choose whether to remain with the Colorado. The Defense Department secretly sends individual sailors orders authorizing action against their captain, culminating in Brennan threatening the bridge with a grenade and attempting to force the submarine toward surrender. In the United States, Christine faces official pressure and public harassment while Sam's old friend Paul Wells offers support.",
            ('last-resort',1,'s01e07'): "Chaplin investigates the BZ attack and the theft of one of his nuclear launch keys, increasing suspicion throughout the crew. Prosser's confrontation with Serrat escalates over Serrat's role in the attack and the drug trade among the sailors, while a surviving SEAL tells Sam that a faction in Washington wants Chaplin removed in exchange for amnesty. Christine and Kylie continue building a public case against the government's version of events.",
            ('last-resort',1,'s01e08'): "A Thanksgiving feast meant to ease tensions between the Colorado crew and Sainte Marina collapses when islander Erita accuses Chief Anders of rape. Grace Shepard defends Anders at a joint island-Navy trial, then realizes Serrat manipulated the jury to provoke unrest; Anders ultimately admits the assault, and Chaplin discharges him and orders him held for prosecution.",
            ('last-resort',1,'s01e09'): "A transport carrying forty relatives of the Colorado crew, including Christine Kendal, is seized by Pakistani commandos who demand that Chaplin fire a nuclear missile at Indian forces entering Pakistan. At the same time, the original SEAL mission is exposed: Hopper had been ordered by the Secretary of Defense to plant false evidence of Pakistani suitcase nuclear weapons, tying the fabricated intelligence directly to the crisis that triggered the Colorado's launch order.",
            ('last-resort',1,'s01e11'): "A U.S. Navy destroyer moves to intercept the Chinese supply ship headed for Sainte Marina, forcing Chaplin to defend the aid route and risk a direct confrontation. In Washington, Kylie takes evidence of the President's Pakistan deception to the Speaker as Admiral Shepard helps organize a coup, while Cortez admits she has been secretly paid by the CIA and refuses an order to kill Chaplin. Serrat separately bargains with China over the island's rare-earth deposits.",
            ('last-resort',1,'s01e13'): "Prosser's mutiny is hijacked by men planning to hand the Colorado to China, leaving Chaplin, Sam, Grace and Prosser fighting to regain control of the submarine. Chaplin retakes the conn and ultimately destroys the Colorado rather than allow it to become another government's weapon, sacrificing himself in the process. In Washington, Kylie releases evidence of the President's conspiracy after arranging Christine's return and then shoots the President.",
            ('legend-of-the-seeker',2,'s02e08'): "Denna steals the compass needed to locate the Stone of Tears and escapes with Zedd as her prisoner. While pursuing them, Richard is crippled by headaches caused by his emerging wizard powers; the Sisters of the Light tell him that survival requires training at the Palace of the Prophets, forcing him to leave the search for Zedd to Kahlan and Cara.",
            ('legend-of-the-seeker',2,'s02e09'): "At the Palace of the Prophets, Richard trains with the Sisters of the Light and learns from Sister Nicci that their intentions toward him are not what they appear. With Richard unavailable, Zedd accepts that another Seeker must carry the Sword of Truth and joins Kahlan and Cara in finding his replacement, while Richard forms an uneasy alliance with Nicci inside the Palace.",
            ('legend-of-the-seeker',2,'s02e14'): "After failing to kill Kahlan, Sister Nicci is hunted by both the Sisters of the Dark and Darken Rahl. She casts a spell binding her life directly to Kahlan's, making any attack on Nicci fatal to the Mother Confessor and forcing Richard to protect his enemy while leading her toward the Stone of Tears. Kahlan seeks help from her estranged father to break the bond.",
            ('legend-of-the-seeker',2,'s02e15'): "A powerful woman claiming to be the Creator accuses Richard of serving the Keeper and places the Seeker on trial. Kahlan, Cara and Zedd investigate the claimant's identity to expose the deception and save Richard, while Darken Rahl treats her appearance as a threat of his own and prepares to eliminate her.",
            ('legend-of-the-seeker',2,'s02e22'): "Richard reaches the Pillars of Creation with the Stone of Tears and attempts to seal the rifts allowing the Keeper's influence into the world. Separated from his companions, he is forced into a final confrontation over the Stone while Sister Nicci takes control of Kahlan and sends the Mother Confessor against the people trying to stop the Keeper.",
            ('lois-and-clark',1,'s01e07'): "Lois goes undercover as a nightclub singer to investigate a string of arsons connected to a protection racket, attracting attention from the club's owner in the process. Clark works the same case from inside the club, while Superman tracks the arsonists before their campaign destroys more businesses.",
            ('lois-and-clark',1,'s01e10'): "A freak winter heat wave is blamed on Superman, and public pressure leads authorities to jail him as an environmental threat. With Superman confined, Lois and Clark investigate the real source of the temperature crisis and work to clear his name before the city is left without its protector.",
            ('lois-and-clark',4,'s04e08'): "Lois and Clark befriend another married couple, Bob and Carol, hoping to build a normal social life outside the Daily Planet. Bob's concealed identity and unusual powers expose a conflict that pulls both couples into a super-powered confrontation and ruins the ordinary friendship Lois and Clark were trying to establish.",
            ('lois-and-clark',4,'s04e22'): "Lois and Clark reveal Superman's identity to Sam Lane while seeking an answer to whether they can have children, only to learn that Clark may be unable to father one with Lois. A telekinetic criminal then kidnaps their parents, and after the family is rescued an unexplained baby is left in Clark's old bassinet at the couple's home.",
          }

          paths={}
          for folder,season,eid in replacements:
            path=f'data/series/{folder}/season-{season:02d}-meta.json'
            paths.setdefault(path,[]).append((folder,season,eid))
          for path,keys in paths.items():
            with open(path,encoding='utf-8') as f: meta=json.load(f)
            for key in keys:
              eid=key[2]
              if eid not in meta.get('episodes',{}): raise SystemExit(f'Missing {key}')
              meta['episodes'][eid]['description']=replacements[key]
            with open(path,'w',encoding='utf-8',newline='\n') as f:
              json.dump(meta,f,ensure_ascii=False,separators=(',',':')); f.write('\n')

          dirs=['kevin-from-work','the-law-according-to-lidia-poet','eva-lasting','last-resort','legend-of-the-seeker','lois-and-clark']
          generic=re.compile(r'\b(this collection|collection-local|preserv(?:e|ing) .*order|runs from .*through|this .* episode|episode-specific|develops that conflict|surrounding story|the characters confront|source runtimes?|retained file|curated|scoring row)\b',re.I)
          deep_patterns={
            'question': re.compile(r'\?'),
            'marketing': re.compile(r'\b(exciting|unforgettable|shocking|jaw-dropping|must-see|game-changing|life-changing)\b',re.I),
            'teaser': re.compile(r'\b(will .*\?|what happens|what will|can .*\?|how far will|before it(?:’|\')s too late|the unthinkable|things (?:go|turn)|turn(?:s|ed)? (?:bad|deadly|dangerous)|greater threat|ominous demand|true reason .* revealed|mysterious (?:events|visit)|dangerous situation|unexpected turn|new reality|secrets? (?:are|is) revealed)\b',re.I),
            'meta': re.compile(r'\b(season finale|episode|this season|series finale|viewers?|audience)\b',re.I),
            'vague_open': re.compile(r'^(A visit|An unexpected|Things|Something|Trouble|A situation)\b',re.I),
          }
          episode_total=0; season_total=0; descs=[]; flags=[]; shorts=[]
          for d in dirs:
            for path in sorted(glob.glob(f'data/series/{d}/season-*-meta.json')):
              season_total+=1
              meta=json.load(open(path,encoding='utf-8'))
              sd=str(meta.get('description','')).strip()
              if generic.search(sd) or len(sd)<180: flags.append(('season',path,sd))
              for eid,m in meta.get('episodes',{}).items():
                episode_total+=1; desc=str(m.get('description','')).strip(); descs.append(desc)
                hits=[n for n,rx in deep_patterns.items() if rx.search(desc)]
                if generic.search(desc): hits.append('generic')
                if hits: flags.append(('episode',path,eid,hits,desc))
                if len(desc)<90: shorts.append((path,eid,len(desc),desc))
          if season_total!=15 or episode_total!=216: raise SystemExit(f'count mismatch seasons={season_total} episodes={episode_total}')
          if len(descs)!=len(set(descs)):
            c=collections.Counter(descs); raise SystemExit('duplicates '+repr([(d,n) for d,n in c.items() if n>1]))
          if flags: raise SystemExit('description flags survived '+repr(flags))
          if shorts: raise SystemExit('short descriptions survived '+repr(shorts))
          print('STRICT DESCRIPTION AUDIT PASSED: 15 seasons / 216 episodes / 0 generic flags / 0 teaser flags / 0 marketing flags / 0 questions / 0 duplicates / 0 short stubs')
          PY
          rm -f .github/workflows/deep-audit-six-series-descriptions.yml
          rm -f .github/workflows/final-description-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only
          git commit -m 'Finish semantic cleanup of six-series descriptions'
          git push origin main
