name: Run poster asset fix

on:
  push:
    paths:
      - '.github/workflows/fix-poster-runner-20260831.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "SceneSense Poster Fix"
          git config user.email "actions@users.noreply.github.com"

      - name: Fix poster assets and data paths
        run: |
          set -euo pipefail
          mkdir -p assets/posters

          cp assets/posters/in-a-world-2013.jpg assets/posters/in-a-world-2013-user-v3.jpg
          cp assets/posters/in-time-2011.jpg assets/posters/in-time-2011-user-v3.jpg

          grep '^UklG' .github/workflows/fix-poster-assets-20260831.yml > /tmp/moon.b64
          base64 -d /tmp/moon.b64 > assets/posters/moon-2009-user-v3.webp

          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'assets/posters/in-a-world-2013-user-v3.jpg': 'jpg',
              'assets/posters/in-time-2011-user-v3.jpg': 'jpg',
              'assets/posters/moon-2009-user-v3.webp': 'webp',
          }
          for path, kind in checks.items():
              data = Path(path).read_bytes()
              if len(data) < 7000:
                  raise SystemExit(f'{path} too small: {len(data)}')
              if kind == 'jpg' and not data.startswith(b'\xff\xd8\xff'):
                  raise SystemExit(f'{path} is not JPEG')
              if kind == 'webp' and not (data.startswith(b'RIFF') and data[8:12] == b'WEBP'):
                  raise SystemExit(f'{path} is not WEBP')
              print(path, len(data), kind)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import json
          path = Path('data/movies-additions-20260830.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          updates = {
              'in-a-world-2013': 'assets/posters/in-a-world-2013-user-v3.jpg',
              'in-time-2011': 'assets/posters/in-time-2011-user-v3.jpg',
              'moon-2009': 'assets/posters/moon-2009-user-v3.webp',
          }
          seen = set()
          for movie in payload.get('movies', []):
              mid = movie.get('id')
              if mid in updates:
                  movie['poster'] = updates[mid]
                  seen.add(mid)
          missing = set(updates) - seen
          if missing:
              raise SystemExit(f'Missing movie ids: {sorted(missing)}')
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git add data/movies-additions-20260830.json assets/posters/in-a-world-2013-user-v3.jpg assets/posters/in-time-2011-user-v3.jpg assets/posters/moon-2009-user-v3.webp
          git commit -m 'Fix supplied poster assets'
          git push origin main

      - name: Remove temporary workflows
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm .github/workflows/fix-poster-assets-20260831.yml .github/workflows/fix-poster-runner-20260831.yml
          git commit -m 'Remove poster fix workflows'
          git push origin main
