name: Enrich SceneSense library batch 01
on:
  push:
    paths:
      - '.github/workflows/enrich-library-batch-01.yml'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configure git
        run: |
          git config user.name "SceneSense Library Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Install tools
        run: python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Enrich exactly 20 records
        run: |
          python - <<'PY'
          import io
          import json
          import re
          import subprocess
          import time
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          DATA = Path('data/movies-additions-20260830.json')
          META = Path('data/enrichment-remaining-20260831.json')
          POSTERS = Path('assets/posters')
          POSTERS.mkdir(parents=True, exist_ok=True)

          TARGETS = [
              'master-and-commander-2003',
              'me-before-you-2016',
              'minuscule-2013',
              'miracle-2004',
              'monsoon-2018',
              'moon-2009',
              'much-ado-about-christmas-2021',
              'national-treasure-2004',
              'next-stop-christmas-2021',
              'nick-and-norahs-infinite-playlist-2008',
              'oblivion-2013',
              'peter-pan-2003',
              'pirates-of-the-caribbean-2003',
              'premonition-2007',
              'ratatouille-2007',
              'remember-sunday-2013',
              'robot-and-frank-2012',
              'say-anything-1989',
              'scoop-2006',
              'secondhand-lions-2003',
          ]
          assert len(TARGETS) == 20

          TMDB_IDS = {
              'master-and-commander-2003': 8619,
              'me-before-you-2016': 296096,
              'minuscule-2013': 140870,
              'miracle-2004': 14292,
              'moon-2009': 17431,
              'much-ado-about-christmas-2021': 878410,
              'national-treasure-2004': 2059,
              'next-stop-christmas-2021': 877004,
              'nick-and-norahs-infinite-playlist-2008': 12182,
              'oblivion-2013': 75612,
              'peter-pan-2003': 10601,
              'pirates-of-the-caribbean-2003': 22,
              'premonition-2007': 9963,
              'ratatouille-2007': 2062,
              'remember-sunday-2013': 188538,
              'robot-and-frank-2012': 84329,
              'say-anything-1989': 2028,
              'scoop-2006': 512,
              'secondhand-lions-2003': 13156,
          }

          MANUAL = {
              'minuscule-2013': {
                  'actors': ['Diego Hancy', 'Peter Lee', 'Helsa Baneria', 'Nerietta Sophia Buller', 'Craig Ferdivo'],
                  'posterUrl': 'https://m.media-amazon.com/images/M/MV5BMTQyNDk1NzEwM15BMl5BanBnXkFtZTgwNTQ5NzIxMTE%40._V1_.jpg',
              },
              'miracle-2004': {
                  'actors': ['Kurt Russell', 'Patricia Clarkson', 'Noah Emmerich', 'Sean McCann', 'Kenneth Welsh'],
                  'posterUrl': 'https://lumiere-a.akamaihd.net/v1/images/poster_12511_12521_12463_12523_46f7f6c2.jpeg',
              },
              'monsoon-2018': {
                  'actors': ['Austin Lyon', 'Katherine Hughes', 'Yvette Monreal', 'Eve Plumb', 'Scott Lowell'],
                  'posterUrl': 'https://m.media-amazon.com/images/M/MV5BMTYxOWU1YmYtYmY3YS00YWE1LWE2ZWEtNjJlYjFjZjcxNjJjXkEyXkFqcGc%40._V1_FMjpg_UX1000_.jpg',
              },
          }

          with DATA.open(encoding='utf-8') as f:
              data = json.load(f)
          with META.open(encoding='utf-8') as f:
              meta = json.load(f)

          by_id = {m['id']: m for m in data['movies']}
          assert len(by_id) == len(data['movies']), 'Duplicate movie IDs before enrichment'
          assert all(mid in by_id for mid in TARGETS), 'A batch target is missing from movie data'
          assert all(mid in meta for mid in TARGETS), 'A batch target is missing from enrichment metadata'

          locked = {
              mid: {
                  k: json.loads(json.dumps(by_id[mid].get(k)))
                  for k in ('runtimeMinutes', 'runtimeSeconds', 'runtimeExact', 'version', 'ratings')
              }
              for mid in TARGETS
          }

          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 SceneSenseLibraryBot/1.0'})
          retry = Retry(total=6, connect=4, read=4, status=6, backoff_factor=1.2,
                        status_forcelist=(429, 500, 502, 503, 504),
                        allowed_methods=frozenset(['GET']), respect_retry_after_header=True)
          session.mount('https://', HTTPAdapter(max_retries=retry))

          def get(url):
              r = session.get(url, timeout=45)
              r.raise_for_status()
              time.sleep(0.12)
              return r

          def top_cast(soup):
              out = []
              for li in soup.select('ol.people.scroller li.card, ol.people li.card'):
                  a = li.select_one('p a')
                  if not a:
                      continue
                  name = a.get_text(' ', strip=True)
                  if name and name not in out:
                      out.append(name)
                  if len(out) == 5:
                      break
              return out

          def primary_poster_path(soup):
              img = soup.select_one('div.poster img, img.poster')
              if not img:
                  return None
              for raw in (img.get('src',''), img.get('data-src',''), img.get('srcset',''), img.get('data-srcset','')):
                  for token in raw.split(','):
                      m = re.search(r'/([^/?,]+\.(?:jpg|png))(?:\s|\?|$)', token.strip())
                      if m:
                          return m.group(1)
              return None

          def save_webp(raw, dest):
              im = Image.open(io.BytesIO(raw)).convert('RGB')
              im.save(dest, 'WEBP', quality=92, method=6)

          changed = []
          for mid in TARGETS:
              movie = by_id[mid]
              ov = meta[mid]
              print(f'=== {movie["title"]} ({movie["year"]}) ===')

              if not str(movie.get('description') or '').strip():
                  movie['description'] = ov['description']
              if not movie.get('genres'):
                  movie['genres'] = ov['genres']

              dest = POSTERS / f'{mid}.webp'
              manual = MANUAL.get(mid)
              if manual:
                  if not movie.get('actors'):
                      movie['actors'] = manual['actors'][:5]
                  if not str(movie.get('poster') or '').strip():
                      save_webp(get(manual['posterUrl']).content, dest)
                      movie['poster'] = str(dest).replace('\\', '/')
                  if mid in TMDB_IDS and not movie.get('tmdbId'):
                      movie['tmdbId'] = TMDB_IDS[mid]
              else:
                  tmdb_id = TMDB_IDS[mid]
                  page = BeautifulSoup(get(f'https://www.themoviedb.org/movie/{tmdb_id}?language=en-US').text, 'html.parser')
                  cast = top_cast(page)
                  if len(cast) < 3:
                      raise RuntimeError(f'{mid}: insufficient TMDB cast {cast}')
                  if not movie.get('actors'):
                      movie['actors'] = cast[:5]
                  if not movie.get('tmdbId'):
                      movie['tmdbId'] = tmdb_id
                  if not str(movie.get('poster') or '').strip():
                      poster_path = primary_poster_path(page)
                      if not poster_path:
                          raise RuntimeError(f'{mid}: no TMDB poster found')
                      save_webp(get(f'https://image.tmdb.org/t/p/w780/{poster_path}').content, dest)
                      movie['poster'] = str(dest).replace('\\', '/')

              for key, expected in locked[mid].items():
                  if movie.get(key) != expected:
                      raise AssertionError(f'{mid}: locked field {key} changed')
              if not movie.get('description') or not movie.get('genres') or len(movie.get('actors') or []) < 3 or not movie.get('poster'):
                  raise AssertionError(f'{mid}: enrichment incomplete')
              changed.append(mid)

          with DATA.open('w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')

          subprocess.run(['git', 'add', str(DATA), 'assets/posters'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Enrich SceneSense library batch 01'], check=True)
          subprocess.run(['git', 'push', 'origin', 'main'], check=True)
          print('ENRICHED', len(changed), changed)
          PY
      - name: Remove temporary batch workflow
        if: success()
        run: |
          git rm .github/workflows/enrich-library-batch-01.yml
          git commit -m "Remove completed enrichment batch workflow"
          git push origin main
