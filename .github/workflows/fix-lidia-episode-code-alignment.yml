name: Fix Lidia title and episode code alignment
on:
  push:
    paths:
      - '.github/workflows/fix-lidia-episode-code-alignment.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply corrections
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          import json
          from pathlib import Path

          # 1. Exact visible series title capitalization.
          p = Path('data/series/index-additions.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          series = next(s for s in data['series'] if s['id'] == 'the-law-according-to-lidia-poet-2023')
          if series.get('title') != 'La legge di Lidia Poët':
              raise SystemExit(f"Unexpected Lidia title before edit: {series.get('title')!r}")
          series['title'] = 'La Legge di Lidia Poët'
          p.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          # 2. Replace the stretched-1 optical hack with fixed-width character cells.
          p = Path('series-tv-enhancements.js')
          js = p.read_text(encoding='utf-8')

          old_digits = '''function tvEpisodeDigitsMarkup(number){
            return [...String(number||"")].map(char=>char==="1" ? `<span class="episodeOpticalOne">1</span>` : escapeHtml(char)).join("");
          }

          function tvEpisodeCodeMarkup(seasonNumber, episodeNumber){
            const season=`S${String(seasonNumber).padStart(2,"0")}`;
            const episodes=String(episodeNumber||"").split("-").filter(Boolean);
            return `<span class="episodeSeasonCode">${escapeHtml(season)}</span><span class="episodeNumberStack">${episodes.map(n=>`<span class="episodeNumberLine">E${tvEpisodeDigitsMarkup(n)}</span>`).join("")}</span>`;
          }'''
          new_digits = '''function tvEpisodeDigitsMarkup(number){
            return [...String(number||"")].map(char=>`<span class="episodeCodeCell">${escapeHtml(char)}</span>`).join("");
          }

          function tvEpisodeCodeMarkup(seasonNumber, episodeNumber){
            const season=`S${String(seasonNumber).padStart(2,"0")}`;
            const episodes=String(episodeNumber||"").split("-").filter(Boolean);
            return `<span class="episodeSeasonCode">${escapeHtml(season)}</span><span class="episodeNumberStack">${episodes.map(n=>`<span class="episodeNumberLine"><span class="episodeCodeCell">E</span>${tvEpisodeDigitsMarkup(n)}</span>`).join("")}</span>`;
          }'''
          if old_digits not in js:
              raise SystemExit('Episode-code markup anchor not found')
          js = js.replace(old_digits, new_digits, 1)

          old_css = '''    .episodeNumberStack{display:flex!important;flex-direction:column!important;align-items:flex-start!important;justify-content:center!important;gap:1px!important;min-width:38px!important;margin-left:-2px!important}
              .episodeNumberLine{display:block!important}
              .episodeOpticalOne{display:inline-block!important;transform:scaleX(1.16)!important;transform-origin:50% 50%!important}'''
          new_css = '''    .episodeNumberStack{display:flex!important;flex-direction:column!important;align-items:flex-start!important;justify-content:center!important;gap:1px!important;min-width:38px!important;margin-left:-2px!important}
              .episodeNumberLine{display:flex!important;align-items:center!important;font-variant-numeric:tabular-nums!important;font-feature-settings:"tnum" 1!important}
              .episodeCodeCell{display:inline-flex!important;width:.64em!important;flex:0 0 .64em!important;align-items:center!important;justify-content:center!important;text-align:center!important}'''
          if old_css not in js:
              raise SystemExit('Episode-code CSS anchor not found')
          js = js.replace(old_css, new_css, 1)
          p.write_text(js, encoding='utf-8')

          # Exact-state guards.
          data = json.loads(Path('data/series/index-additions.json').read_text(encoding='utf-8'))
          series = next(s for s in data['series'] if s['id'] == 'the-law-according-to-lidia-poet-2023')
          assert series['title'] == 'La Legge di Lidia Poët'
          js = Path('series-tv-enhancements.js').read_text(encoding='utf-8')
          assert 'episodeOpticalOne' not in js
          assert 'scaleX(1.16)' not in js
          assert 'episodeCodeCell' in js
          assert 'font-variant-numeric:tabular-nums' in js
          assert 'font-feature-settings:"tnum" 1' in js
          print('LIDIA + EPISODE CODE ALIGNMENT AUDIT PASSED')
          PY

          rm -f .github/workflows/fix-lidia-episode-code-alignment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          echo 'Changed paths:'
          git diff --cached --name-only
          bad=$(git diff --cached --name-only | grep -Ev '^(data/series/index-additions\.json|series-tv-enhancements\.js|\.github/workflows/fix-lidia-episode-code-alignment\.yml)$' || true)
          if [ -n "$bad" ]; then
            echo "Unexpected files changed:" >&2
            echo "$bad" >&2
            exit 1
          fi
          git commit -m 'Fix Lidia title and align stacked episode codes'
          git push origin main
