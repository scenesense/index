name: Final three TV repairs
on:
  push:
    paths:
      - '.github/workflows/final-three-tv-repairs.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair titles edition and genre
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          import json

          additions_path='data/series/index-additions.json'
          main_path='data/series/index.json'

          with open(additions_path,encoding='utf-8') as f:
              additions=json.load(f)
          with open(main_path,encoding='utf-8') as f:
              main=json.load(f)

          # 1. LA PRIMERA VEZ: series title remains in original language.
          lpv=[x for x in additions.get('series',[]) if x.get('id')=='eva-lasting-2023']
          if len(lpv)!=1:
              raise SystemExit(f'Expected one eva-lasting-2023 entry, found {len(lpv)}')
          lpv[0]['title']='La Primera Vez'

          # 2. DAWSON'S CREEK: SPECIAL EDITION on series-detail metadata, matching Firefly inheritance.
          dc=[x for x in main.get('series',[]) if x.get('id')=='dawsons-creek-1998']
          if len(dc)!=1:
              raise SystemExit(f'Expected one dawsons-creek-1998 entry, found {len(dc)}')
          dc[0]['edition']='SPECIAL EDITION'
          for season in dc[0].get('seasons',[]):
              season['edition']='SPECIAL EDITION'

          # 3. LAST RESORT: remove invalid non-SceneSense genre only.
          lr=[x for x in additions.get('series',[]) if x.get('id')=='last-resort-2012']
          if len(lr)!=1:
              raise SystemExit(f'Expected one last-resort-2012 entry, found {len(lr)}')
          lr[0]['genres']=[g for g in lr[0].get('genres',[]) if g!='War']

          with open(additions_path,'w',encoding='utf-8',newline='\n') as f:
              json.dump(additions,f,ensure_ascii=False,separators=(',',':'))
              f.write('\n')
          with open(main_path,'w',encoding='utf-8',newline='\n') as f:
              json.dump(main,f,ensure_ascii=False,separators=(',',':'))
              f.write('\n')

          assert lpv[0]['title']=='La Primera Vez'
          assert dc[0]['edition']=='SPECIAL EDITION'
          assert all(s.get('edition')=='SPECIAL EDITION' for s in dc[0].get('seasons',[]))
          assert 'War' not in lr[0].get('genres',[])
          print('PASS title:', lpv[0]['title'])
          print('PASS Dawson edition:', dc[0]['edition'], [s.get('edition') for s in dc[0].get('seasons',[])])
          print('PASS Last Resort genres:', lr[0].get('genres'))
          PY

          rm -f .github/workflows/fix-dawsons-creek-edition.yml
          rm -f .github/workflows/apply-three-tv-metadata-repairs.yml
          rm -f .github/workflows/remove-invalid-war-genre.yml
          rm -f .github/workflows/final-three-tv-repairs.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only
          git commit -m 'Apply three requested TV metadata repairs'
          git push origin main
