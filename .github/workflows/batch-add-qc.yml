name: QC 15-film batch

on:
  push:
    paths:
      - BATCH_ADD_QC_TRIGGER

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests beautifulsoup4
      - name: Fetch exact poster candidates
        run: |
          python - <<'PY'
          import io, json
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageFont

          items = [
            ('dangerous-beauty-1998',8583,None),
            ('dark-water-2005',9009,None),
            ('dashing-home-for-christmas-2020',748896,None),
            ('deja-vu-2006',7551,None),
            ('desk-set-1957',None,'https://media-cache.cinematerial.com/p/500x/lbifw1vx/desk-set-movie-poster.jpg?v=1630298944'),
            ('dragonheart-1996',8840,None),
            ('easy-a-2010',None,'https://br.web.img3.acsta.net/medias/nmedia/18/78/74/91/19476844.jpg'),
            ('farmer-seeking-love-2022',None,'https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak%3D/v3/t/assets/p21590187_p_v13_aa.jpg'),
            ('finding-christmas-2013',None,'https://images.justwatch.com/poster/253887776/s718/la-llave-de-mi-corazon.%7Bformat%7D'),
            ('finding-neverland-2004',None,'https://image.tmdb.org/t/p/original/8d5gJqBNLKWVeTUxafXAB6J2EGJ.jpg'),
            ('flight-of-the-navigator-1986',None,'https://pics.filmaffinity.com/Flight_of_the_Navigator-436681669-large.jpg'),
            ('flyboys-2006',None,'https://imagens.publicocdn.com/imagens.aspx/232461?tp=KM'),
            ('french-kiss-1995',None,'https://www.hoefekino.de/fileadmin/_processed_/b/7/csm_French_Kiss_Plakat_956417c85d.jpg'),
            ('gojira-mainasu-wan-2023',None,'https://eu-images.contentstack.com/v3/assets/blt8770191dea35bccc/bltbbdbb5509785c800/64d3e6a75d1aa759acabed1e/Godzilla_Minus_One_poster.png?auto=webp&disable=upscale&format=jpg&quality=80&width=1280'),
            ('guess-whos-coming-to-dinner-1967',None,'https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak%3D/v3/t/assets/p1097_p_v13_af.jpg'),
          ]
          out=Path('batch-add-qc'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'en-US,en;q=0.9'})
          meta=[]
          thumbs=[]
          for slug,mid,url in items:
              if mid:
                  page=s.get(f'https://www.themoviedb.org/movie/{mid}?language=en-US',timeout=45); page.raise_for_status()
                  soup=BeautifulSoup(page.text,'html.parser')
                  og=soup.find('meta',attrs={'property':'og:image'})
                  if not og or not og.get('content'): raise RuntimeError(f'No TMDB poster for {slug} / {mid}')
                  url=og['content']
              r=s.get(url,timeout=60); r.raise_for_status()
              im=Image.open(io.BytesIO(r.content)).convert('RGB')
              orig=im.size
              im.thumbnail((1200,1800),Image.Resampling.LANCZOS)
              im.save(out/f'{slug}.webp','WEBP',quality=90,method=6)
              meta.append({'slug':slug,'tmdbId':mid,'url':url,'originalSize':orig,'savedSize':im.size})
              canvas=Image.new('RGB',(320,510),'#111111')
              t=im.copy(); t.thumbnail((300,450),Image.Resampling.LANCZOS)
              canvas.paste(t,((320-t.width)//2,8))
              d=ImageDraw.Draw(canvas); d.text((10,468),slug,fill='white')
              thumbs.append(canvas)
              print(slug,mid,url,orig,'=>',im.size)
          sheet=Image.new('RGB',(320*5,510*3),'#000000')
          for i,t in enumerate(thumbs): sheet.paste(t,((i%5)*320,(i//5)*510))
          sheet.save(out/'CONTACT_SHEET.jpg','JPEG',quality=92)
          (out/'metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-add-qc
          path: batch-add-qc/*
          if-no-files-found: error
