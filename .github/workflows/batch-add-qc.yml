name: Deploy 15-film batch

on:
  push:
    paths:
      - BATCH_ADD_QC_TRIGGER

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests beautifulsoup4
      - name: Add films and local WebP posters
        run: |
          python - <<'PY'
          import io, json
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          records = [
            {
              'id':'dangerous-beauty-1998','title':'Dangerous Beauty','year':1998,'runtimeMinutes':112,'version':'Theatrical Cut','tmdbId':8583,
              'poster':'assets/posters/dangerous-beauty-1998.webp',
              'description':'In 16th-century Venice, Veronica Franco is denied marriage to Marco Venier because of class and money, then trained by her mother Paola to become a courtesan. Her wit and influence make her famous, but war, jealousy and an Inquisition for witchcraft threaten the life she built.',
              'actors':['Catherine McCormack','Rufus Sewell','Oliver Platt','Jacqueline Bisset','Moira Kelly'],'ratings':{}
            },
            {
              'id':'dark-water-2005','title':'Dark Water','year':2005,'runtimeMinutes':105,'version':'Theatrical Cut','tmdbId':9009,
              'poster':'assets/posters/dark-water-2005.webp',
              'description':'After separating from Kyle, Dahlia Williams moves with her daughter Ceci into a decaying Roosevelt Island apartment. A spreading ceiling leak and the mystery of a missing girl turn their new home into something far more threatening than either expected.',
              'actors':['Jennifer Connelly','Ariel Gade','John C. Reilly','Tim Roth','Dougray Scott'],'ratings':{}
            },
            {
              'id':'dashing-home-for-christmas-2020','title':'Dashing Home for Christmas','year':2020,'runtimeMinutes':91,'version':'Television Movie','tmdbId':748896,
              'poster':'assets/posters/dashing-home-for-christmas-2020.webp',
              'description':'Holiday travel chaos leaves business consultant Emily stranded on her way home for Christmas. With flights and plans collapsing around her, she reluctantly teams up with Simon, and the trip becomes less about getting there quickly than about who she is travelling with.',
              'actors':['Paniz Zade','Adrian Spencer','Suzanne Cyr','Andrew Bushell','Diana Cofini'],'ratings':{}
            },
            {
              'id':'deja-vu-2006','title':'Deja Vu','year':2006,'runtimeMinutes':126,'version':'Theatrical Cut','tmdbId':7551,
              'poster':'assets/posters/deja-vu-2006.webp',
              'description':'ATF agent Doug Carlin investigates a deadly New Orleans ferry bombing and is brought into a secret program that can observe events four days in the past. When victim Claire Kuchever becomes central to the case, Doug begins looking for a way to do more than merely watch what happened.',
              'actors':['Denzel Washington','Paula Patton','Val Kilmer','Jim Caviezel','Adam Goldberg'],'ratings':{}
            },
            {
              'id':'desk-set-1957','title':'Desk Set','year':1957,'runtimeMinutes':103,'version':'Theatrical Cut','tmdbId':24203,
              'poster':'assets/posters/desk-set-1957.webp',
              'description':'Reference librarian Bunny Watson runs a remarkably efficient research department at a television network until efficiency expert Richard Sumner arrives to install a new computer. The staff fears the machine is meant to replace them while Bunny and Richard steadily test each other’s assumptions.',
              'actors':['Katharine Hepburn','Spencer Tracy','Gig Young','Joan Blondell','Dina Merrill'],'ratings':{}
            },
            {
              'id':'dragonheart-1996','title':'Dragonheart','year':1996,'runtimeMinutes':103,'version':'Theatrical Cut','tmdbId':8840,
              'poster':'assets/posters/dragonheart-1996.webp',
              'description':'Disillusioned knight Bowen teams with Draco, the last dragon, to stage profitable fake dragon slayings. Their partnership changes when Bowen learns Draco’s life is mystically tied to the cruel King Einon, forcing knight and dragon to decide what their friendship is worth.',
              'actors':['Dennis Quaid','Sean Connery','David Thewlis','Dina Meyer','Pete Postlethwaite'],'ratings':{}
            },
            {
              'id':'easy-a-2010','title':'Easy A','year':2010,'runtimeMinutes':92,'version':'Theatrical Cut','tmdbId':37735,
              'poster':'assets/posters/easy-a-2010.webp',
              'description':'A private joke about Olive Penderghast’s weekend is overheard and spreads through school as fact. Rather than fight the rumor immediately, Olive experiments with the reputation it gives her, only to discover how quickly other people’s lies and needs can take control of her identity.',
              'actors':['Emma Stone','Penn Badgley','Amanda Bynes','Dan Byrd','Thomas Haden Church'],'ratings':{}
            },
            {
              'id':'farmer-seeking-love-2022','title':'Farmer Seeking Love','year':2022,'runtimeMinutes':90,'version':'Television Movie',
              'poster':'assets/posters/farmer-seeking-love-2022.webp',
              'description':'Reality producer Claire Bardoz recruits farmer Joe Bennett to become the bachelor on a new dating show. As Claire shapes Joe’s televised search for love, working closely with him makes the distinction between producing a romance and becoming part of one increasingly difficult.',
              'actors':['Donna Benedicto','Jesse Hutch','Tanya Clarke','Andrew Di Rosa','Jake Lewis'],'ratings':{}
            },
            {
              'id':'finding-christmas-2013','title':'Finding Christmas','year':2013,'runtimeMinutes':87,'version':'Television Movie',
              'poster':'assets/posters/finding-christmas-2013.webp',
              'description':'Sean Tucker and Owen Harrison swap homes for Christmas after separate disappointments send both men looking for a change. Sean meets Owen’s sister Ryan in North Carolina while Owen grows close to Sean’s assistant Mia in New York, giving both households an unexpected holiday reset.',
              'actors':['Tricia Helfer','J.T. Hodges','Mark Lutz','Cristina Rosato','Christian Distefano'],'ratings':{}
            },
            {
              'id':'finding-neverland-2004','title':'Finding Neverland','year':2004,'runtimeMinutes':106,'version':'Theatrical Cut','tmdbId':866,
              'poster':'assets/posters/finding-neverland-2004.webp',
              'description':'Playwright J.M. Barrie befriends widow Sylvia Llewelyn Davies and her sons while struggling with his next work. His growing bond with the family, especially Peter, feeds the imagination that becomes Peter Pan while bringing pressure from both society and his own marriage.',
              'actors':['Johnny Depp','Kate Winslet','Freddie Highmore','Julie Christie','Dustin Hoffman'],'ratings':{}
            },
            {
              'id':'flight-of-the-navigator-1986','title':'Flight of the Navigator','year':1986,'runtimeMinutes':90,'version':'Theatrical Cut','tmdbId':10122,
              'poster':'assets/posters/flight-of-the-navigator-1986.webp',
              'description':'Twelve-year-old David Freeman disappears in 1978 and returns eight years later without having aged. When NASA links him to a mysterious spacecraft, David discovers that the ship knows exactly where he has been and may be his only chance to recover the life he lost.',
              'actors':['Joey Cramer','Paul Reubens','Veronica Cartwright','Cliff DeYoung','Sarah Jessica Parker'],'ratings':{}
            },
            {
              'id':'flyboys-2006','title':'Flyboys','year':2006,'runtimeMinutes':140,'version':'Theatrical Cut','tmdbId':9664,
              'poster':'assets/posters/flyboys-2006.webp',
              'description':'Before the United States enters World War I, Blaine Rawlings and other American volunteers join France’s Lafayette Escadrille. Training under Captain Thenault turns quickly into lethal aerial combat as the young pilots learn what courage, friendship and survival actually cost.',
              'actors':['James Franco','Martin Henderson','Jean Reno','Jennifer Decker','Philip Winchester'],'ratings':{}
            },
            {
              'id':'french-kiss-1995','title':'French Kiss','year':1995,'runtimeMinutes':111,'version':'Theatrical Cut','tmdbId':397,
              'poster':'assets/posters/french-kiss-1995.webp',
              'description':'Kate flies to France to win back her fiancé Charlie despite a fear of flying, then becomes entangled with charming thief Luc Teyssier, who secretly uses her luggage to move stolen property. Their trip across France steadily complicates both Kate’s original plan and Luc’s.',
              'actors':['Meg Ryan','Kevin Kline','Timothy Hutton','Jean Reno','François Cluzet'],'ratings':{}
            },
            {
              'id':'gojira-mainasu-wan-2023','title':'Gojira Mainasu Wan','year':2023,'runtimeMinutes':125,'version':'Theatrical Cut','tmdbId':940721,
              'poster':'assets/posters/gojira-mainasu-wan-2023.webp',
              'description':'After surviving the war, former kamikaze pilot Koichi Shikishima tries to rebuild a life in devastated Japan with Noriko Oishi and the orphaned Akiko. His unresolved guilt becomes inseparable from a new national catastrophe when Godzilla emerges and leaves ordinary survivors to fight back.',
              'actors':['Ryunosuke Kamiki','Minami Hamabe','Yuki Yamada','Munetaka Aoki','Hidetaka Yoshioka'],'ratings':{}
            },
            {
              'id':'guess-whos-coming-to-dinner-1967','title':"Guess Who's Coming to Dinner",'year':1967,'runtimeMinutes':108,'version':'Theatrical Cut','tmdbId':1879,
              'poster':'assets/posters/guess-whos-coming-to-dinner-1967.webp',
              'description':'Joanna Drayton returns home unexpectedly with Dr. John Prentice and announces that they intend to marry. Her liberal parents Matt and Christina must decide whether the principles they have always professed still hold when an interracial marriage becomes an immediate family decision.',
              'actors':['Spencer Tracy','Sidney Poitier','Katharine Hepburn','Katharine Houghton','Cecil Kellaway'],'ratings':{}
            }
          ]

          genres = {
            'dangerous-beauty-1998':['Drama','Romance'],
            'dark-water-2005':['Horror','Mystery','Drama'],
            'dashing-home-for-christmas-2020':['Christmas','Romance','Comedy'],
            'deja-vu-2006':['Thriller','Science Fiction','Action'],
            'desk-set-1957':['Comedy','Romance'],
            'dragonheart-1996':['Adventure','Fantasy','Drama','Action'],
            'easy-a-2010':['Comedy','Romance','Drama'],
            'farmer-seeking-love-2022':['Romance','Comedy','Drama'],
            'finding-christmas-2013':['Christmas','Romance','Comedy'],
            'finding-neverland-2004':['Drama','Fantasy'],
            'flight-of-the-navigator-1986':['Adventure','Science Fiction'],
            'flyboys-2006':['Action','Adventure','Drama'],
            'french-kiss-1995':['Romance','Comedy'],
            'gojira-mainasu-wan-2023':['Drama','Science Fiction','Action'],
            'guess-whos-coming-to-dinner-1967':['Drama','Romance','Comedy']
          }

          sources = {
            'dangerous-beauty-1998':('tmdb',8583,0,0),
            'dark-water-2005':('tmdb',9009,0,0),
            'dashing-home-for-christmas-2020':('tmdb',748896,0,0),
            'deja-vu-2006':('tmdb',7551,0,0),
            'desk-set-1957':('url','https://image.tmdb.org/t/p/original/c6OVzolrrGiGCVTZKdsmlfOLv6y.jpg',0,0),
            'dragonheart-1996':('tmdb',8840,0,0),
            'easy-a-2010':('url','https://i.pinimg.com/564x/fa/a4/65/faa46597bb849c34cdd9474cc03ffce8.jpg',0,0),
            'farmer-seeking-love-2022':('url','https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak%3D/v3/t/assets/p21590187_p_v13_aa.jpg',0,0.08),
            'finding-christmas-2013':('url','https://images.justwatch.com/poster/253887776/s718/la-llave-de-mi-corazon.%7Bformat%7D',0,0.09),
            'finding-neverland-2004':('url','https://image.tmdb.org/t/p/original/8d5gJqBNLKWVeTUxafXAB6J2EGJ.jpg',0,0),
            'flight-of-the-navigator-1986':('url','https://pics.filmaffinity.com/Flight_of_the_Navigator-436681669-large.jpg',0,0.12),
            'flyboys-2006':('url','https://imagens.publicocdn.com/imagens.aspx/232461?tp=KM',0,0.07),
            'french-kiss-1995':('url','https://www.hoefekino.de/fileadmin/_processed_/b/7/csm_French_Kiss_Plakat_956417c85d.jpg',0.12,0.13),
            'gojira-mainasu-wan-2023':('url','https://i.kym-cdn.com/photos/images/newsfeed/002/620/798/5d1.jpeg',0,0),
            'guess-whos-coming-to-dinner-1967':('url','https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak%3D/v3/t/assets/p1097_p_v13_af.jpg',0,0)
          }

          root=Path('.')
          db_path=root/'data/movies.json'
          index_path=root/'index.html'
          db=json.loads(db_path.read_text(encoding='utf-8'))
          existing={m['id'] for m in db['movies']}
          duplicates=[r['id'] for r in records if r['id'] in existing]
          if duplicates:
              raise RuntimeError('Refusing duplicate movie ids: '+', '.join(duplicates))
          before_count=len(db['movies'])
          db['movies'].extend(records)
          if len(db['movies']) != before_count + 15:
              raise RuntimeError('Movie count assertion failed')
          db_path.write_text(json.dumps(db,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          html=index_path.read_text(encoding='utf-8')
          anchor='"crusoe-2008":["Adventure","Drama","Action"]});'
          if html.count(anchor) != 1:
              raise RuntimeError('Genre anchor missing or ambiguous')
          additions=','.join(json.dumps(k,ensure_ascii=False)+':'+json.dumps(v,ensure_ascii=False,separators=(',',':')) for k,v in genres.items())
          html=html.replace(anchor,'"crusoe-2008":["Adventure","Drama","Action"],'+additions+'});')
          index_path.write_text(html,encoding='utf-8')

          poster_dir=root/'assets/posters'; poster_dir.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'en-US,en;q=0.9'})
          for slug,(kind,value,crop_top,crop_bottom) in sources.items():
              if kind=='tmdb':
                  page=s.get(f'https://www.themoviedb.org/movie/{value}?language=en-US',timeout=45); page.raise_for_status()
                  soup=BeautifulSoup(page.text,'html.parser')
                  og=soup.find('meta',attrs={'property':'og:image'})
                  if not og or not og.get('content'):
                      raise RuntimeError(f'No TMDB poster for {slug}')
                  url=og['content']
              else:
                  url=value
              r=s.get(url,timeout=60); r.raise_for_status()
              im=Image.open(io.BytesIO(r.content)).convert('RGB')
              w,h=im.size
              top=int(h*crop_top); bottom=int(h*(1-crop_bottom))
              if top or bottom<h: im=im.crop((0,top,w,bottom))
              if im.height <= im.width:
                  raise RuntimeError(f'Poster is not portrait after QC: {slug} {im.size}')
              if im.width>1000:
                  nh=round(im.height*1000/im.width); im=im.resize((1000,nh),Image.Resampling.LANCZOS)
              im.save(poster_dir/f'{slug}.webp','WEBP',quality=84,method=6)
              print(slug,im.size,url)

          # Remove one-shot QC machinery before committing.
          for p in [root/'.github/workflows/batch-add-qc.yml',root/'BATCH_ADD_QC_TRIGGER']:
              if p.exists(): p.unlink()
          PY
      - name: Validate exact scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          db=json.loads(Path('data/movies.json').read_text(encoding='utf-8'))
          ids=['dangerous-beauty-1998','dark-water-2005','dashing-home-for-christmas-2020','deja-vu-2006','desk-set-1957','dragonheart-1996','easy-a-2010','farmer-seeking-love-2022','finding-christmas-2013','finding-neverland-2004','flight-of-the-navigator-1986','flyboys-2006','french-kiss-1995','gojira-mainasu-wan-2023','guess-whos-coming-to-dinner-1967']
          assert len(db['movies'])==50, len(db['movies'])
          assert all(sum(m['id']==x for m in db['movies'])==1 for x in ids)
          assert all(Path('assets/posters',x+'.webp').is_file() for x in ids)
          assert '.github/workflows/batch-add-qc.yml' not in [str(p) for p in Path('.github/workflows').glob('*')]
          print('Validated 50 movies and 15 local posters')
          PY
          git status --short
      - name: Commit batch
        run: |
          git config user.name 'SceneSense Batch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/movies.json index.html assets/posters .github/workflows/batch-add-qc.yml BATCH_ADD_QC_TRIGGER
          git commit -m 'Add 15 films with local WebP posters'
          git push origin main
