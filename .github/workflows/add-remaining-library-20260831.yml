              value = "".join(ch for ch in value if not unicodedata.combining(ch))
              value = value.lower().replace("’", "").replace("'", "")
              return re.sub(r"[^a-z0-9]+", "-", value).strip("-")

          main = json.loads(Path("data/movies.json").read_text(encoding="utf-8"))
          supplemental = json.loads(Path("data/movies-additions-20260830.json").read_text(encoding="utf-8"))
          present = {m["id"] for m in main.get("movies", [])} | {m["id"] for m in supplemental.get("movies", [])}
          expected = {f"{slugify(item['title'])}-{item['year']}" for item in FILMS}
          missing = sorted(expected - present)
          if missing:
              raise SystemExit("Missing films after import: " + ", ".join(missing))
          print(f"Verified {len(expected)} requested films are present.")
          PY

          rm .github/workflows/add-remaining-library-20260831.yml
          git add -u .github/workflows/add-remaining-library-20260831.yml
