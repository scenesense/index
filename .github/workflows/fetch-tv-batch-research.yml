name: Fetch TV batch research
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-tv-batch-research.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TVMaze reference data
        run: |
          python - <<'PY'
          import json, urllib.request, os, shutil
          shows = {
            'kevin-from-work':2712,
            'the-law-according-to-lidia-poet':66616,
            'eva-lasting':66923,
            'last-resort':228,
            'legend-of-the-seeker':461,
            'lois-and-clark':1323,
          }
          root='tmp-tv-batch-research'
          shutil.rmtree(root,ignore_errors=True)
          os.makedirs(root,exist_ok=True)
          index={}
          def get(url):
            with urllib.request.urlopen(url,timeout=30) as r:
              return json.load(r)
          for slug,sid in shows.items():
            show=get(f'https://api.tvmaze.com/shows/{sid}')
            eps=get(f'https://api.tvmaze.com/shows/{sid}/episodes')
            cast=get(f'https://api.tvmaze.com/shows/{sid}/cast')
            showinfo={
              'id':show.get('id'),'name':show.get('name'),'premiered':show.get('premiered'),'ended':show.get('ended'),
              'genres':show.get('genres'),'summary':show.get('summary'),
              'cast':[{'person':x.get('person',{}).get('name'),'character':x.get('character',{}).get('name')} for x in cast[:12]],
            }
            seasons=sorted({e.get('season') for e in eps if e.get('season')})
            index[slug]={'show':showinfo,'seasons':seasons}
            for season in seasons:
              payload={'show':showinfo,'season':season,'episodes':[
                {'season':e.get('season'),'number':e.get('number'),'name':e.get('name'),'airdate':e.get('airdate'),'summary':e.get('summary')}
                for e in eps if e.get('season')==season
              ]}
              with open(f'{root}/{slug}-s{season:02d}.json','w',encoding='utf-8') as f:
                json.dump(payload,f,ensure_ascii=False,indent=2)
          names=[]
          for n in os.listdir('assets/posters'):
            low=n.lower()
            if any(tok in low for tok in ['kevin-from-work','lidia','poet','primera','eva-lasting','last-resort','legend-of-the-seeker','lois-and-clark']):
              names.append(n)
          index['_posters']=sorted(names)
          with open(f'{root}/index.json','w',encoding='utf-8') as f:
            json.dump(index,f,ensure_ascii=False,indent=2)
          PY
      - name: Commit research snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-tv-batch-research
          git commit -m 'Split TV batch reference data by season'
          git push
