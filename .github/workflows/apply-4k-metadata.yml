name: Apply SceneSense 4K metadata
on:
  push:
    paths: ['.github/workflows/apply-4k-metadata.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add 4K metadata styling and rendering
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='.cardSubtitle{margin-top:3px;color:#fff;font-family:"Saira",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif!important;font-size:16px;font-weight:500;line-height:1.15;letter-spacing:0!important;white-space:nowrap;overflow:hidden;text-overflow:clip}.cardGenres{width:100%;'
          new='.cardSubtitle{margin-top:3px;color:#fff;font-family:"Saira",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif!important;font-size:16px;font-weight:500;line-height:1.15;letter-spacing:0!important;white-space:nowrap;overflow:hidden;text-overflow:clip}.cardMeta,.movieSummary .eyebrow{white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important}.format4k{color:#c0c0c0!important;font-variant-caps:normal!important;font-synthesis-small-caps:none!important;text-transform:none!important;font-weight:600!important}.format4kBlue{color:#79a9ff!important}.cardGenres{width:100%;'
          assert old in s
          s=s.replace(old,new,1)

          old='function genresFor(movie){return movie?(movie.genres||MOVIE_GENRES[movie.id]||[]):[]}function genreText(movie,limit=null){'
          new='const BLUE_4K_IDS=new Set(["back-to-the-future-1985","back-to-the-future-ii-1989","back-to-the-future-iii-1990","alien-1979","bring-it-on-2000","dragonheart-1996","gojira-mainasu-wan-2023","guess-whos-coming-to-dinner-1967","indiana-jones-and-the-raiders-of-the-lost-ark-1981","indiana-jones-and-the-last-crusade-1989","jurassic-park-1993"]);function fourKMarkup(movie){return `<span class="format4k${BLUE_4K_IDS.has(movie?.id)?" format4kBlue":""}">4K</span>`}function cardMetaMarkup(movie){return `${movie.year} · ${movie.runtimeMinutes} min · ${escapeHtml(movie.version)} · ${fourKMarkup(movie)}`}function detailMetaMarkup(movie){return `${movie.year} · ${escapeHtml(runtimeText(movie))} · ${escapeHtml(movie.version)} · ${fourKMarkup(movie)}`}function genresFor(movie){return movie?(movie.genres||MOVIE_GENRES[movie.id]||[]):[]}function genreText(movie,limit=null){'
          assert old in s
          s=s.replace(old,new,1)

          old='function fitAllCardTitles(){document.querySelectorAll(".cardTitle").forEach(row=>fitCardLine(row,11))}function fitAllCardSubtitles(){document.querySelectorAll(".cardSubtitle").forEach(row=>fitCardLine(row,10))}'
          new='function fitAllCardTitles(){document.querySelectorAll(".cardTitle").forEach(row=>fitCardLine(row,11))}function fitAllCardSubtitles(){document.querySelectorAll(".cardSubtitle").forEach(row=>fitCardLine(row,10))}function fitAllCardMeta(){document.querySelectorAll(".cardMeta").forEach(row=>fitCardLine(row,9))}function fitDetailMeta(){const row=$("detailMeta");if(row)fitCardLine(row,10)}'
          assert old in s
          s=s.replace(old,new,1)

          old='$("detailMeta").textContent=`${movie.year} · ${runtimeText(movie)} · ${movie.version}`;$("detailGenres").textContent=genreText(movie);'
          new='$("detailMeta").innerHTML=detailMetaMarkup(movie);requestAnimationFrame(fitDetailMeta);$("detailGenres").textContent=genreText(movie);'
          assert old in s
          s=s.replace(old,new,1)

          old='meta.textContent=`${movie.year} · ${movie.runtimeMinutes} min · ${movie.version}`;meta.after(genreRow);fitCardGenres(genreRow,movie)})}'
          new='meta.innerHTML=cardMetaMarkup(movie);requestAnimationFrame(()=>fitCardLine(meta,9));meta.after(genreRow);fitCardGenres(genreRow,movie)})}'
          assert old in s
          s=s.replace(old,new,1)

          old='requestAnimationFrame(()=>{fitAllCardGenres();fitAllCardTitles();fitAllCardSubtitles()})};'
          new='requestAnimationFrame(()=>{fitAllCardGenres();fitAllCardTitles();fitAllCardSubtitles();fitAllCardMeta()})};'
          assert old in s
          s=s.replace(old,new,1)

          old='setTimeout(()=>{fitAllCardGenres();fitAllCardTitles();fitAllCardSubtitles();if(activeMovieId)renderPrincipalCast(movieById(activeMovieId))},80)});document.fonts?.ready.then(()=>{fitAllCardTitles();fitAllCardSubtitles();if(activeMovieId)renderPrincipalCast(movieById(activeMovieId))});'
          new='setTimeout(()=>{fitAllCardGenres();fitAllCardTitles();fitAllCardSubtitles();fitAllCardMeta();if(activeMovieId){fitDetailMeta();renderPrincipalCast(movieById(activeMovieId))}},80)});document.fonts?.ready.then(()=>{fitAllCardTitles();fitAllCardSubtitles();fitAllCardMeta();if(activeMovieId){fitDetailMeta();renderPrincipalCast(movieById(activeMovieId))}});'
          assert old in s
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

          h=Path('SCENESENSE_HANDOFF.md')
          if h.exists():
            hs=h.read_text(encoding='utf-8')
            note='''\n\n## Current 4K metadata convention\n\nLibrary cards and movie-detail metadata both end with a `4K` marker. The metadata row must remain on one line and may shrink slightly to fit rather than wrap or clip. The normal marker is silver. Blue is reserved for these current IDs: BTTF I–III, Alien, Bring It On, Dragonheart, Gojira Minus One, Guess Who’s Coming to Dinner, both Indiana Jones films, and Jurassic Park. The implementation currently lives in the inline UI layer in `index.html`.\n'''
            if '## Current 4K metadata convention' not in hs:
              h.write_text(hs.rstrip()+note+'\n',encoding='utf-8')

          Path('.github/workflows/apply-4k-metadata.yml').unlink()
          PY
          git config user.name 'SceneSense Library Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Add 4K markers to movie metadata'
          git push origin HEAD:main
