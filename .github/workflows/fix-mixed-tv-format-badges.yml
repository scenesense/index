name: Fix mixed TV episode badge inheritance
on:
  push:
    branches: [tmp-fix-mixed-format-badges]
    paths:
      - '.github/workflows/fix-mixed-tv-format-badges.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-fix-mixed-format-badges
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def save(p,o): Path(p).write_text(json.dumps(o,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          # Mixed-season defaults. Explicit episode overrides continue to win.
          defaults={
            'data/series/buffy-the-vampire-slayer/season-01-meta.json':'PRiSM',
            'data/series/chuck/season-01-meta.json':'SiLVER16',
            'data/series/chuck/season-02-meta.json':'SiLVER16',
          }
          for p,fmt in defaults.items():
              d=load(p); d['format']=fmt; save(p,d)

          # Friends is the deliberate exception: each canonical row represents both retained file options.
          p='data/series/index-additions.json'
          d=load(p)
          f=next(x for x in d['series'] if x['id']=='friends-1994')
          f['allEpisodeFormats']=True
          save(p,d)

          # Episode-detail badge inheritance: episode-specific > deliberate all-formats flag > season default > single season format.
          p=Path('audio-metadata-base.js')
          s=p.read_text(encoding='utf-8')
          old='''  function renderTvFormatBadges(scoreLine,presentation){
    if(!scoreLine) return;
    const formats=formatList(presentation);
    if(!formats.length) return;
    scoreLine.querySelectorAll(".detailBlurayBadge,.detailPrismBadge,.detailSilver8Badge,.detailSilver16Badge,.detailSilver35Badge,.detailSilver55Badge,.detailSilver70Badge,.detailBrazier35Badge,.detailBrazier70Badge,.detailClarity35Badge,.detailClarity70Badge").forEach(node=>node.remove());
    scoreLine.insertAdjacentHTML("beforeend",formats.map(tvFormatBadgeLocal).join(""));
  }
'''
          new='''  function renderTvFormatBadges(scoreLine,presentation){
    if(!scoreLine) return;
    scoreLine.querySelectorAll(".detailBlurayBadge,.detailPrismBadge,.detailSilver8Badge,.detailSilver16Badge,.detailSilver35Badge,.detailSilver55Badge,.detailSilver70Badge,.detailBrazier35Badge,.detailBrazier70Badge,.detailClarity35Badge,.detailClarity70Badge").forEach(node=>node.remove());
    const formats=formatList(presentation);
    if(!formats.length) return;
    scoreLine.insertAdjacentHTML("beforeend",formats.map(tvFormatBadgeLocal).join(""));
  }
'''
          if old not in s: raise RuntimeError('renderTvFormatBadges block not found')
          s=s.replace(old,new,1)
          old2='''        renderTvFormatBadges(document.querySelector("#seriesHero .scoreLine"),formatList(episodePresentation).length ? episodePresentation : seasonPresentation);
'''
          new2='''        let badgePresentation=null;
        if(formatList(episodePresentation).length){
          badgePresentation=episodePresentation;
        }else if(series?.allEpisodeFormats){
          badgePresentation=seasonPresentation;
        }else if(seasonPresentation?.format){
          badgePresentation={format:seasonPresentation.format};
        }else if(formatList(seasonPresentation).length===1){
          badgePresentation=seasonPresentation;
        }
        renderTvFormatBadges(document.querySelector("#seriesHero .scoreLine"),badgePresentation);
'''
          if old2 not in s: raise RuntimeError('episode badge inheritance line not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')

          # Harden guide.
          gp=Path('TV_SERIES_INTEGRATION_GUIDE.md')
          g=gp.read_text(encoding='utf-8')
          anchor='A normal new-series integration should be **data-driven**. Change renderer code only when the new series exposes a real unsupported feature.\n'
          add='''A normal new-series integration should be **data-driven**. Change renderer code only when the new series exposes a real unsupported feature.

## Mixed-format badge inheritance hard rule

- A **season page** may show every format used anywhere in that season.
- An **episode page must never inherit every season format merely because the season is mixed**.
- Episode badge precedence is: explicit episode `format`/`formats` → deliberate series-level `allEpisodeFormats:true` → season `format` default → sole season format.
- For a mixed season with a dominant/default format plus exceptions, store the dominant format in top-level season-meta `format`, and store only the exceptions on individual episodes.
- Use `allEpisodeFormats:true` only when every canonical episode/scoring row genuinely represents all listed retained file options, as with Friends. It is not a substitute for missing episode metadata.
- Final audit must reject any mixed-format season that has untagged episodes and neither a valid season default nor an explicit all-episode-formats rule.
'''
          if anchor not in g: raise RuntimeError('guide anchor not found')
          g=g.replace(anchor,add,1)
          gp.write_text(g,encoding='utf-8')

          # Assertions across the repository.
          additions=load('data/series/index-additions.json')
          all_formats_series={x['id'] for x in additions.get('series',[]) if x.get('allEpisodeFormats')}
          problems=[]
          for mp in sorted(Path('data/series').glob('*/season-??-meta.json')):
              m=load(mp)
              fs=m.get('formats')
              if not isinstance(fs,list) or len(fs)<=1: continue
              eps=m.get('episodes') or {}
              missing=[k for k,v in eps.items() if not v.get('format') and not v.get('formats')]
              if missing and not m.get('format') and m.get('seriesId') not in all_formats_series:
                  problems.append((str(mp),missing))
          if problems: raise RuntimeError(f'Unsafe mixed-format inheritance remains: {problems}')

          assert load('data/series/buffy-the-vampire-slayer/season-01-meta.json')['format']=='PRiSM'
          assert load('data/series/chuck/season-01-meta.json')['format']=='SiLVER16'
          assert load('data/series/chuck/season-02-meta.json')['format']=='SiLVER16'
          assert next(x for x in additions['series'] if x['id']=='friends-1994')['allEpisodeFormats'] is True
          js=p.read_text(encoding='utf-8')
          assert 'series?.allEpisodeFormats' in js
          PY
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "soap2"
          git config user.email "46655904+soap2@users.noreply.github.com"
          git rm -f .github/workflows/fix-mixed-tv-format-badges.yml
          git add audio-metadata-base.js TV_SERIES_INTEGRATION_GUIDE.md data/series/index-additions.json data/series/buffy-the-vampire-slayer/season-01-meta.json data/series/chuck/season-01-meta.json data/series/chuck/season-02-meta.json
          git commit -m "Fix mixed TV episode format badge inheritance"
          git push origin HEAD:tmp-fix-mixed-format-badges
