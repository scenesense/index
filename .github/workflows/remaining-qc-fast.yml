name: QC remaining library fast

on:
  push:
    paths:
      - REMAINING_INSPECT_TRIGGER

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests beautifulsoup4
      - name: Fetch candidates in parallel
        run: |
          python - <<'PY'
          import io,json,re,unicodedata,difflib
          from pathlib import Path
          from urllib.parse import quote
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image,ImageDraw

          items=json.load(open('data/remaining_batch_manifest.json',encoding='utf-8'))
          out=Path('remaining-qc-fast'); out.mkdir(exist_ok=True); posters=out/'posters'; posters.mkdir(exist_ok=True)
          HEAD={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'en-US,en;q=0.9'}
          def sess(): s=requests.Session(); s.headers.update(HEAD); return s
          def norm(x):
              x=unicodedata.normalize('NFKD',str(x)).encode('ascii','ignore').decode().lower(); return re.sub(r'[^a-z0-9]+','',x)
          def slugify(x):
              x=unicodedata.normalize('NFKD',x).encode('ascii','ignore').decode().lower(); return re.sub(r'[^a-z0-9]+','-',x).strip('-')
          def page_info(s,kind,href):
              url=('https://www.themoviedb.org'+href if href.startswith('/') else href)
              if '?' not in url: url+='?language=en-US'
              r=s.get(url,timeout=35); r.raise_for_status(); soup=BeautifulSoup(r.text,'html.parser')
              def meta(prop):
                  x=soup.find('meta',attrs={'property':prop}); return (x.get('content','') if x else '').strip()
              title=meta('og:title'); body=soup.get_text(' ',strip=True)
              ov=soup.select_one('div.overview p'); overview=(ov.get_text(' ',strip=True) if ov else meta('og:description')).strip()
              genres=[a.get_text(' ',strip=True) for a in soup.select('span.genres a')]
              actors=[]
              for a in soup.select('ol.people.scroller li.card p a'):
                  n=a.get_text(' ',strip=True)
                  if n and n not in actors: actors.append(n)
                  if len(actors)>=5: break
              m=re.search(r'/(?:movie|tv)/(\d+)',url)
              return {'sourceType':kind,'sourceId':int(m.group(1)) if m else None,'sourceTitle':title,'body':body,'overview':overview,'rawGenres':genres,'actors':actors,'imageUrl':meta('og:image'),'sourceUrl':url}
          def choose(item):
              s=sess(); pref=item.get('sourceType')
              if item.get('sourceId'): return page_info(s,pref or 'movie',f'https://www.themoviedb.org/{pref or "movie"}/{item["sourceId"]}')
              kinds=[pref] if pref else ['movie','tv']; best=None
              for kind in kinds:
                  r=s.get(f'https://www.themoviedb.org/search/{kind}?query={quote(item["query"])}&language=en-US',timeout=35); r.raise_for_status(); soup=BeautifulSoup(r.text,'html.parser')
                  seen=set(); links=[]
                  for a in soup.select(f'a[href^="/{kind}/"]'):
                      href=a.get('href','').split('?')[0]; m=re.match(fr'/{kind}/(\d+)',href)
                      if not m or m.group(1) in seen: continue
                      seen.add(m.group(1)); links.append(href)
                      if len(links)>=5: break
                  for href in links:
                      try: info=page_info(s,kind,href)
                      except Exception: continue
                      sim=difflib.SequenceMatcher(None,norm(item['query']),norm(info['sourceTitle'])).ratio(); y=str(item['year']) in info['body']; score=sim*10+(6 if y else 0)
                      if best is None or score>best[0]: best=(score,info)
                      if sim>=.9 and y: return info
              if not best: raise RuntimeError('no match')
              return best[1]
          manual={'Star Trek: The Cage':'Captain Christopher Pike and the Enterprise investigate a distress call from Talos IV, where Pike is captured by powerful telepathic inhabitants who create elaborate illusions around the human survivor Vina.'}
          def work(ix_item):
              ix,item=ix_item; s=sess(); info=choose(item)
              if item['title'] in manual: info['overview']=manual[item['title']]
              if not info['imageUrl']: raise RuntimeError('no poster')
              r=s.get(info['imageUrl'],timeout=45); r.raise_for_status(); im=Image.open(io.BytesIO(r.content)).convert('RGB'); orig=im.size; im.thumbnail((1000,1500),Image.Resampling.LANCZOS)
              slug=slugify(item['displayTitle'])+'-'+str(item['year']); im.save(posters/f'{slug}.webp','WEBP',quality=88,method=6)
              return ix,{**item,**{k:v for k,v in info.items() if k!='body'},'slug':slug,'originalSize':orig,'savedSize':im.size}
          results=[None]*len(items); errors=[]
          with ThreadPoolExecutor(max_workers=10) as ex:
              futs={ex.submit(work,p):p for p in enumerate(items)}
              for fut in as_completed(futs):
                  ix,item=futs[fut]
                  try:
                      i,rec=fut.result(); results[i]=rec; print(f'{i+1:03d} OK {item["displayTitle"]} -> {rec["sourceType"]}:{rec["sourceId"]} {rec["sourceTitle"]}')
                  except Exception as e:
                      errors.append({'index':ix,'item':item,'error':repr(e)}); print(f'{ix+1:03d} FAIL {item["displayTitle"]}: {e}')
          good=[x for x in results if x]
          json.dump(good,open(out/'metadata.json','w',encoding='utf-8'),ensure_ascii=False,indent=2); json.dump(errors,open(out/'errors.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          W,H=260,430; cols,rows=5,4
          for page,start in enumerate(range(0,len(good),20),1):
              batch=good[start:start+20]; sheet=Image.new('RGB',(W*cols,H*rows),'black')
              for j,rec in enumerate(batch):
                  im=Image.open(posters/f'{rec["slug"]}.webp').convert('RGB'); im.thumbnail((W-20,H-75),Image.Resampling.LANCZOS); cell=Image.new('RGB',(W,H),'#101010'); cell.paste(im,((W-im.width)//2,5)); d=ImageDraw.Draw(cell); d.text((7,H-61),f'{start+j+1}. {rec["displayTitle"]} ({rec["year"]})',fill='white'); d.text((7,H-39),f'{rec["sourceType"]}:{rec["sourceId"]} {rec["savedSize"][0]}x{rec["savedSize"][1]}',fill='#bbb'); sheet.paste(cell,((j%cols)*W,(j//cols)*H))
              sheet.save(out/f'CONTACT_{page:02d}.jpg','JPEG',quality=92)
          print('RESULTS',len(good),'ERRORS',len(errors))
          if errors: print(json.dumps(errors,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: remaining-103-qc-fast
          path: remaining-qc-fast
          if-no-files-found: error
