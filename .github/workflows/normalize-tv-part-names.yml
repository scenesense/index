name: Normalize TV multipart naming
on:
  push:
    paths:
      - '.github/workflows/normalize-tv-part-names.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce SceneSense multipart title convention
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('data/series')
          changes = []

          # SceneSense hard rule: multipart suffixes are always parenthesized words.
          # Examples: Title (Part One), Title (Part Two).
          suffixes = [
              (re.compile(r'\s*(?:[:\-]\s*)?(?:Part|Pt\.?)\s*(?:I|1|One)\s*$', re.I), ' (Part One)'),
              (re.compile(r'\s*(?:[:\-]\s*)?(?:Part|Pt\.?)\s*(?:II|2|Two)\s*$', re.I), ' (Part Two)'),
              (re.compile(r'\s*(?:[:\-]\s*)?(?:Part|Pt\.?)\s*(?:III|3|Three)\s*$', re.I), ' (Part Three)'),
              (re.compile(r'\s*(?:[:\-]\s*)?(?:Part|Pt\.?)\s*(?:IV|4|Four)\s*$', re.I), ' (Part Four)'),
          ]

          def normalize_title(title):
              original = str(title or '')
              if re.search(r'\(Part (?:One|Two|Three|Four)\)\s*$', original):
                  return original
              for pattern, replacement in suffixes:
                  if pattern.search(original):
                      base = pattern.sub('', original).rstrip()
                      return base + replacement
              return original

          for path in sorted(root.rglob('season-[0-9][0-9].json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              touched = False
              for ep in data.get('episodes', []):
                  old = str(ep.get('title') or '')
                  new = normalize_title(old)
                  if new != old:
                      ep['title'] = new
                      changes.append(f'{path}: {ep.get("id")}: {old} -> {new}')
                      touched = True
              if touched:
                  path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          # Update the integration guide so future database audits cannot override the house style again.
          guide_path = Path('TV_SERIES_INTEGRATION_GUIDE.md')
          if guide_path.exists():
              guide = guide_path.read_text(encoding='utf-8')
              marker = '### Multipart episode title convention'
              rule = '''\n\n### Multipart episode title convention\n\nSceneSense has a hard, site-wide title-style rule for multipart episode names:\n\n```text\nTitle (Part One)\nTitle (Part Two)\nTitle (Part Three)\nTitle (Part Four)\n```\n\nDo not replace this house style with database variants such as `Part I`, `Part II`, `Part 1`, `Part 2`, `Pt. 1`, `Pt. 2`, colon-separated forms, or hyphen-separated forms. External databases may verify the underlying title wording and punctuation, but this multipart suffix convention always wins.\n'''
              if marker not in guide:
                  guide_path.write_text(guide.rstrip() + rule + '\n', encoding='utf-8')

          # Assert no non-house-style multipart suffix survives in core TV titles.
          forbidden = re.compile(r'(?:[:\-]\s*|\s+)(?:Part|Pt\.?)\s*(?:I|II|III|IV|1|2|3|4|One|Two|Three|Four)\s*$', re.I)
          bad = []
          for path in sorted(root.rglob('season-[0-9][0-9].json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              for ep in data.get('episodes', []):
                  title = str(ep.get('title') or '')
                  if forbidden.search(title) and not re.search(r'\(Part (?:One|Two|Three|Four)\)\s*$', title):
                      bad.append(f'{path}:{ep.get("id")}:{title}')
          if bad:
              raise RuntimeError('Non-uniform multipart titles remain:\n' + '\n'.join(bad))

          print('MULTIPART TITLE CORRECTIONS:')
          for line in changes:
              print(line)
          print('TOTAL:', len(changes))
          PY
      - name: Commit normalization
        shell: bash
        run: |
          git config user.name "soap2"
          git config user.email "46655904+soap2@users.noreply.github.com"
          git rm -f .github/workflows/normalize-tv-part-names.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Enforce TV multipart title convention"
          git push origin HEAD:main
