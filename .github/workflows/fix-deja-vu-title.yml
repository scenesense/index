name: Fix Déjà Vu title

on:
  push:
    paths:
      - '.github/workflows/fix-deja-vu-title.yml'

permissions:
  contents: write

jobs:
  fix-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct Déjà Vu title
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data/movies.json')
          s = p.read_text(encoding='utf-8')
          old = '"id": "deja-vu-2006",\n      "title": "Deja Vu"'
          new = '"id": "deja-vu-2006",\n      "title": "Déjà Vu"'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one Deja Vu record, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "No change required"
            exit 0
          fi
          git config user.name "SceneSense maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add data/movies.json
          git commit -m "Correct Déjà Vu title"
          git push origin HEAD:main
