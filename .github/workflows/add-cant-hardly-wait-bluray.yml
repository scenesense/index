name: Add Can't Hardly Wait Blu-ray badge

on:
  push:
    paths:
      - '.github/workflows/add-cant-hardly-wait-bluray.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Can't Hardly Wait to UHD Blu-ray set
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          target = 'cant-hardly-wait-1998'
          ids = set()
          for path in [Path('data/movies.json'), Path('data/movies-additions-20260830.json')]:
              payload = json.loads(path.read_text(encoding='utf-8'))
              ids.update(movie.get('id') for movie in payload.get('movies', []))
          if target not in ids:
              raise RuntimeError(f'Movie ID not found: {target}')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'const BLURAY_IDS=new Set(['
          start = s.find(marker)
          if start < 0:
              raise RuntimeError('BLURAY_IDS set not found')
          end = s.find(']);', start)
          if end < 0:
              raise RuntimeError('BLURAY_IDS set terminator not found')
          block = s[start:end+3]
          if f'"{target}"' in block:
              raise RuntimeError('Target is already in BLURAY_IDS')
          new_block = block[:-3] + f',"{target}"]);'
          s = s[:start] + new_block + s[end+3:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "SceneSense maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add Can't Hardly Wait UHD Blu-ray badge"
          git push origin HEAD:main
