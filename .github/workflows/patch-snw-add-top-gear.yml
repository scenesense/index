name: Patch SNW and add Top Gear placeholder

on:
  push:
    paths:
      - '.github/workflows/patch-snw-add-top-gear.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch SNW and create Top Gear placeholder
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save_min(path, data):
              Path(path).write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          additions_path = Path('data/series/index-additions-sep09-tc.json')
          payload = load(additions_path)

          found_snw = False
          for series in payload.get('series', []):
              if series.get('id') == 'star-trek-strange-new-worlds-2019':
                  series['episodeCount'] = 'TBD'
                  found_snw = True
                  break
          if not found_snw:
              raise SystemExit('SNW catalogue entry not found')

          top_gear = {
              'id': 'top-gear-2002',
              'type': 'series',
              'title': 'Top Gear',
              'yearStart': 2002,
              'yearEnd': 2017,
              'seasonCount': 22,
              'episodeCount': 'TBD',
              'scoringEntryCount': 0,
              'genres': ['Adventure', 'Comedy', 'Documentary'],
              'actors': ['Jeremy Clarkson', 'Richard Hammond', 'James May'],
              'description': 'Jeremy Clarkson, Richard Hammond and James May test cars, tackle ambitious motoring challenges and take increasingly elaborate road trips, mixing serious driving with engineering experiments, races and the trio’s competitive refusal to make anything straightforward.',
              'collectionScope': 'Custom 22-season SceneSense placeholder for the 2002–2017 Clarkson, Hammond and May Top Gear collection. Episode counts and episode rows remain intentionally pending until the collection media is mapped.',
              'score': None,
              'questionsVersion': 'tv-v1',
              'seasons': [
                  {'number': n, 'episodeCount': 'TBD', 'scoringEntryCount': 0}
                  for n in range(1, 23)
              ]
          }

          payload['series'] = [s for s in payload.get('series', []) if s.get('id') != 'top-gear-2002']
          payload['series'].append(top_gear)
          save_min(additions_path, payload)

          root = Path('data/series/top-gear')
          root.mkdir(parents=True, exist_ok=True)

          manifest = {
              'version': 1,
              'seriesId': 'top-gear-2002',
              'status': 'deployed',
              'series': 'Top Gear',
              'seasons': 22,
              'episodes': 'TBD',
              'scoringRows': 0,
              'yearStart': 2002,
              'yearEnd': 2017,
              'notes': 'Placeholder limited to the requested 22-season Clarkson, Hammond and May Top Gear collection. Episode grouping, counts, runtimes and scoring rows are intentionally unset until the collection media is mapped.'
          }
          (root / 'integration-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for n in range(1, 23):
              season = {
                  'seriesId': 'top-gear-2002',
                  'season': n,
                  'episodes': [],
                  'episodeCount': 0,
                  'episodeCountStatus': 'unknown'
              }
              meta = {
                  'version': 1,
                  'seriesId': 'top-gear-2002',
                  'season': n,
                  'description': f'Season {n:02d} placeholder for the 2002–2017 Clarkson, Hammond and May Top Gear collection. Episode mapping and descriptions remain TBD until the collection media is integrated.',
                  'score': None,
                  'questionsVersion': 'tv-v1',
                  'scores': {},
                  'episodes': {}
              }
              save_min(root / f'season-{n:02d}.json', season)
              save_min(root / f'season-{n:02d}-meta.json', meta)
          PY

      - name: Commit catalogue changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/series/index-additions-sep09-tc.json data/series/top-gear
          git diff --cached --quiet && exit 0
          git commit -m 'Set SNW episode total to TBD and add Top Gear placeholder'
          git push
