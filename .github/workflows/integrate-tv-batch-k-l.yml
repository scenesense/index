name: Integrate TV batch K-L
on:
  push:
    paths:
      - '.github/workflows/integrate-tv-batch-k-l.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild, integrate and audit six series
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          sed -i 's/"name": "\.\.\. We Have a Lot to Talk About"/"name": "We Have a Lot to Talk About"/' tmp-tv-batch-research/lois-and-clark-s03.json
          python .tmp-rebuild-tv-batch.py
          rm -f tv-batch-research.tmp.json
          rm -rf tmp-tv-batch-research
          rm -f .github/workflows/fetch-tv-batch-research.yml
          rm -f .tmp-tv-batch-payload.b64 .tmp-integrate-tv-batch.py .tmp-repair-tv-payload.py .tmp-rebuild-tv-batch.py
          rm -f .github/workflows/integrate-tv-batch-k-l.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate six TV series batch'
          git push origin main
