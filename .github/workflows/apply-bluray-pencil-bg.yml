name: Apply Blu-ray pencil background

on:
  push:
    paths:
      - '.github/workflows/apply-bluray-pencil-bg.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply black pencil scribble backing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '.blurayBadge{position:absolute;left:10px;bottom:10px;z-index:2;display:block;width:96px;height:50px;object-fit:contain;object-position:left center;filter:drop-shadow(0 8px 15px rgba(0,0,0,.55));pointer-events:none}'
          new = '.blurayBadge{position:absolute;left:6px;bottom:6px;z-index:2;display:block;width:116px;height:64px;box-sizing:border-box;padding:8px 10px 7px;object-fit:contain;object-position:center;pointer-events:none;background:repeating-linear-gradient(166deg,rgba(0,0,0,.98) 0 4px,rgba(0,0,0,0) 4px 7px),repeating-linear-gradient(173deg,rgba(0,0,0,.72) 0 3px,rgba(0,0,0,0) 3px 9px),repeating-linear-gradient(159deg,rgba(0,0,0,.38) 0 2px,rgba(0,0,0,0) 2px 11px);clip-path:polygon(2% 18%,10% 8%,23% 12%,35% 4%,48% 10%,62% 5%,76% 12%,95% 8%,91% 24%,99% 36%,92% 49%,98% 63%,89% 78%,96% 91%,78% 88%,66% 97%,49% 90%,34% 96%,20% 87%,4% 92%,9% 74%,1% 61%,7% 48%,2% 33%);filter:drop-shadow(0 8px 15px rgba(0,0,0,.55))}'
          if text.count(old) != 1:
              raise RuntimeError(f'Expected Blu-ray badge CSS exactly once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "SceneSense maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Give Blu-ray badges black pencil backing"
          git push origin HEAD:main
