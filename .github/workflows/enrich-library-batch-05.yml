name: Enrich SceneSense library batch 05
on:
  push:
    paths:
      - '.github/workflows/enrich-library-batch-05.yml'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configure git
        run: |
          git config user.name "SceneSense Library Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Install tools
        run: python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Enrich final 6 records
        run: |
          python - <<'PY'
          import io, json, re, subprocess, time
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          DATA=Path('data/movies-additions-20260830.json')
          META=Path('data/enrichment-remaining-20260831.json')
          POSTERS=Path('assets/posters'); POSTERS.mkdir(parents=True,exist_ok=True)
          TARGETS=['when-we-first-met-2018','white-collar-2009','wicker-park-2004','win-a-date-with-tad-hamilton-2004','wonder-woman-2017','youve-got-mail-1998']
          IDS={'when-we-first-met-2018':433310,'white-collar-2009':21510,'wicker-park-2004':11208,'win-a-date-with-tad-hamilton-2004':13476,'wonder-woman-2017':297762,'youve-got-mail-1998':9489}
          data=json.load(DATA.open(encoding='utf-8')); meta=json.load(META.open(encoding='utf-8'))
          by={m['id']:m for m in data['movies']}; assert len(by)==len(data['movies'])
          assert all(x in by and x in meta for x in TARGETS)
          locked={mid:{k:json.loads(json.dumps(by[mid].get(k))) for k in ('runtimeMinutes','runtimeSeconds','runtimeExact','version','ratings')} for mid in TARGETS}
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 SceneSenseLibraryBot/1.0'
          retry=Retry(total=6,connect=4,read=4,status=6,backoff_factor=1.2,status_forcelist=(429,500,502,503,504),allowed_methods=frozenset(['GET']),respect_retry_after_header=True)
          s.mount('https://',HTTPAdapter(max_retries=retry))
          def get(u):
            r=s.get(u,timeout=45); r.raise_for_status(); time.sleep(.12); return r
          def cast(soup):
            out=[]
            for li in soup.select('ol.people.scroller li.card, ol.people li.card'):
              a=li.select_one('p a')
              if a:
                n=a.get_text(' ',strip=True)
                if n and n not in out: out.append(n)
              if len(out)==5: break
            return out
          def poster(soup):
            img=soup.select_one('div.poster img, img.poster')
            if not img:return None
            for raw in (img.get('src',''),img.get('data-src',''),img.get('srcset',''),img.get('data-srcset','')):
              for tok in raw.split(','):
                mm=re.search(r'/([^/?,]+\.(?:jpg|png))(?:\s|\?|$)',tok.strip())
                if mm:return mm.group(1)
          def save(raw,dest): Image.open(io.BytesIO(raw)).convert('RGB').save(dest,'WEBP',quality=92,method=6)
          for mid in TARGETS:
            m=by[mid]; ov=meta[mid]; print('===',m['title'],'===')
            if not str(m.get('description') or '').strip(): m['description']=ov['description']
            if not m.get('genres'): m['genres']=ov['genres']
            mode=ov.get('mode','movie')
            tid=IDS[mid]
            page=BeautifulSoup(get(f'https://www.themoviedb.org/{mode}/{tid}?language=en-US').text,'html.parser')
            c=cast(page)
            if len(c)<3: raise RuntimeError(f'{mid}: insufficient cast {c}')
            if not m.get('actors'): m['actors']=c[:5]
            if not m.get('tmdbId'): m['tmdbId']=tid
            dest=POSTERS/f'{mid}.webp'
            if not str(m.get('poster') or '').strip():
              p=poster(page)
              if not p: raise RuntimeError(f'{mid}: no poster')
              save(get(f'https://image.tmdb.org/t/p/w780/{p}').content,dest); m['poster']=str(dest)
            for k,v in locked[mid].items():
              if m.get(k)!=v: raise AssertionError(f'{mid}: locked {k} changed')
            if not m.get('description') or not m.get('genres') or len(m.get('actors') or [])<3 or not m.get('poster'): raise AssertionError(f'{mid}: incomplete')
          with DATA.open('w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          subprocess.run(['git','add',str(DATA),'assets/posters'],check=True)
          subprocess.run(['git','commit','-m','Enrich SceneSense library batch 05'],check=True)
          subprocess.run(['git','push','origin','main'],check=True)
          PY
      - name: Remove temporary batch workflow
        if: success()
        run: |
          git rm .github/workflows/enrich-library-batch-05.yml
          git commit -m "Remove completed enrichment batch workflow"
          git push origin main
