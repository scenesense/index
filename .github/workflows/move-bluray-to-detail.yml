name: Move Blu-ray badge to detail view

on:
  push:
    paths:
      - '.github/workflows/move-bluray-to-detail.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move format badge to detail score area
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # 1) Remove thumbnail/4K CSS and add detail-only badge styling.
          css_pattern = re.compile(r'\.format4k\{[^}]*\}\.format4kBlue\{[^}]*\}\.blurayBadge\{[^}]*\}')
          detail_css = '.scorePrimary{display:flex;flex-direction:column;align-items:flex-start;gap:7px}.detailBlurayBadge{display:block;width:118px;height:44px;object-fit:contain;object-position:left center;filter:drop-shadow(0 7px 14px rgba(0,0,0,.48))}.detailBlurayBadge[hidden]{display:none!important}'
          text, n = css_pattern.subn(detail_css, text, count=1)
          if n != 1:
              raise RuntimeError(f'Expected format/badge CSS block once, found {n}')

          # 2) Put a detail-only Blu-ray image directly under the large score number.
          old_score = '<div class="scoreLine"><div class="overallScore" id="overallScore">—</div><div><div class="scoreCaption">overall score</div><div class="progressText" id="progressText">0 / 75 rated</div></div></div>'
          new_score = '<div class="scoreLine"><div class="scorePrimary"><div class="overallScore" id="overallScore">—</div><img id="detailBlurayBadge" class="detailBlurayBadge" src="assets/format-logos/BLURAY.webp" alt="UHD Blu-ray" hidden></div><div><div class="scoreCaption">overall score</div><div class="progressText" id="progressText">0 / 75 rated</div></div></div>'
          if text.count(old_score) != 1:
              raise RuntimeError(f'Expected scoreLine markup once, found {text.count(old_score)}')
          text = text.replace(old_score, new_score, 1)

          # 3) Preserve the same 22-film Blu-ray set, but remove every 4K text renderer.
          prefix = 'const BLUE_4K_IDS=new Set('
          start = text.find(prefix)
          if start < 0:
              raise RuntimeError('BLUE_4K_IDS set not found')
          list_start = start + len(prefix)
          list_end = text.find(');const BLURAY_IDS=BLUE_4K_IDS;', list_start)
          if list_end < 0:
              raise RuntimeError('BLURAY_IDS alias not found')
          id_list = text[list_start:list_end]
          block_end_marker = 'function genresFor(movie)'
          block_end = text.find(block_end_marker, list_end)
          if block_end < 0:
              raise RuntimeError('genresFor marker not found')
          replacement = (
              'const BLURAY_IDS=new Set(' + id_list + ');'
              'function cardMetaMarkup(movie){return `${movie.year} · ${movie.runtimeMinutes} min · ${escapeHtml(movie.version)}`}'
              'function detailMetaMarkup(movie){return `${movie.year} · ${escapeHtml(runtimeText(movie))} · ${escapeHtml(movie.version)}`}'
          )
          text = text[:start] + replacement + text[block_end:]

          # 4) Remove all thumbnail logo insertion code.
          old_badge_fn = 'function applyBlurayBadge(card,movie){const wrap=card.querySelector(".posterWrap");if(!wrap)return;let badge=wrap.querySelector(".blurayBadge");if(BLURAY_IDS.has(movie?.id)){if(!badge){badge=document.createElement("img");badge.className="blurayBadge";badge.src="assets/format-logos/BLURAY.webp";badge.alt="UHD Blu-ray";badge.loading="lazy";wrap.append(badge)}}else badge?.remove()}'
          if text.count(old_badge_fn) != 1:
              raise RuntimeError(f'Expected thumbnail badge function once, found {text.count(old_badge_fn)}')
          text = text.replace(old_badge_fn, '', 1)
          if text.count('applyBlurayBadge(card,movie);') != 1:
              raise RuntimeError('Expected thumbnail badge call once')
          text = text.replace('applyBlurayBadge(card,movie);', '', 1)

          # 5) Toggle the detail badge only for the 22 Blu-ray films.
          old_detail = '$("detailMeta").innerHTML=detailMetaMarkup(movie);requestAnimationFrame(fitDetailMeta);'
          new_detail = '$("detailMeta").innerHTML=detailMetaMarkup(movie);const bluray=$("detailBlurayBadge");if(bluray)bluray.hidden=!BLURAY_IDS.has(movie?.id);requestAnimationFrame(fitDetailMeta);'
          if text.count(old_detail) != 1:
              raise RuntimeError(f'Expected detail meta renderer once, found {text.count(old_detail)}')
          text = text.replace(old_detail, new_detail, 1)

          # Safety assertions: no visible 4K renderer or thumbnail Blu-ray badge remains.
          if 'fourKMarkup' in text or 'format4kBlue' in text or 'class="blurayBadge"' in text:
              raise RuntimeError('Old 4K/thumbnail Blu-ray renderer survived patch')
          if 'detailBlurayBadge' not in text or 'BLURAY_IDS' not in text:
              raise RuntimeError('Detail Blu-ray renderer missing after patch')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "SceneSense maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Move Blu-ray badges to film detail score area"
          git push origin HEAD:main
