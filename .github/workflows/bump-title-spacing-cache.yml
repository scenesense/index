name: Refresh title spacing cache
on:
  push:
    paths:
      - .github/workflows/bump-title-spacing-cache.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump stylesheet cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='styles.css?v=20260830-13'
          new='styles.css?v=20260830-14'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit cache refresh
        run: |
          git config user.name "SceneSense Library Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh card title spacing styles"
          git push
