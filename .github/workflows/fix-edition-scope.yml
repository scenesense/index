name: Fix TV edition scope
on:
  push:
    paths:
      - '.github/workflows/fix-edition-scope.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply edition scope correction
        run: |
          set -e
          git pull --ff-only origin main
          python .tmp-fix-edition-scope.py
          rm .tmp-fix-edition-scope.py
          rm .github/workflows/fix-edition-scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          bad=$(git diff --cached --name-only | grep -Ev '^(data/series/index\.json|series-tv-loader\.js|audio-metadata-base\.js|data/series/firefly/season-01-meta\.json|data/series/buck-rogers-in-the-25th-century/season-01-meta\.json|TV_SERIES_INTEGRATION_GUIDE\.md|\.tmp-fix-edition-scope\.py|\.github/workflows/fix-edition-scope\.yml)$' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
          git diff --cached --name-only
          git commit -m "Correct TV edition scope semantics"
          git push origin main
