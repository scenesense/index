name: Apply requested title and display fixes
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-display-fixes.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply exact requested replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('data/movies-additions-20260830.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          next(m for m in d['movies'] if m['id']=='heaven-can-wait-1943')['poster'] = 'assets/posters/heaven-can-wait-1943.jpg'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.cardTitle,.ratingName,.fieldLabel{font-weight:600}', '.cardTitle,.ratingName,.fieldLabel{font-weight:600}.cardTitle{white-space:nowrap;overflow:hidden;text-overflow:clip}', 1)
          s = s.replace('letter-spacing:0!important;white-space:nowrap}.cardGenres', 'letter-spacing:0!important;white-space:nowrap;overflow:hidden;text-overflow:clip}.cardGenres', 1)
          s = s.replace('object-fit:contain!important;object-position:center!important', 'object-fit:fill!important;object-position:center!important', 1)
          old='function splitDisplayTitle(title){const raw=String(title||"");const colon=raw.indexOf(":");if(colon<0)return{main:raw,subtitle:""};return{main:raw.slice(0,colon).trim(),subtitle:raw.slice(colon+1).trim()}}'
          new='function splitDisplayTitle(title){const raw=String(title||"");const custom={"Indiana Jones and the Raiders of the Lost Ark":{main:"Indiana Jones",subtitle:"Raiders of the Lost Ark"},"Indiana Jones and the Last Crusade":{main:"Indiana Jones",subtitle:"The Last Crusade"}};if(custom[raw])return custom[raw];const colon=raw.indexOf(":");if(colon<0)return{main:raw,subtitle:""};return{main:raw.slice(0,colon).trim(),subtitle:raw.slice(colon+1).trim()}}'
          if old not in s: raise SystemExit('splitDisplayTitle target missing')
          s=s.replace(old,new,1)
          old='function movieSearchText(movie){return[movie.title,movie.year,movie.version,...genresFor(movie),...(movie.actors||[])].join(" ").toLowerCase()}function runtimeSortValue(movie){return Number(movie.runtimeSeconds ?? ((movie.runtimeMinutes||0)*60))}function compareLibraryMovies(a,b){const titleAsc=a.title.localeCompare(b.title);switch(sortMode){case"score-asc":{const sa=overallScore(a)??0,sb=overallScore(b)??0;return sa!==sb?sa-sb:titleAsc}case"title":return titleAsc;case"title-desc":return b.title.localeCompare(a.title);case"year":return a.year-b.year||titleAsc;case"year-desc":return b.year-a.year||titleAsc;case"runtime":return runtimeSortValue(a)-runtimeSortValue(b)||titleAsc;case"runtime-desc":return runtimeSortValue(b)-runtimeSortValue(a)||titleAsc;case"score":default:{const sa=overallScore(a)??0,sb=overallScore(b)??0;return sb!==sa?sb-sa:titleAsc}}}'
          new='function movieSearchText(movie){return[movie.title,movie.year,movie.version,...genresFor(movie),...(movie.actors||[])].join(" ").toLowerCase()}function runtimeSortValue(movie){return Number(movie.runtimeSeconds ?? ((movie.runtimeMinutes||0)*60))}function franchiseTieOrder(a,b){const indy={"indiana-jones-and-the-raiders-of-the-lost-ark-1981":1,"indiana-jones-and-the-last-crusade-1989":2};return indy[a.id]&&indy[b.id]?indy[a.id]-indy[b.id]:0}function compareLibraryMovies(a,b){const titleAsc=a.title.localeCompare(b.title);switch(sortMode){case"score-asc":{const sa=overallScore(a)??0,sb=overallScore(b)??0;return sa!==sb?sa-sb:(franchiseTieOrder(a,b)||titleAsc)}case"title":return titleAsc;case"title-desc":return b.title.localeCompare(a.title);case"year":return a.year-b.year||titleAsc;case"year-desc":return b.year-a.year||titleAsc;case"runtime":return runtimeSortValue(a)-runtimeSortValue(b)||titleAsc;case"runtime-desc":return runtimeSortValue(b)-runtimeSortValue(a)||titleAsc;case"score":default:{const sa=overallScore(a)??0,sb=overallScore(b)??0;return sb!==sa?sb-sa:(franchiseTieOrder(a,b)||titleAsc)}}}'
          if old not in s: raise SystemExit('compareLibraryMovies target missing')
          s=s.replace(old,new,1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'SceneSense Library Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html data/movies-additions-20260830.json
          git commit -m 'Fix title wrapping, Indy display order, and poster fit'
          git push origin main
