name: Fix He-Man title casing
on:
  push:
    paths:
      - '.github/workflows/fix-heman-title-case.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore scan-authoritative He-Man casing
        run: |
          python - <<'PY'
          import pathlib
          paths=[
            pathlib.Path('data/series/he-man-and-the-masters-of-the-universe/season-01.json'),
            pathlib.Path('data/series/he-man-and-the-masters-of-the-universe/season-01-meta.json'),
          ]
          changed=0
          for p in paths:
              txt=p.read_text(encoding='utf-8')
              n=txt.count('Quest for He-man')
              txt=txt.replace('Quest for He-man','Quest for He-Man')
              p.write_text(txt,encoding='utf-8')
              changed+=n
          if changed!=2:
              raise AssertionError(f'expected exactly 2 He-man casing replacements, got {changed}')
          for p in pathlib.Path('data/series/he-man-and-the-masters-of-the-universe').glob('*.json'):
              if 'He-man' in p.read_text(encoding='utf-8'):
                  raise AssertionError(f'bad He-man casing remains in {p}')
          PY
      - name: Remove one-off workflow and commit
        run: |
          git rm .github/workflows/fix-heman-title-case.yml
          git config user.name soap2
          git config user.email 46655904+soap2@users.noreply.github.com
          git add -A
          git commit -m 'Restore He-Man title casing from collection scan'
          git push
