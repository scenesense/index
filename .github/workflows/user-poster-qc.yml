name: Deploy user poster choices

on:
  push:
    paths:
      - USER_POSTER_QC_TRIGGER

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - name: Convert exact user artwork to local WebP
        run: |
          python - <<'PY'
          import io
          from pathlib import Path
          import requests
          from PIL import Image

          posters={
            'aliens-1986':'https://lumiere-a.akamaihd.net/v1/images/pp_aliens_3133_da3ef017.jpeg',
            'a-little-romance-1979':'https://m.media-amazon.com/images/M/MV5BNjIyNTE0Y2EtYjE3Zi00NTA4LTgyMjUtMmU3MDQwZjIzYzM3XkEyXkFqcGc@._V1_.jpg',
            'beauty-and-the-beast-1991':'https://m.media-amazon.com/images/M/MV5BYTY3NDg2YzktYWFjZC00MTExLTlmZDctMGY3MWYzZTlkYTNiXkEyXkFqcGc@._V1_.jpg',
            'cant-hardly-wait-1998':'https://image.tmdb.org/t/p/original/r3a5gGWfS0SDS9nriNrJzSSrErf.jpg'
          }
          out=Path('assets/posters')
          out.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'})
          for slug,url in posters.items():
              r=s.get(url,timeout=60,allow_redirects=True); r.raise_for_status()
              im=Image.open(io.BytesIO(r.content)).convert('RGB')
              print('SOURCE',slug,im.size,url)
              if im.width>1000:
                  nh=round(im.height*1000/im.width)
                  im=im.resize((1000,nh),Image.Resampling.LANCZOS)
              dest=out/f'{slug}.webp'
              im.save(dest,'WEBP',quality=82,method=6)
              print('SAVED',dest,im.size,dest.stat().st_size)
          PY
      - name: Commit only four approved posters and remove one-shot machinery
        run: |
          git config user.name 'SceneSense Poster Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/posters/aliens-1986.webp assets/posters/a-little-romance-1979.webp assets/posters/beauty-and-the-beast-1991.webp assets/posters/cant-hardly-wait-1998.webp
          git rm .github/workflows/user-poster-qc.yml USER_POSTER_QC_TRIGGER
          git commit -m 'Use user-selected poster artwork for four films'
          git push
