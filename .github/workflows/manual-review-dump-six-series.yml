name: Manual review dump six-series plots
on:
  push:
    paths:
      - '.github/workflows/manual-review-dump-six-series.yml'
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print every season and episode plot for manual audit
        shell: bash
        run: |
          python - <<'PY'
          import json, glob
          dirs=['kevin-from-work','the-law-according-to-lidia-poet','eva-lasting','last-resort','legend-of-the-seeker','lois-and-clark']
          total=0
          for d in dirs:
            print('\n'+'='*100)
            print('SERIES',d)
            for mp in sorted(glob.glob(f'data/series/{d}/season-*-meta.json')):
              meta=json.load(open(mp,encoding='utf-8'))
              season=int(meta['season'])
              cp=f'data/series/{d}/season-{season:02d}.json'
              core=json.load(open(cp,encoding='utf-8'))
              titles={e['id']:e['title'] for e in core.get('episodes',[])}
              print('\nSEASON',season)
              print('SEASON PLOT:',meta.get('description',''))
              for eid,m in meta.get('episodes',{}).items():
                total+=1
                print(f'[{d} S{season:02d} {eid}] {titles.get(eid,"?")}')
                print(m.get('description',''))
          print('\nTOTAL EPISODES',total)
          if total!=216: raise SystemExit('count mismatch')
          PY
