name: Test TMDB enrichment
on:
  push:
    paths:
      - '.github/workflows/test-tmdb-enrichment.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test public TMDB scraping
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import requests, re
          from bs4 import BeautifulSoup
          from urllib.parse import quote, urljoin

          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 SceneSense/1.0'
          base='https://www.themoviedb.org'
          tests=[('Master and Commander',2003),('Me Before You',2016),('Much Ado About Christmas',2021)]
          for title,year in tests:
              u=f'{base}/search/movie?query={quote(title)}&language=en-US'
              r=s.get(u,timeout=30); print('\nSEARCH',title,r.status_code,r.url)
              soup=BeautifulSoup(r.text,'html.parser')
              links=[]
              for a in soup.select('a[href^="/movie/"]'):
                  href=a.get('href','')
                  txt=' '.join(a.stripped_strings)
                  if href not in [x[0] for x in links]: links.append((href,txt))
              print('links',links[:8])
              chosen=None
              for href,txt in links:
                  rr=s.get(urljoin(base,href),timeout=30)
                  ss=BeautifulSoup(rr.text,'html.parser')
                  h=ss.select_one('section.inner_content h2 a, div.title h2 a, h2 a')
                  page_title=h.get_text(' ',strip=True) if h else ss.title.get_text(' ',strip=True)
                  date=ss.select_one('span.release')
                  y=int(re.search(r'(19|20)\d{2}',date.get_text(' ',strip=True)).group()) if date and re.search(r'(19|20)\d{2}',date.get_text(' ',strip=True)) else None
                  if y==year or str(year) in page_title:
                      chosen=(href,ss,page_title,y); break
              print('chosen',chosen[0] if chosen else None, chosen[2:] if chosen else None)
              if not chosen: continue
              href,ss,pt,y=chosen
              overview=ss.select_one('div.overview p')
              print('overview', overview.get_text(' ',strip=True) if overview else None)
              genres=[a.get_text(' ',strip=True) for a in ss.select('span.genres a')]
              print('genres',genres)
              cast=[]
              for li in ss.select('ol.people.scroller li.card')[:8]:
                  p=li.select_one('p a')
                  if p: cast.append(p.get_text(' ',strip=True))
              print('cast',cast[:5])
              poster=ss.select_one('div.poster img, img.poster')
              print('poster attrs', poster.attrs if poster else None)
          PY
