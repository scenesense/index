name: Test TMDB enrichment
on:
  push:
    paths:
      - '.github/workflows/test-tmdb-enrichment.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve all enrichment targets
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json,re,time,requests
          from bs4 import BeautifulSoup
          from urllib.parse import quote,urljoin
          ov=json.load(open('data/enrichment-remaining-20260831.json',encoding='utf-8'))
          data=json.load(open('data/movies-additions-20260830.json',encoding='utf-8'))
          by={m['id']:m for m in data['movies']}
          direct={'minuscule-2013':140870,'miracle-2004':14292}
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 SceneSenseResolver/1.0'
          BASE='https://www.themoviedb.org'
          def get(u):
              r=s.get(u,timeout=30); r.raise_for_status(); time.sleep(.03); return r
          def year(soup):
              for sel in ('span.release','span.release_date','span.tag.release_date','div.facts'):
                  e=soup.select_one(sel)
                  if e:
                      m=re.search(r'\b(19|20)\d{2}\b',e.get_text(' ',strip=True))
                      if m:return int(m.group())
              t=soup.title.get_text(' ',strip=True) if soup.title else ''
              m=re.search(r'\b(19|20)\d{2}\b',t); return int(m.group()) if m else None
          bad=[]
          for i,(mid,x) in enumerate(ov.items(),1):
              m=by[mid]; mode=x['mode']
              if mode=='manual':
                  print(i,mid,'MANUAL'); continue
              if mid in direct:
                  href=f'/{mode}/{direct[mid]}?language=en-US'
                  soup=BeautifulSoup(get(BASE+href).text,'html.parser')
                  print(i,mid,'DIRECT',direct[mid],year(soup)); continue
              q=x['query']; u=f'{BASE}/search/{mode}?query={quote(q)}&language=en-US'
              soup=BeautifulSoup(get(u).text,'html.parser')
              pat=re.compile(rf'^/{mode}/(\d+)(?:-|\?|$)')
              c=[]
              for a in soup.select(f'a[href^="/{mode}/"]'):
                  h=a.get('href','')
                  if pat.match(h) and h not in c:c.append(h)
              found=None; inspected=[]
              for h in c[:15]:
                  p=BeautifulSoup(get(urljoin(BASE,h)).text,'html.parser'); y=year(p); inspected.append((h,y))
                  if y==m['year']:
                      found=(h,int(pat.match(h).group(1))); break
              if found: print(i,mid,'OK',found[1],found[0])
              else:
                  print(i,mid,'FAIL',m['year'],q,inspected)
                  bad.append((mid,m['year'],q,inspected))
          print('UNRESOLVED',len(bad))
          for b in bad:print('BAD',b)
          if bad: raise SystemExit(1)
          PY
