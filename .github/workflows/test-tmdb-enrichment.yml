name: Test TMDB enrichment
on:
  push:
    paths:
      - '.github/workflows/test-tmdb-enrichment.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public TMDB poster gallery
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 SceneSense/1.0'
          u='https://www.themoviedb.org/movie/8619-master-and-commander-the-far-side-of-the-world/images/posters?image_language=en&language=en-US'
          r=s.get(u,timeout=30); print(r.status_code,r.url)
          soup=BeautifulSoup(r.text,'html.parser')
          seen=[]
          for img in soup.find_all('img'):
              src=img.get('src') or img.get('data-src') or ''
              srcset=img.get('srcset') or img.get('data-srcset') or ''
              if 'media.themoviedb.org/t/p/' in src or 'media.themoviedb.org/t/p/' in srcset:
                  item=(src,srcset,img.get('alt',''))
                  if item not in seen: seen.append(item)
          for i,x in enumerate(seen[:30],1): print(i,x)
          PY
