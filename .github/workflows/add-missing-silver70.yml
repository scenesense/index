name: Add missing SiLVER70 badges

on:
  push:
    paths:
      - '.github/workflows/add-missing-silver70.yml'

permissions:
  contents: write

jobs:
  add-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add missing SiLVER70 IDs
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          targets = {'scoop-2006','source-code-2011','wicker-park-2004'}
          found = set()
          for path in [Path('data/movies.json'), Path('data/movies-additions-20260830.json')]:
              data = json.loads(path.read_text(encoding='utf-8'))
              found.update(m.get('id') for m in data.get('movies', []) if m.get('id') in targets)
          if found != targets:
              raise SystemExit(f'Target validation failed: found={sorted(found)} expected={sorted(targets)}')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          m = re.search(r'const SILVER70_IDS=new Set\(\[(.*?)\]\);const CLARITY70_IDS=', s)
          if not m:
              raise SystemExit('Could not locate SILVER70_IDS set')
          body = m.group(1)
          existing = set(re.findall(r'"([^"]+)"', body))
          if targets & existing:
              raise SystemExit(f'One or more targets already present: {sorted(targets & existing)}')
          new_ids = ','.join(f'"{x}"' for x in ['scoop-2006','source-code-2011','wicker-park-2004'])
          new_body = body + ',' + new_ids
          s = s[:m.start(1)] + new_body + s[m.end(1):]

          m2 = re.search(r'const SILVER70_IDS=new Set\(\[(.*?)\]\);const CLARITY70_IDS=', s)
          ids = re.findall(r'"([^"]+)"', m2.group(1))
          if not targets.issubset(ids):
              raise SystemExit('Post-edit target validation failed')
          if len(ids) != len(set(ids)):
              raise SystemExit('Duplicate SILVER70 IDs detected')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "SceneSense maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add missing SiLVER70 badges"
          git push origin HEAD:main
