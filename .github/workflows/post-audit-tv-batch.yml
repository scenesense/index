name: Post-write audit TV batch
on:
  push:
    paths:
      - '.github/workflows/post-audit-tv-batch.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit committed six-series state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re

          expected = {
            'kevin-from-work-2015': (10,10,12693,'kevin-from-work'),
            'the-law-according-to-lidia-poet-2023': (18,18,54443,'the-law-according-to-lidia-poet'),
            'eva-lasting-2023': (45,45,121519,'eva-lasting'),
            'last-resort-2012': (13,13,33508,'last-resort'),
            'legend-of-the-seeker-2008': (44,43,114365,'legend-of-the-seeker'),
            'lois-and-clark-1993': (88,87,241631,'lois-and-clark'),
          }
          formats = {
            'kevin-from-work-2015': {1:'SiLVER70'},
            'the-law-according-to-lidia-poet-2023': {1:'CLARiTY70',2:'CLARiTY35',3:'CLARiTY35'},
            'eva-lasting-2023': {1:'CLARiTY35',2:'CLARiTY35',3:'CLARiTY35',4:'CLARiTY35'},
            'last-resort-2012': {1:'SiLVER70'},
            'legend-of-the-seeker-2008': {1:'SiLVER70',2:'SiLVER70'},
            'lois-and-clark-1993': {1:'SiLVER70',2:'SiLVER70',3:'SiLVER70',4:'SiLVER70'},
          }
          expected_m = ['s01e01-02','s01e03','s01e04','s01e06','s01e07','s01e09','s01e10','s01e11','s01e12','s01e13','s01e14','s01e16','s01e17','s01e18','s01e19','s01e20','s01e21','s01e22','s02e01','s02e03','s02e04','s02e05','s02e06','s02e10','s02e12','s02e13','s02e14','s02e16','s02e17','s02e18','s02e19','s02e20','s02e21','s02e22','s03e01','s03e06','s03e07','s03e14','s03e15','s03e16','s03e17','s03e18','s03e19','s04e04','s04e14','s04e15','s04e16']

          issues=[]; plots=[]; batch=[0,0,0]
          cat=json.load(open('data/series/index-additions.json',encoding='utf-8'))
          by={x['id']:x for x in cat.get('series',[])}
          for sid,(ec,es,rt,folder) in expected.items():
            e=by.get(sid)
            if not e:
              issues.append('missing '+sid); continue
            got=(e.get('episodeCount'),e.get('scoringEntryCount'),e.get('runtimeSeconds'))
            if got!=(ec,es,rt): issues.append(f'catalog {sid} {got}')
            for i,v in enumerate(got): batch[i]+=v or 0
            if e.get('audio',{}).get('lossless') is not False: issues.append('lossless '+sid)
            if e.get('genres',[None])[0] in ('Fantasy','Crime'): issues.append('genre '+sid)
            if not os.path.exists(e.get('poster','')): issues.append('poster '+sid)
            sums=[0,0,0]
            for sc in e.get('seasons',[]):
              s=int(sc['number'])
              cp=f'data/series/{folder}/season-{s:02d}.json'; mp=f'data/series/{folder}/season-{s:02d}-meta.json'
              if not os.path.exists(cp) or not os.path.exists(mp): issues.append(f'missing {sid} S{s:02d}'); continue
              core=json.load(open(cp,encoding='utf-8')); meta=json.load(open(mp,encoding='utf-8'))
              eps=core.get('episodes',[])
              conceptual=sum(2 if '-' in str(x.get('number','')) else 1 for x in eps)
              scoring=len(eps); runtime=sum(int(x.get('runtimeSeconds') or 0) for x in eps)
              sums[0]+=conceptual; sums[1]+=scoring; sums[2]+=runtime
              if (conceptual,scoring)!=(sc.get('episodeCount'),sc.get('scoringEntryCount')): issues.append(f'counts {sid} S{s:02d}')
              if meta.get('format')!=formats[sid][s]: issues.append(f'format {sid} S{s:02d}')
              if len(str(meta.get('description','')).strip())<80: issues.append(f'season desc {sid} S{s:02d}')
              if sc.get('audio',{}).get('lossless') is not False: issues.append(f'season lossless {sid} S{s:02d}')
              ids=set()
              for ep in eps:
                eid=ep.get('id'); title=str(ep.get('title','')).strip()
                if eid in ids: issues.append(f'duplicate {sid} {eid}')
                ids.add(eid)
                if not title or re.match(r'^(Episode(?:\s|\s*#)|Untitled$)',title,re.I): issues.append(f'title {sid} {eid}')
                if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',str(ep.get('airDate',''))): issues.append(f'date {sid} {eid}')
                if int(ep.get('runtimeSeconds') or 0)<=0: issues.append(f'runtime {sid} {eid}')
                m=meta.get('episodes',{}).get(eid)
                if not m: issues.append(f'meta {sid} {eid}'); continue
                if (m.get('airDate'),m.get('runtimeSeconds'))!=(ep.get('airDate'),ep.get('runtimeSeconds')): issues.append(f'mismatch {sid} {eid}')
                desc=str(m.get('description','')).strip(); plots.append(desc)
                if len(desc)<100: issues.append(f'desc {sid} {eid}')
              if '16-bit' in json.dumps([core,meta],ensure_ascii=False): issues.append(f'16-bit {sid} S{s:02d}')
            if tuple(sums)!=(ec,es,rt): issues.append(f'sums {sid} {sums}')

          if tuple(batch)!=(218,216,578159): issues.append(f'batch {batch}')
          if len(plots)!=216 or len(set(plots))!=216: issues.append(f'plots {len(plots)}/{len(set(plots))}')

          lc=by['lois-and-clark-1993']
          if lc.get('audio')!={'layouts':['Stereo'],'lossless':False}: issues.append('Lois catalogue audio')
          if any(x.get('audio')!={'layouts':['Stereo'],'lossless':False} for x in lc.get('seasons',[])): issues.append('Lois season audio')
          lc3=json.load(open('data/series/lois-and-clark/season-03.json',encoding='utf-8'))
          x=next(z for z in lc3['episodes'] if z['id']=='s03e01')
          if (x['title'],x['runtimeSeconds'])!=('We Have a Lot to Talk About',2753): issues.append(f'Lois S03E01 {x}')
          lc3m=json.load(open('data/series/lois-and-clark/season-03-meta.json',encoding='utf-8'))
          if 'audio' in lc3m['episodes']['s03e01']: issues.append('Lois S03E01 override')
          flags=json.load(open('data/series/lois-and-clark/episode-flags.json',encoding='utf-8'))['flags']['M']
          if flags!=expected_m or len(flags)!=47: issues.append(f'M flags {len(flags)}')
          lc4=json.load(open('data/series/lois-and-clark/season-04.json',encoding='utf-8'))
          order=[(x['id'],x['title'],x['airDate']) for x in lc4['episodes'] if x['id'] in ('s04e14','s04e15','s04e16')]
          if order!=[('s04e14','A.K.A. Superman','1997-03-16'),('s04e15','Meet John Doe','1997-03-02'),('s04e16','Lois and Clarks','1997-03-09')]: issues.append(f'Lois S4 {order}')
          leg1=json.load(open('data/series/legend-of-the-seeker/season-01.json',encoding='utf-8'))
          lc1=json.load(open('data/series/lois-and-clark/season-01.json',encoding='utf-8'))
          if (leg1['episodes'][0]['id'],leg1['episodes'][0]['runtimeSeconds'])!=('s01e01-02',5323): issues.append('Legend pilot')
          if (lc1['episodes'][0]['id'],lc1['episodes'][0]['runtimeSeconds'])!=('s01e01-02',5549): issues.append('Lois pilot')

          leftovers=['.tmp-tv-batch-payload.b64','.tmp-integrate-tv-batch.py','.tmp-repair-tv-payload.py','.tmp-rebuild-tv-batch.py','tv-batch-research.tmp.json','tmp-tv-batch-research','.github/workflows/fetch-tv-batch-research.yml','.github/workflows/integrate-tv-batch-k-l.yml']
          for p in leftovers:
            if os.path.exists(p): issues.append('leftover '+p)

          if issues:
            print('POST-WRITE AUDIT FAILED')
            for z in issues: print(' -',z)
            raise SystemExit(1)
          print('POST-WRITE AUDIT PASSED: committed state = 6 series / 15 seasons / 218 conceptual / 216 scoring / 216 unique descriptions / 578159 seconds / 47 Lois M flags; no integration leftovers.')
          PY
