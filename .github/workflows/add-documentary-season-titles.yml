name: Add documentary season titles
on:
  push:
    paths:
      - '.github/workflows/add-documentary-season-titles.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add underlying series titles to custom documentary seasons
        run: |
          python - <<'PY'
          import json, pathlib

          root = pathlib.Path('.')
          season_titles = {
              'brian-coxs-wonders-2008': {
                  1: 'Wonders of the Solar System',
                  2: 'Wonders of the Universe',
                  3: 'Forces of Nature',
                  4: 'The Planets',
                  5: 'Solar System',
              },
              'iain-stewarts-earth-2004': {
                  1: 'Journeys from the Centre of the Earth',
                  2: 'Earth: The Power of the Planet',
                  3: 'How Earth Made Us',
                  4: 'Men of Rock',
                  5: 'Rise of the Continents',
              },
          }

          for rel in ['data/series/index.json', 'data/series/index-additions.json']:
              path = root / rel
              data = json.loads(path.read_text(encoding='utf-8'))
              changed = False
              for series in data.get('series', []):
                  mapping = season_titles.get(series.get('id'))
                  if not mapping:
                      continue
                  for season in series.get('seasons', []):
                      title = mapping.get(int(season.get('number', 0)))
                      if title and season.get('title') != title:
                          season['title'] = title
                          changed = True
              if changed:
                  path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          path = root / 'series-tv.js'
          text = path.read_text(encoding='utf-8')
          old_list = '<div><div class="seasonBannerTitle">Season ${String(season.number).padStart(2,"0")}</div><div class="seasonBannerMeta">${escapeHtml(`${year} · ${episodeText}${entryText}`)}</div></div>'
          new_list = '<div><div class="seasonBannerTitle">${escapeHtml(`Season ${String(season.number).padStart(2,"0")}${season.title?`: ${season.title}`:""}`)}</div><div class="seasonBannerMeta">${escapeHtml(`${year} · ${episodeText}${entryText}`)}</div></div>'
          if old_list not in text:
              raise SystemExit('Season-list title markup not found')
          text = text.replace(old_list, new_list, 1)

          old_detail = '<h1>Season ${String(seasonData.season).padStart(2,"0")}</h1>'
          new_detail = '<h1>${escapeHtml(`Season ${String(seasonData.season).padStart(2,"0")}${seasonMeta?.title?`: ${seasonMeta.title}`:""}`)}</h1>'
          if old_detail not in text:
              raise SystemExit('Season-detail heading markup not found')
          text = text.replace(old_detail, new_detail, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          python - <<'PY'
          import json
          expected = {
            'brian-coxs-wonders-2008': ['Wonders of the Solar System','Wonders of the Universe','Forces of Nature','The Planets','Solar System'],
            'iain-stewarts-earth-2004': ['Journeys from the Centre of the Earth','Earth: The Power of the Planet','How Earth Made Us','Men of Rock','Rise of the Continents'],
          }
          found = {}
          for rel in ['data/series/index.json','data/series/index-additions.json']:
              data=json.load(open(rel,encoding='utf-8'))
              for s in data['series']:
                  if s['id'] in expected:
                      found[s['id']]=[x.get('title') for x in s['seasons']]
          assert found == expected, (found, expected)
          js=open('series-tv.js',encoding='utf-8').read()
          assert 'season.title?`: ${season.title}`' in js
          assert 'seasonMeta?.title?`: ${seasonMeta.title}`' in js
          PY
          rm -f .github/workflows/add-documentary-season-titles.yml
          git config user.name soap2
          git config user.email 46655904+soap2@users.noreply.github.com
          git add -A
          git commit -m 'Show documentary source titles on seasons'
          git push
