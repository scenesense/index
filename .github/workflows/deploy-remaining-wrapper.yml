name: Finalize remaining SceneSense library

on:
  push:
    paths:
      - FINALIZE_REMAINING_TRIGGER

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - name: Execute corrected library build
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          s=Path('.github/workflows/deploy-remaining-library.yml').read_text(encoding='utf-8')
          for old,new in {
            "'Cant Buy My Love|2017'":"'Can t Buy My Love|2017'",
            "'Cant Hardly Wait|1998'":"'Can t Hardly Wait|1998'",
            "'Charlies Angels|1976'":"'Charlie s Angels|1976'",
            "'Guess Whos Coming to Dinner|1967'":"'Guess Who s Coming to Dinner|1967'"
          }.items():
              if old not in s: raise RuntimeError(f'Missing runtime key {old}')
              s=s.replace(old,new)
          start="      - name: Build 153-film library\n        run: |\n          python - <<'PY'\n"
          end="\n          PY\n      - name: Remove temporary migration machinery"
          if start not in s or end not in s: raise RuntimeError('Could not extract deployment program')
          code=s.split(start,1)[1].split(end,1)[0]
          code=textwrap.dedent(code)
          exec(compile(code,'deploy_remaining.py','exec'),{})
          PY
      - name: Validate and commit library only
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('data/movies.json',encoding='utf-8'))
          assert len(d['movies'])==153
          assert len({m['id'] for m in d['movies']})==153
          assert all(m.get('runtimeExact') and isinstance(m.get('runtimeSeconds'),int) for m in d['movies'])
          assert all(m['poster'].startswith('assets/posters/') and m['poster'].endswith('.webp') for m in d['movies'])
          assert all(os.path.isfile(m['poster']) for m in d['movies'])
          assert sum(1 for m in d['movies'] if m.get('ratings')) >= 2
          print('153-film validation passed')
          PY
          git config user.name "SceneSense Library Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/movies.json index.html assets/posters
          git diff --cached --stat
          git commit -m "Add remaining 103 films and exact runtimes"
          git push origin HEAD:main
