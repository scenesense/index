name: Remove Lake House fantasy genre

on:
  push:
    paths:
      - '.github/workflows/remove-lake-house-fantasy.yml'

permissions:
  contents: write

jobs:
  fix-genre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove Fantasy from The Lake House
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('data/movies-additions-20260830.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          matches = [m for m in data['movies'] if m.get('id') == 'the-lake-house-2006']
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one Lake House record, found {len(matches)}')
          movie = matches[0]
          genres = movie.get('genres', [])
          if 'Fantasy' not in genres:
              raise SystemExit(f'Fantasy not present in current genres: {genres}')
          movie['genres'] = [g for g in genres if g != 'Fantasy']
          if movie['genres'] != ['Romance', 'Drama']:
              raise SystemExit(f'Unexpected resulting genres: {movie["genres"]}')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "SceneSense maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add data/movies-additions-20260830.json
          git commit -m "Remove Fantasy genre from The Lake House"
          git push origin HEAD:main
