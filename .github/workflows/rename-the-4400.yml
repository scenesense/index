name: Rename The 4400
on:
  push:
    branches: [main]
    paths:
      - '.tmp-rename-the-4400-trigger.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rename visible title and preserve runtime binding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          movies_path = Path('data/movies-additions-20260830.json')
          runtimes_path = Path('data/exact_runtimes_manifest.json')
          old = 'The Forty Four Hundred'
          new = 'The 4400'

          movies_text = movies_path.read_text(encoding='utf-8')
          runtimes_text = runtimes_path.read_text(encoding='utf-8')
          if movies_text.count(f'"title": "{old}"') != 1:
              raise SystemExit('Expected exactly one old supplemental movie title')
          if runtimes_text.count(f'"title": "{old}"') != 1:
              raise SystemExit('Expected exactly one old runtime title')

          movies_path.write_text(movies_text.replace(f'"title": "{old}"', f'"title": "{new}"', 1), encoding='utf-8')
          runtimes_path.write_text(runtimes_text.replace(f'"title": "{old}"', f'"title": "{new}"', 1), encoding='utf-8')

          movies = json.loads(movies_path.read_text(encoding='utf-8'))
          movie = next((m for m in movies.get('movies', []) if m.get('id') == 'the-forty-four-hundred-2004'), None)
          if not movie:
              raise SystemExit('Target movie ID missing')
          if movie.get('title') != new:
              raise SystemExit('Target movie title not updated')
          if movie.get('runtimeSeconds') != 10578 or movie.get('runtimeExact') != '02:56:18':
              raise SystemExit('Movie runtime changed unexpectedly')

          runtimes = json.loads(runtimes_path.read_text(encoding='utf-8'))
          matches = [r for r in runtimes if r.get('title') == new and r.get('year') == 2004 and r.get('version') == 'Special Edition']
          if len(matches) != 1:
              raise SystemExit('Expected exactly one renamed runtime binding')
          runtime = matches[0]
          if runtime.get('runtimeSeconds') != 10578 or runtime.get('runtimeExact') != '02:56:18':
              raise SystemExit('Runtime manifest values changed unexpectedly')
          if old in movies_path.read_text(encoding='utf-8') or old in runtimes_path.read_text(encoding='utf-8'):
              raise SystemExit('Old visible title remains')
          print('THE 4400 RENAME AUDIT PASSED')
          PY
      - name: Commit rename and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/rename-the-4400.yml .tmp-rename-the-4400-trigger.txt
          git add data/movies-additions-20260830.json data/exact_runtimes_manifest.json .github/workflows/rename-the-4400.yml .tmp-rename-the-4400-trigger.txt
          git commit -m "Rename The Forty Four Hundred to The 4400"
          git push origin main
